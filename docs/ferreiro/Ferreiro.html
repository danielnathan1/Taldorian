<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Taldorian TCG — O Ferreiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;500;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --gold:        oklch(0.73 0.13 78);
  --gold-dim:    oklch(0.55 0.10 78);
  --gold-glow:   oklch(0.82 0.16 80);
  --gold-soft:   oklch(0.73 0.13 78 / 0.25);
  --crimson:     oklch(0.42 0.20 15);
  --crimson-br:  oklch(0.58 0.23 18);
  --crimson-glow:oklch(0.68 0.24 22);
  --green:       oklch(0.55 0.18 145);
  --parchment:   oklch(0.91 0.025 78);
  --parchment-d: oklch(0.72 0.03 78);
  --bg-deep:     oklch(0.07 0.055 268);
  --bg-mid:      oklch(0.10 0.04 268);
  --bg-surface:  oklch(0.13 0.035 268);
  --border:      oklch(0.73 0.13 78 / 0.18);
  --border-strong: oklch(0.73 0.13 78 / 0.35);
  --rar-c: oklch(0.70 0.02 78);
}

html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: var(--bg-deep);
  font-family: 'Crimson Pro', Georgia, serif;
  color: var(--parchment);
}

/* Atmospheric BG — fornalha quente embaixo */
body::before {
  content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(ellipse 90% 55% at 50% 108%, oklch(0.32 0.16 32 / 0.30) 0%, transparent 58%),
    radial-gradient(ellipse 55% 48% at 14% 2%,  oklch(0.26 0.10 262 / 0.20) 0%, transparent 55%),
    radial-gradient(ellipse 45% 40% at 92% 4%,  oklch(0.22 0.08 280 / 0.18) 0%, transparent 50%),
    linear-gradient(178deg, oklch(0.10 0.06 270) 0%, oklch(0.07 0.05 260) 52%, oklch(0.08 0.05 26) 100%);
}
body::after {
  content:''; position:fixed; inset:0; z-index:1; pointer-events:none;
  background: radial-gradient(ellipse 120% 50% at 50% 108%, oklch(0.30 0.14 30 / 0.30) 0%, transparent 62%);
}

#root { position: relative; z-index: 10; width: 100vw; height: 100vh; display: flex; flex-direction: column; }
.fe-screen { width: 100%; height: 100%; display: flex; flex-direction: column; min-height: 0; }
button { font-family: inherit; color: inherit; background: none; border: none; cursor: pointer; outline: none; }
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }
::-webkit-scrollbar-track { background: transparent; }

/* ───────── HEADER ───────── */
.top-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 22px; height: 64px; gap: 18px; flex-shrink: 0;
  background: oklch(0.08 0.04 268 / 0.78);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(14px); position: relative; z-index: 30;
}
.header-left, .header-right { display: flex; align-items: center; gap: 14px; }
.back-btn {
  display: flex; align-items: center; gap: 8px;
  font-family: 'Cinzel', serif; font-size: 0.7rem; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--gold-dim); padding: 8px 12px; border: 1px solid transparent;
  transition: color .2s, border-color .2s;
}
.back-btn:hover:not(:disabled) { color: var(--gold); border-color: var(--gold-soft); }
.back-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.header-sep { width: 1px; height: 28px; background: var(--border); }
.eyebrow-line { font-family: 'Cinzel', serif; font-size: 0.6rem; letter-spacing: 0.35em; text-transform: uppercase; color: var(--gold-dim); opacity: 0.7; }
.eyebrow-title {
  font-family: 'Cinzel Decorative', cursive; font-size: 1rem; font-weight: 700; letter-spacing: 0.04em;
  background: linear-gradient(160deg, var(--gold-glow) 0%, var(--gold) 70%);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.gold-purse {
  display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 12px;
  background: linear-gradient(155deg, oklch(0.14 0.05 78 / 0.5), oklch(0.10 0.04 268 / 0.5));
  border: 1px solid var(--border-strong); position: relative;
}
.gold-purse .coin {
  width: 22px; height: 22px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, var(--gold-glow), var(--gold) 55%, oklch(0.45 0.08 78) 100%);
  box-shadow: 0 0 12px oklch(0.73 0.13 78 / 0.5), inset 0 1px 0 oklch(0.92 0.10 80); position: relative;
}
.gold-purse .coin::after { content:'✦'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: oklch(0.30 0.10 60); font-size: 0.7rem; font-weight: 900; }
.gold-purse .gold-label { font-family: 'Cinzel', serif; font-size: 0.6rem; letter-spacing: 0.28em; text-transform: uppercase; color: var(--gold-dim); }
.gold-purse .gold-value { font-family: 'Cinzel Decorative', cursive; font-size: 1.05rem; font-weight: 700; color: var(--gold-glow); letter-spacing: 0.04em; transition: color .25s; }
.gold-purse .gold-value.flash { color: oklch(0.85 0.18 18); }

/* Eyebrow / ornament shared */
.pane-eyebrow { font-family: 'Cinzel', serif; font-size: 0.62rem; letter-spacing: 0.42em; text-transform: uppercase; color: var(--gold-dim); opacity: 0.75; }
.ornament { display: flex; align-items: center; gap: 10px; }
.ornament-line { width: 56px; height: 1px; background: linear-gradient(to right, transparent, var(--gold-dim)); }
.ornament-diamond { width: 6px; height: 6px; background: var(--gold); transform: rotate(45deg); box-shadow: 0 0 6px var(--gold); }
.mini-coin { width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, var(--gold-glow), var(--gold) 55%, oklch(0.45 0.08 78) 100%); box-shadow: inset 0 1px 0 oklch(0.92 0.10 80); display: inline-block; }
.clear-link { font-family: 'Cinzel', serif; font-size: 0.62rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold-dim); border-bottom: 1px solid transparent; margin-left: 12px; }
.clear-link:hover { color: var(--crimson-glow); border-color: var(--crimson-glow); }

/* ═════════════ HUB ═════════════ */
.hub-body { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 40px 48px; overflow: hidden; }
.hub-forge-bg { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.forge-fire { position: absolute; left: 50%; bottom: -18%; transform: translateX(-50%); width: 70%; height: 50%;
  background: radial-gradient(ellipse at 50% 100%, oklch(0.55 0.20 40 / 0.30) 0%, oklch(0.40 0.18 30 / 0.12) 40%, transparent 70%);
  filter: blur(8px); animation: fireBreathe 4s ease-in-out infinite; }
@keyframes fireBreathe { 0%,100% { opacity: 0.7; transform: translateX(-50%) scaleY(1); } 50% { opacity: 1; transform: translateX(-50%) scaleY(1.12); } }
.ember-field { position: absolute; inset: 0; }
.ember { position: absolute; bottom: -10px; left: var(--ex); width: 3px; height: 3px; border-radius: 50%;
  background: oklch(0.80 0.18 50); box-shadow: 0 0 8px oklch(0.70 0.20 45); opacity: 0;
  animation: emberRise var(--ed) linear var(--edl) infinite; }
@keyframes emberRise { 0% { opacity: 0; transform: translateY(0) translateX(0) scale(1); } 15% { opacity: 0.9; } 100% { opacity: 0; transform: translateY(-92vh) translateX(var(--edx)) scale(0.3); } }

.hub-intro { position: relative; z-index: 2; text-align: center; display: flex; flex-direction: column; align-items: center; margin-bottom: 38px; }
.hub-mark { margin-bottom: 14px; filter: drop-shadow(0 0 14px oklch(0.73 0.13 78 / 0.4)); }
.hub-title { font-family: 'Cinzel Decorative', cursive; font-size: 3rem; font-weight: 900; letter-spacing: 0.03em; line-height: 1; margin: 8px 0 14px;
  background: linear-gradient(165deg, var(--gold-glow) 0%, var(--gold) 45%, var(--gold-dim) 100%);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 2px 12px oklch(0.40 0.10 40 / 0.4)); }
.hub-sub { font-family: 'Crimson Pro', serif; font-style: italic; font-size: 1.05rem; color: var(--parchment-d); opacity: 0.8; max-width: 560px; line-height: 1.5; margin-bottom: 18px; text-wrap: pretty; }

.hub-options { position: relative; z-index: 2; display: flex; gap: 22px; width: 100%; max-width: 1080px; justify-content: center; }
.forge-option { position: relative; flex: 1; max-width: 340px; min-height: 260px; text-align: left;
  display: flex; flex-direction: column; gap: 14px; padding: 26px 24px 24px;
  background: linear-gradient(165deg, oklch(0.14 0.04 268) 0%, oklch(0.085 0.04 268) 100%);
  border: 1px solid var(--border); overflow: hidden;
  transition: transform .25s cubic-bezier(.22,1,.36,1), border-color .25s, box-shadow .25s; }
.forge-option:not(.locked):hover { transform: translateY(-6px); border-color: var(--opt-accent); box-shadow: 0 18px 50px oklch(0.04 0.03 268 / 0.6), 0 0 0 1px var(--opt-accent); }
.forge-option.locked { opacity: 0.5; cursor: not-allowed; filter: saturate(0.6); }
.fo-glow { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 60% at 50% 0%, var(--opt-accent) 0%, transparent 60%); opacity: 0; transition: opacity .3s; mix-blend-mode: screen; pointer-events: none; }
.forge-option:not(.locked):hover .fo-glow { opacity: 0.16; }
.fo-index { font-family: 'Cinzel Decorative', cursive; font-size: 0.85rem; color: var(--gold-dim); letter-spacing: 0.1em; opacity: 0.6; }
.fo-icon { font-size: 2.6rem; line-height: 1; filter: drop-shadow(0 0 12px var(--opt-accent)); color: var(--opt-accent); }
.fo-body { flex: 1; display: flex; flex-direction: column; }
.fo-eyebrow { font-family: 'Cinzel', serif; font-size: 0.58rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--gold-dim); opacity: 0.7; margin-bottom: 6px; }
.fo-title { font-family: 'Cinzel Decorative', cursive; font-size: 1.3rem; font-weight: 700; color: var(--parchment); letter-spacing: 0.02em; margin-bottom: 10px; }
.forge-option:not(.locked):hover .fo-title { color: var(--gold-glow); }
.fo-desc { font-family: 'Crimson Pro', serif; font-size: 0.92rem; line-height: 1.5; color: var(--parchment-d); opacity: 0.78; text-wrap: pretty; }
.fo-arrow { font-family: 'Cinzel', serif; font-size: 1.1rem; color: var(--gold-dim); align-self: flex-end; transition: transform .25s, color .25s; }
.forge-option:not(.locked):hover .fo-arrow { color: var(--gold-glow); transform: translateX(4px); }
.fo-ribbon { position: absolute; top: 14px; right: -34px; transform: rotate(45deg); background: oklch(0.18 0.05 268); color: var(--parchment-d); font-family: 'Cinzel', serif; font-size: 0.55rem; letter-spacing: 0.2em; text-transform: uppercase; padding: 4px 40px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.fo-corner { position: absolute; width: 12px; height: 12px; border-color: var(--opt-accent); border-style: solid; opacity: 0.45; }
.fo-corner.tl { top: 7px; left: 7px; border-width: 1px 0 0 1px; } .fo-corner.tr { top: 7px; right: 7px; border-width: 1px 1px 0 0; }
.fo-corner.bl { bottom: 7px; left: 7px; border-width: 0 0 1px 1px; } .fo-corner.br { bottom: 7px; right: 7px; border-width: 0 1px 1px 0; }

/* ═════════════ RANDOM FORGE ═════════════ */
.random-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 380px; gap: 0; }
.forge-main { display: flex; flex-direction: column; padding: 26px 40px 24px; min-width: 0; overflow-y: auto;
  background: radial-gradient(ellipse 75% 60% at 50% 38%, oklch(0.13 0.05 268 / 0.6) 0%, transparent 72%); }
.forge-stage-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; min-height: 0; padding: 8px 0 4px; }
.forge-ambient { position: absolute; top: 42%; left: 50%; transform: translate(-50%,-50%); width: 560px; height: 360px;
  background: radial-gradient(ellipse, oklch(0.45 0.16 36 / 0.18) 0%, transparent 68%); filter: blur(12px); pointer-events: none; animation: fireBreathe 5s ease-in-out infinite; }

/* a pedra-runa */
.runestone { position: relative; padding: 30px 34px 22px; border-radius: 8px 8px 4px 4px;
  background:
    radial-gradient(ellipse at 50% 0%, oklch(0.26 0.03 270) 0%, transparent 60%),
    linear-gradient(176deg, oklch(0.20 0.025 270) 0%, oklch(0.13 0.02 268) 55%, oklch(0.09 0.02 266) 100%);
  border: 1px solid oklch(0.34 0.04 270 / 0.7);
  box-shadow: inset 0 1px 0 oklch(0.45 0.05 270 / 0.5), inset 0 -20px 40px oklch(0.04 0.02 268 / 0.7), 0 24px 60px oklch(0.03 0.02 268 / 0.7); }
.runestone::before { content:''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: repeating-linear-gradient(118deg, transparent 0 22px, oklch(0 0 0 / 0.10) 22px 23px), repeating-linear-gradient(64deg, transparent 0 30px, oklch(1 1 1 / 0.015) 30px 31px); }
.runestone-rune { position: absolute; border-radius: 50%; border: 1px solid oklch(0.62 0.13 60 / 0.25); pointer-events: none; opacity: 0.5; }
.runestone-rune.r1 { width: 60px; height: 60px; top: 12px; left: 14px; }
.runestone-rune.r2 { width: 40px; height: 40px; bottom: 12px; right: 18px; border-style: dashed; }
.runestone-crack { position: absolute; background: oklch(0.05 0.02 268); pointer-events: none; opacity: 0.5; }
.runestone-crack.c1 { width: 2px; height: 40%; top: 0; left: 30%; transform: rotate(8deg); }
.runestone-crack.c2 { width: 2px; height: 30%; bottom: 0; right: 38%; transform: rotate(-12deg); }
.runestone-base { position: absolute; left: -6px; right: -6px; bottom: -10px; height: 16px; border-radius: 0 0 6px 6px;
  background: linear-gradient(180deg, oklch(0.12 0.02 268), oklch(0.06 0.02 268)); box-shadow: 0 10px 26px oklch(0.02 0.02 268 / 0.7); }

.sockets { position: relative; z-index: 2; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; max-width: 760px; }
.socket { position: relative; width: clamp(88px, 9vw, 116px); aspect-ratio: 2 / 3; cursor: default;
  border: 1px solid oklch(0.40 0.05 270 / 0.6); border-radius: 4px;
  background: linear-gradient(180deg, oklch(0.06 0.02 268) 0%, oklch(0.10 0.02 268) 100%);
  box-shadow: inset 0 3px 12px oklch(0.02 0.01 268 / 0.9), inset 0 -1px 0 oklch(0.40 0.05 270 / 0.4);
  display: flex; align-items: center; justify-content: center; transition: box-shadow .3s, border-color .3s; }
.socket.filled { cursor: pointer; border-color: var(--gold-soft); }
.socket-empty { opacity: 0.32; filter: grayscale(0.4); animation: socketIdle 3.5s ease-in-out infinite; }
@keyframes socketIdle { 0%,100% { opacity: 0.22; } 50% { opacity: 0.42; } }
.socket-card { position: relative; width: 100%; height: 100%; animation: socketDrop .4s cubic-bezier(.34,1.56,.64,1); }
@keyframes socketDrop { 0% { transform: translateY(-30px) scale(.8); opacity: 0; } 100% { transform: translateY(0) scale(1); opacity: 1; } }
.socket-x { position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; border-radius: 50%; background: oklch(0.18 0.06 18 / 0.9); border: 1px solid var(--crimson-br); color: oklch(0.9 0.08 30); font-size: 0.7rem; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity .2s; z-index: 5; }
.socket.filled:hover .socket-x { opacity: 1; }
.socket.filled:hover { box-shadow: inset 0 0 0 1px var(--crimson-br), 0 0 16px oklch(0.5 0.2 20 / 0.4); }
.socket-glow { position: absolute; inset: -1px; border-radius: 4px; pointer-events: none; box-shadow: 0 0 0 1px var(--gold-soft), 0 0 18px oklch(0.73 0.13 78 / 0.3); opacity: 0; transition: opacity .3s; }
.socket.filled .socket-glow { opacity: 1; }

.forge-stage-caption { margin-top: 18px; font-family: 'Cinzel', serif; font-size: 0.7rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold-dim); text-align: center; }

/* odds bar */
.odds-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 22px 0 18px; }
.odds-cell { position: relative; padding: 12px 14px 16px; background: linear-gradient(160deg, oklch(0.12 0.035 268 / 0.7), oklch(0.08 0.035 268 / 0.7));
  border: 1px solid var(--border); display: grid; grid-template-columns: auto 1fr auto; grid-template-rows: auto auto; gap: 2px 10px; align-items: center; overflow: hidden; }
.odds-cell::before { content:''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--tier-c); box-shadow: 0 0 10px var(--tier-g); }
.odds-cell.chromatic::before { background: conic-gradient(from 0deg, oklch(0.75 0.24 20), oklch(0.80 0.22 130), oklch(0.74 0.24 250), oklch(0.74 0.24 320), oklch(0.75 0.24 20)); }
.odds-dot { grid-row: 1 / 3; width: 14px; height: 14px; border-radius: 50%; background: var(--tier-c); box-shadow: 0 0 12px var(--tier-g); }
.odds-cell.chromatic .odds-dot { background: conic-gradient(from 0deg, oklch(0.78 0.24 20), oklch(0.82 0.22 130), oklch(0.76 0.24 250), oklch(0.76 0.24 320), oklch(0.78 0.24 20)); animation: chromaSpin 4s linear infinite; }
@keyframes chromaSpin { to { filter: hue-rotate(360deg); } }
.odds-info { grid-row: 1 / 3; }
.odds-name { font-family: 'Cinzel Decorative', cursive; font-size: 0.92rem; font-weight: 700; color: var(--parchment); line-height: 1; }
.odds-light { font-family: 'Cinzel', serif; font-size: 0.52rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold-dim); opacity: 0.7; margin-top: 3px; }
.odds-val { grid-row: 1 / 3; font-family: 'Cinzel Decorative', cursive; font-size: 1.35rem; font-weight: 700; color: var(--tier-c); text-align: right; }
.odds-cell.chromatic .odds-val { color: oklch(0.82 0.16 320); }
.odds-pct { font-size: 0.7rem; opacity: 0.7; }
.odds-track { grid-column: 1 / 4; height: 3px; background: oklch(0.05 0.02 268); margin-top: 4px; }
.odds-fill { height: 100%; background: var(--tier-c); box-shadow: 0 0 8px var(--tier-g); transition: width .4s cubic-bezier(.22,1,.36,1); }
.odds-cell.chromatic .odds-fill { background: linear-gradient(90deg, oklch(0.75 0.22 20), oklch(0.78 0.22 160), oklch(0.74 0.24 320)); }

.forge-footer { display: flex; align-items: stretch; gap: 16px; margin-top: auto; }
.cost-box { flex-shrink: 0; padding: 10px 22px; background: oklch(0.08 0.035 268 / 0.7); border: 1px solid var(--border); display: flex; flex-direction: column; justify-content: center; min-width: 150px; }
.cost-label { font-family: 'Cinzel', serif; font-size: 0.56rem; letter-spacing: 0.28em; text-transform: uppercase; color: var(--gold-dim); margin-bottom: 4px; }
.cost-value { font-family: 'Cinzel Decorative', cursive; font-size: 1.4rem; font-weight: 700; color: var(--gold-glow); display: inline-flex; align-items: center; gap: 8px; }
.cost-value.insufficient { color: oklch(0.78 0.18 28); }

/* the big red FORGE button */
.forge-btn { flex: 1; position: relative; overflow: hidden;
  font-family: 'Cinzel', serif; font-weight: 700; font-size: 1.05rem; letter-spacing: 0.32em; text-transform: uppercase;
  display: flex; align-items: center; justify-content: center; gap: 14px;
  background: linear-gradient(160deg, var(--crimson-br) 0%, var(--crimson) 60%, oklch(0.30 0.16 14) 100%);
  color: oklch(0.96 0.05 40); border: 1px solid var(--crimson-glow);
  box-shadow: 0 8px 30px oklch(0.45 0.22 22 / 0.35), inset 0 1px 0 oklch(0.78 0.16 30 / 0.5), inset 0 -10px 24px oklch(0.20 0.12 14 / 0.5);
  text-shadow: 0 1px 4px oklch(0.18 0.10 14 / 0.8); transition: filter .2s, transform .12s, box-shadow .25s; }
.forge-btn .forge-btn-ic { display: flex; filter: drop-shadow(0 0 6px oklch(0.85 0.12 40)); }
.forge-btn:not(:disabled) { animation: forgePulse 2.4s ease-in-out infinite; }
@keyframes forgePulse { 0%,100% { box-shadow: 0 8px 30px oklch(0.45 0.22 22 / 0.30), inset 0 1px 0 oklch(0.78 0.16 30 / 0.5), inset 0 -10px 24px oklch(0.20 0.12 14 / 0.5); } 50% { box-shadow: 0 8px 40px oklch(0.55 0.24 24 / 0.55), 0 0 26px oklch(0.6 0.24 24 / 0.4), inset 0 1px 0 oklch(0.82 0.16 34 / 0.6), inset 0 -10px 24px oklch(0.20 0.12 14 / 0.5); } }
.forge-btn:hover:not(:disabled) { filter: brightness(1.12); transform: translateY(-1px); }
.forge-btn:active:not(:disabled) { transform: translateY(1px); }
.forge-btn:disabled { background: oklch(0.12 0.03 268 / 0.6); border-color: var(--border); color: var(--parchment-d); opacity: 0.6; cursor: not-allowed; text-shadow: none; box-shadow: none; }
.forge-btn:disabled .forge-btn-ic { display: none; }
.forge-btn.small { font-size: 0.85rem; letter-spacing: 0.22em; padding: 16px 18px; }
.forge-btn-shimmer { position: absolute; top: 0; left: -100%; width: 55%; height: 100%; background: linear-gradient(105deg, transparent, oklch(1 0 0 / 0.18), transparent); transform: skewX(-20deg); transition: left .6s; }
.forge-btn:hover:not(:disabled) .forge-btn-shimmer { left: 160%; }

/* ═════════════ INVENTORY PANEL ═════════════ */
.inv-panel { display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--border); background: oklch(0.065 0.035 268 / 0.5); }
.inv-panel.flush { border-left: none; border-top: 1px solid var(--border); flex: 1; }
.inv-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 18px 20px 14px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.inv-title { font-family: 'Cinzel Decorative', cursive; font-size: 1.15rem; font-weight: 700; color: var(--parchment); margin-top: 2px; }
.inv-filter { display: flex; gap: 4px; }
.inv-filter button { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; border: 1px solid var(--border); background: oklch(0.10 0.03 268 / 0.5); color: var(--parchment-d); font-family: 'Cinzel', serif; transition: all .15s; }
.inv-filter button:first-child { width: auto; padding: 0 10px; font-size: 0.6rem; letter-spacing: 0.16em; text-transform: uppercase; }
.inv-filter button:hover { border-color: var(--gold-soft); }
.inv-filter button.active { border-color: var(--gold); color: var(--gold-glow); background: oklch(0.16 0.06 78 / 0.4); }
.inv-grid { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 20px 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); grid-auto-rows: min-content; gap: 12px; align-content: start; }
.inv-empty { grid-column: 1 / -1; text-align: center; padding: 30px 0; color: var(--parchment-d); opacity: 0.6; font-style: italic; }

.inv-card { position: relative; display: flex; flex-direction: column; text-align: left; padding: 0; overflow: hidden;
  border: 1px solid var(--border); background: oklch(0.10 0.03 268); transition: transform .15s, border-color .15s, box-shadow .15s; }
.inv-card:not(.is-disabled):hover { transform: translateY(-3px); border-color: var(--gold); box-shadow: 0 8px 22px oklch(0.04 0.03 268 / 0.6), 0 0 0 1px var(--gold-soft); }
.inv-card.is-disabled { cursor: not-allowed; }
.inv-card.is-dimmed { opacity: 0.34; filter: saturate(0.4); }
.inv-card-art { position: relative; height: 78px; display: flex; align-items: center; justify-content: center;
  background: radial-gradient(ellipse at 50% 35%, color-mix(in oklch, var(--inv-art-top), transparent 30%), var(--inv-art-bot)); border-bottom: 1px solid oklch(0.04 0.02 268); }
.inv-glyph { font-size: 2rem; filter: drop-shadow(0 3px 6px oklch(0 0 0 / 0.5)); }
.inv-rar-pip { position: absolute; top: 4px; left: 4px; width: 17px; height: 17px; border-radius: 50%; background: var(--rar-color); border: 1px solid oklch(0.10 0.04 268); display: flex; align-items: center; justify-content: center; font-family: 'Cinzel', serif; font-weight: 800; font-size: 0.5rem; color: oklch(0.10 0.04 268); }
.inv-card-name { padding: 6px 8px 2px; font-family: 'Cinzel', serif; font-size: 0.62rem; line-height: 1.2; color: var(--parchment); letter-spacing: 0.01em; min-height: 28px; }
.inv-card-count { padding: 0 8px 7px; font-family: 'Cinzel Decorative', cursive; font-size: 0.72rem; color: var(--gold); }

/* ═════════════ CARD FACE — proporcional via container query (cqi) ═════════════ */
.card-face { container-type: inline-size; width: 100%; height: 100%; position: relative; display: flex; flex-direction: column; overflow: hidden;
  background: linear-gradient(170deg, oklch(0.85 0.04 78) 0%, oklch(0.80 0.03 78) 50%, oklch(0.72 0.03 78) 100%);
  border: max(2px, 1.6cqi) solid #0a0805; box-shadow: 0 0 0 1px var(--face-glow, transparent), 0 18px 44px oklch(0.04 0.03 268 / 0.6); color: #0d0a06; }
.card-face .face-title-bar { padding: 4cqi 5cqi; text-align: center; background: linear-gradient(180deg, oklch(0.78 0.05 78) 0%, oklch(0.65 0.08 78) 100%);
  border-bottom: 1px solid oklch(0.40 0.06 78); font-family: 'Cinzel Decorative', cursive; font-size: 8cqi; font-weight: 800; letter-spacing: 0.01em; line-height: 1.05; text-shadow: 0 1px 0 oklch(0.92 0.06 80 / 0.4); }
.card-face .face-art-box { flex: 1; min-height: 38cqi; position: relative; margin: 4cqi 5cqi 0; border: 1px solid #0a0805; display: flex; align-items: center; justify-content: center; overflow: hidden;
  background: radial-gradient(ellipse at 50% 30%, color-mix(in oklch, var(--pip-bg) 50%, transparent), transparent 70%), linear-gradient(180deg, var(--face-art-top, oklch(0.68 0.22 38)) 0%, var(--face-art-bot, oklch(0.40 0.16 250)) 100%); }
.card-face .face-art-box::before { content:''; position: absolute; inset: 0; background: repeating-linear-gradient(125deg, transparent 0 8px, oklch(0 0 0 / 0.04) 8px 9px); pointer-events: none; }
.card-face .face-element-glyph { font-size: 38cqi !important; filter: drop-shadow(0 6px 16px oklch(0 0 0 / 0.5)); opacity: 0.95; z-index: 1; }
.card-face .face-element-pip { position: absolute; bottom: -9cqi; left: 50%; transform: translateX(-50%); width: 22cqi; height: 22cqi; border-radius: 50%; background: var(--pip-bg, oklch(0.78 0.18 38)); border: 1.4cqi solid oklch(0.92 0.05 78); box-shadow: 0 4px 10px oklch(0 0 0 / 0.35); display: flex; align-items: center; justify-content: center; font-size: 10cqi; z-index: 2; }
.card-face .face-effect { flex-shrink: 0; margin: 13cqi 6cqi 1cqi; text-align: center; font-family: 'Crimson Pro', serif; font-size: 6.6cqi; line-height: 1.25; color: #0d0a06; }
.card-face .face-footer { position: relative; padding: 4cqi 6cqi 5cqi; margin: 0 4cqi 3cqi; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 4cqi; }
.card-face .face-atk, .card-face .face-def { width: 24cqi; height: 24cqi; display: flex; align-items: center; justify-content: center; font-family: 'Cinzel Decorative', cursive; font-weight: 800; font-size: 9cqi; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.5); position: relative; }
.card-face .face-atk { justify-self: start; } .card-face .face-def { justify-self: end; }
.card-face .face-atk::before, .card-face .face-def::before { content: ''; position: absolute; inset: 0; z-index: -1; border-radius: 50%; border: 1px solid oklch(0.18 0.04 268); }
.card-face .face-atk::before { background: radial-gradient(circle, oklch(0.55 0.20 32), oklch(0.30 0.16 28)); }
.card-face .face-def::before { background: radial-gradient(circle, oklch(0.55 0.06 78), oklch(0.30 0.04 78)); }
.card-face .face-meta { display: flex; flex-direction: column; align-items: center; gap: 1cqi; }
.card-face .face-type { font-family: 'Crimson Pro', serif; font-style: italic; font-size: 5.5cqi; color: #2c241a; }
.card-face .face-rarity-pip { width: 14cqi; height: 14cqi; border-radius: 50%; background: var(--rar-color); border: 1.4cqi solid oklch(0.30 0.04 78); display: flex; align-items: center; justify-content: center; font-family: 'Cinzel', serif; font-weight: 800; font-size: 5cqi; color: oklch(0.10 0.04 268); }
.card-face.rare-glow { filter: drop-shadow(0 0 12px var(--face-glow, transparent)); }
.card-face.rare-glow::before { content:''; position: absolute; inset: 0; background: linear-gradient(125deg, transparent 30%, oklch(1 0 0 / 0.15) 50%, transparent 70%); pointer-events: none; z-index: 5; animation: faceShine 2.6s ease-in-out infinite; }
@keyframes faceShine { 0%,100% { transform: translateX(-60%); opacity: 0; } 40% { opacity: 1; } 60% { transform: translateX(120%); opacity: 0; } }

/* ═════════════ SHAKE ═════════════ */
.shaking { animation: feShake 0.4s linear infinite; }
.shaking.shake-lo  { animation-name: feShakeLo; }
.shaking.shake-mid { animation-name: feShakeMid; }
.shaking.shake-hi  { animation-name: feShakeHi; }
@keyframes feShakeLo  { 0%,100% { transform: translate(0,0) } 25% { transform: translate(-2px,1px) } 50% { transform: translate(2px,-1px) } 75% { transform: translate(-1px,2px) } }
@keyframes feShakeMid { 0%,100% { transform: translate(0,0) rotate(0) } 20% { transform: translate(-5px,3px) rotate(-0.3deg) } 40% { transform: translate(6px,-3px) rotate(0.3deg) } 60% { transform: translate(-4px,4px) rotate(-0.2deg) } 80% { transform: translate(5px,-2px) rotate(0.25deg) } }
@keyframes feShakeHi  { 0%,100% { transform: translate(0,0) rotate(0) } 15% { transform: translate(-10px,6px) rotate(-0.6deg) } 30% { transform: translate(11px,-7px) rotate(0.6deg) } 45% { transform: translate(-9px,8px) rotate(-0.5deg) } 60% { transform: translate(10px,-5px) rotate(0.55deg) } 80% { transform: translate(-7px,4px) rotate(-0.4deg) } }

/* ═════════════ CATACLYSM OVERLAY ═════════════ */
.cataclysm { position: fixed; inset: 0; z-index: 600; overflow: hidden; pointer-events: none; }
.cataclysm.phase-reveal { pointer-events: auto; }
.cata-veil { position: absolute; inset: 0; background: radial-gradient(ellipse 70% 60% at 50% 50%, oklch(0.06 0.03 268 / 0.6) 0%, oklch(0.03 0.02 268 / 0.92) 100%); animation: veilIn .3s ease-out; }
@keyframes veilIn { from { opacity: 0; } to { opacity: 1; } }

.cracks { position: absolute; top: 50%; left: 50%; width: 0; height: 0; }
.crack { position: absolute; left: 0; top: 0; width: 3px; transform-origin: 50% 100%;
  background: linear-gradient(to top, oklch(0.85 0.16 50) 0%, oklch(0.6 0.18 40 / 0.6) 40%, transparent 100%);
  box-shadow: 0 0 10px oklch(0.7 0.2 45); animation: crackGrow .5s cubic-bezier(.5,0,.5,1) both; }
@keyframes crackGrow { from { transform: translate(-50%,-100%) scaleY(0) rotate(var(--r,0)); } }
.cracks .crack { animation-name: crackOpacity; }
@keyframes crackOpacity { 0% { opacity: 0; clip-path: inset(100% 0 0 0); } 30% { opacity: 1; } 100% { opacity: 0.85; clip-path: inset(0 0 0 0); } }

.bolts { position: absolute; inset: 0; }
.bolt { position: absolute; top: -2%; height: 60%; width: 60px; opacity: 0; filter: drop-shadow(0 0 8px oklch(0.85 0.16 250)); animation: boltStrike 1s steps(1) infinite; }
@keyframes boltStrike { 0%, 92% { opacity: 0; } 93% { opacity: 1; } 95% { opacity: 0.2; } 96% { opacity: 0.9; } 98%, 100% { opacity: 0; } }
.bolt-flash { position: absolute; inset: 0; background: oklch(0.9 0.08 250 / 0.12); opacity: 0; animation: boltFlash 0.7s ease-out infinite; }
@keyframes boltFlash { 0%, 80% { opacity: 0; } 85% { opacity: 1; } 100% { opacity: 0; } }

.cata-cards { position: absolute; top: 50%; left: 50%; width: 0; height: 0; }
.cata-card { position: absolute; top: 0; left: 0; width: clamp(120px, 14vw, 180px); aspect-ratio: 2 / 3; transform-origin: center; }

.cata-light { position: absolute; top: 50%; left: 50%; width: 40px; height: 40px; border-radius: 50%; transform: translate(-50%,-50%) scale(0); opacity: 0; pointer-events: none; mix-blend-mode: screen; filter: blur(2px); }
.cata-light.on { animation: lightGrow 1.4s cubic-bezier(.4,0,.2,1) forwards; }
.cata-light.on.phase-reveal { animation: lightSettle 0.6s ease-out forwards; }
@keyframes lightGrow { 0% { transform: translate(-50%,-50%) scale(0); opacity: 0; } 30% { opacity: 0.9; } 70% { transform: translate(-50%,-50%) scale(14); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(24); opacity: 1; } }
@keyframes lightSettle { 0% { transform: translate(-50%,-50%) scale(24); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(9); opacity: 0.55; } }
.cata-light.chromatic { animation-name: lightGrow, chromaSpin; animation-duration: 1.4s, 3s; animation-iteration-count: 1, infinite; animation-timing-function: cubic-bezier(.4,0,.2,1), linear; }

.cata-rays { position: absolute; top: 50%; left: 50%; width: 160vmax; height: 160vmax; transform: translate(-50%,-50%) scale(0); opacity: 0; pointer-events: none; mix-blend-mode: screen;
  background: repeating-conic-gradient(from 0deg, transparent 0deg 8deg, var(--ray-c, oklch(0.9 0.1 80) ) 8deg 9deg); -webkit-mask: radial-gradient(circle, black 0%, transparent 60%); mask: radial-gradient(circle, black 0%, transparent 60%); }
.cata-rays.on { animation: raysIn 1.6s ease-out forwards, raysSpin 18s linear infinite; }
@keyframes raysIn { 0% { transform: translate(-50%,-50%) scale(0); opacity: 0; } 60% { opacity: 0.5; } 100% { transform: translate(-50%,-50%) scale(1); opacity: 0.4; } }
@keyframes raysSpin { to { transform: translate(-50%,-50%) rotate(360deg) scale(1); } }

.cata-flash { position: absolute; inset: 0; background: oklch(0.99 0.02 90); opacity: 0; pointer-events: none; }
.cata-flash.go { animation: flashBang .42s ease-out forwards; }
@keyframes flashBang { 0% { opacity: 0; } 20% { opacity: 1; } 100% { opacity: 0; } }

/* reveal */
.cataclysm.phase-reveal .cata-rays.on { opacity: 0.1; }
.cataclysm.phase-reveal .cata-light.on { opacity: 0.5 !important; }
.cata-reveal { position: absolute; inset: 0; z-index: 12; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; animation: revealIn .55s cubic-bezier(.22,1,.36,1) both;
  background: radial-gradient(ellipse 60% 70% at 50% 50%, oklch(0.10 0.045 268 / 0.86) 0%, oklch(0.05 0.03 268 / 0.95) 62%, oklch(0.03 0.02 268 / 0.98) 100%); }
@keyframes revealIn { from { opacity: 0; } to { opacity: 1; } }
.reveal-eyebrow { font-family: 'Cinzel', serif; font-size: 0.72rem; letter-spacing: 0.4em; text-transform: uppercase; }
.reveal-title { font-family: 'Cinzel Decorative', cursive; font-size: 2.4rem; font-weight: 900; letter-spacing: 0.03em; text-align: center; }
.reveal-card { width: clamp(220px, 24vw, 290px); aspect-ratio: 2 / 3; filter: drop-shadow(0 0 30px var(--rev-glow, var(--gold))); animation: revealCard .7s cubic-bezier(.34,1.56,.64,1) both; }
@keyframes revealCard { 0% { transform: translateY(40px) scale(0.5) rotate(-6deg); opacity: 0; } 100% { transform: translateY(0) scale(1) rotate(0); opacity: 1; } }

.finish-btn { padding: 14px 30px; font-family: 'Cinzel', serif; font-weight: 700; font-size: 0.82rem; letter-spacing: 0.3em; text-transform: uppercase;
  background: linear-gradient(155deg, oklch(0.32 0.10 78), oklch(0.22 0.08 78)); color: oklch(0.94 0.10 80); border: 1px solid var(--gold);
  box-shadow: 0 6px 22px oklch(0.73 0.13 78 / 0.25); transition: filter .2s, transform .15s; }
.finish-btn:hover { filter: brightness(1.15); transform: translateY(-1px); }

/* ═════════════ TARGETED FORGE ═════════════ */
.targeted-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 390px; }
.ritual-stage { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 30px; position: relative; overflow: hidden;
  background: radial-gradient(ellipse 70% 65% at 50% 45%, oklch(0.13 0.05 268 / 0.6) 0%, transparent 72%); }
.ritual-circle { position: relative; display: flex; align-items: center; justify-content: center; }
.ritual-ring { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); border-radius: 50%; pointer-events: none; }
.ritual-ring.outer { width: 100%; height: 100%; border: 1px solid var(--gold-soft); box-shadow: inset 0 0 50px oklch(0.45 0.10 60 / 0.12); }
.ritual-ring.inner { width: 62%; height: 62%; border: 1px dashed oklch(0.62 0.13 60 / 0.3); }
.ritual-circle.channeling .ritual-ring.outer { animation: ringSpin 16s linear infinite; box-shadow: inset 0 0 60px oklch(0.6 0.16 70 / 0.3), 0 0 30px oklch(0.6 0.16 70 / 0.2); border-color: var(--gold); }
.ritual-circle.channeling .ritual-ring.inner { animation: ringSpin 10s linear infinite reverse; }
@keyframes ringSpin { to { transform: translate(-50%,-50%) rotate(360deg); } }
.ritual-glyphs { position: absolute; top: 50%; left: 50%; width: 0; height: 0; }
.ritual-glyph { position: absolute; top: 0; left: 0; transform-origin: 0 0; color: var(--gold-dim); font-size: 0.7rem; margin: -6px; opacity: 0.45; }
.ritual-circle.channeling .ritual-glyph { color: var(--gold-glow); opacity: 0.9; text-shadow: 0 0 8px var(--gold); }
.ritual-lines { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); pointer-events: none; }
.rline { stroke: oklch(0.4 0.06 70 / 0.25); stroke-width: 1; }
.rline.lit { stroke: var(--gold); stroke-width: 1.5; filter: drop-shadow(0 0 4px var(--gold)); animation: lineFlow 2s ease-in-out infinite; }
@keyframes lineFlow { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }

.altar { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); z-index: 5; width: clamp(120px, 13vw, 158px); aspect-ratio: 2 / 3;
  border: 1px solid var(--gold-soft); background: oklch(0.08 0.03 268); display: flex; align-items: center; justify-content: center; transition: transform .2s, box-shadow .25s; }
.altar.empty { border-style: dashed; border-color: oklch(0.55 0.10 78 / 0.5); }
.altar:not(:disabled):hover { box-shadow: 0 0 0 1px var(--gold), 0 0 26px oklch(0.73 0.13 78 / 0.35); transform: translate(-50%,-50%) scale(1.03); }
.altar-empty { display: flex; flex-direction: column; align-items: center; gap: 8px; opacity: 0.6; }
.altar-hint { font-family: 'Cinzel', serif; font-size: 0.6rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold-dim); text-align: center; line-height: 1.4; }
.altar-card { position: relative; width: 100%; height: 100%; }
.altar-edit { position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); font-family: 'Cinzel', serif; font-size: 0.52rem; letter-spacing: 0.16em; text-transform: uppercase; color: oklch(0.95 0.05 80); background: oklch(0.1 0.04 268 / 0.85); padding: 3px 10px; border: 1px solid var(--gold-soft); opacity: 0; transition: opacity .2s; }
.altar:hover .altar-edit { opacity: 1; }
.altar-aura { position: absolute; inset: -8px; border-radius: 4px; pointer-events: none; }
.altar.set .altar-aura { box-shadow: 0 0 30px oklch(0.73 0.13 78 / 0.35); }

.ring-slot { position: absolute; transform: translate(-50%,-50%); width: clamp(74px, 7.5vw, 96px); aspect-ratio: 2 / 3; z-index: 4;
  border: 1px solid oklch(0.40 0.05 270 / 0.6); border-radius: 4px; background: linear-gradient(180deg, oklch(0.06 0.02 268), oklch(0.10 0.02 268));
  box-shadow: inset 0 3px 10px oklch(0.02 0.01 268 / 0.9); display: flex; align-items: center; justify-content: center; cursor: default; transition: box-shadow .25s, border-color .25s; }
.ring-slot.filled { cursor: pointer; border-color: var(--gold-soft); box-shadow: 0 0 0 1px var(--gold-soft), 0 0 14px oklch(0.73 0.13 78 / 0.25); }
.rs-empty { font-family: 'Cinzel Decorative', cursive; font-size: 1.1rem; color: oklch(0.45 0.06 70 / 0.6); }
.rs-card { position: relative; width: 100%; height: 100%; animation: socketDrop .4s cubic-bezier(.34,1.56,.64,1); }
.rs-x { position: absolute; top: 3px; right: 3px; width: 18px; height: 18px; border-radius: 50%; background: oklch(0.18 0.06 18 / 0.9); border: 1px solid var(--crimson-br); color: oklch(0.9 0.08 30); font-size: 0.62rem; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity .2s; z-index: 5; }
.ring-slot.filled:hover .rs-x { opacity: 1; }
.ring-slot.filled:hover { box-shadow: inset 0 0 0 1px var(--crimson-br), 0 0 16px oklch(0.5 0.2 20 / 0.4); }
.ritual-caption { margin-top: 14px; font-family: 'Cinzel', serif; font-size: 0.7rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold-dim); text-align: center; position: relative; z-index: 6; }

.ritual-side { display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--border); background: oklch(0.065 0.035 268 / 0.5); }
.ritual-target-box { padding: 20px 22px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px;
  background: radial-gradient(ellipse 90% 80% at 50% 0%, oklch(0.14 0.05 78 / 0.25), transparent 70%); }
.rt-name { font-family: 'Cinzel Decorative', cursive; font-size: 1.3rem; font-weight: 700; color: var(--gold-glow); line-height: 1.1; margin-top: 2px; }
.rt-meta { display: flex; align-items: center; gap: 8px; font-family: 'Cinzel', serif; font-size: 0.62rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--parchment-d); }
.rt-pip { width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.55rem; color: oklch(0.1 0.04 268); }
.rt-dot { opacity: 0.5; }
.rt-cost-row { display: flex; align-items: baseline; justify-content: space-between; padding-top: 8px; margin-top: 4px; border-top: 1px dashed var(--border); }
.rt-cost-row .cost-value { font-size: 1.25rem; }

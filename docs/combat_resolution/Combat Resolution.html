<!DOCTYPE html>
<html lang="pt-BR">
<head>

<title>Taldorian TCCG — Resolução de Combate</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,400;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #05050a;
    font-family: 'Cinzel', serif;
    display: flex; align-items: center; justify-content: center;
  }
  #stage-wrap { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
  #stage {
    width: 1280px; height: 720px;
    transform-origin: center center;
    position: relative; overflow: hidden;
    background: #0a0a12;
  }
  #shake-inner { position: absolute; inset: 0; }

  /* ── Background halves ── */
  .bg-opponent {
    position: absolute; top: 0; left: 0; right: 0; height: 50%;
    background:
      radial-gradient(ellipse 80% 120% at 50% -10%, oklch(0.28 0.10 15 / 0.22) 0%, transparent 65%),
      linear-gradient(180deg, oklch(0.09 0.05 12) 0%, oklch(0.08 0.04 260) 100%);
  }
  .bg-player {
    position: absolute; bottom: 0; left: 0; right: 0; height: 50%;
    background:
      radial-gradient(ellipse 80% 120% at 50% 110%, oklch(0.28 0.10 200 / 0.18) 0%, transparent 65%),
      linear-gradient(0deg, oklch(0.09 0.05 220) 0%, oklch(0.08 0.04 260) 100%);
  }
  .bg-center-line {
    position: absolute; top: 50%; left: 0; right: 0;
    height: 1px; margin-top: -0.5px;
    background: linear-gradient(90deg,
      transparent 0%, oklch(0.73 0.13 78 / 0.25) 20%,
      oklch(0.73 0.13 78 / 0.50) 50%,
      oklch(0.73 0.13 78 / 0.25) 80%, transparent 100%);
  }
  .bg-noise {
    position: absolute; inset: 0; opacity: 0.025; pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 256px;
  }

  /* Vignette / dim that draws focus to center during the duel */
  .duel-dim {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 42% 52% at 50% 50%,
      transparent 0%, transparent 38%, oklch(0.02 0.02 260 / 0.55) 78%, oklch(0.01 0.01 260 / 0.82) 100%);
  }

  /* ── Static board slots (dimmed behind the duel) ── */
  .slot {
    position: absolute;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .slot-card {
    border: 1px solid var(--sb);
    background: var(--sbg);
    position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .slot-label {
    font-family: 'Cinzel', serif; font-size: 8px;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--slc); white-space: nowrap;
  }
  .size-std    .slot-card { width: 70px; height: 98px; }
  .size-sm     .slot-card { width: 58px; height: 81px; }
  .size-active .slot-card { width: 90px; height: 126px; }
  .theme-player   { --sb: oklch(0.55 0.14 200 / 0.45); --sbg: oklch(0.10 0.04 220 / 0.60); --slc: oklch(0.65 0.14 200); }
  .theme-opponent { --sb: oklch(0.55 0.20 15 / 0.40);  --sbg: oklch(0.10 0.04 15 / 0.55);  --slc: oklch(0.60 0.18 15); }
  .slot-card.empty-active {
    border-style: dashed;
    border-color: var(--sb);
    box-shadow: inset 0 0 18px oklch(0.5 0.1 260 / 0.25);
  }

  /* ── Duel hero card ── */
  .hero {
    position: absolute;
    transform: translate(-50%, -50%);
    pointer-events: none;
    will-change: left, top, width, height;
  }
  .hero-card {
    position: relative; width: 100%; height: 100%;
    border: 1.5px solid var(--hb);
    background: linear-gradient(180deg, oklch(0.13 0.04 var(--hh) / 0.9), oklch(0.08 0.03 260 / 0.95));
    box-shadow: 0 24px 50px oklch(0.01 0.01 260 / 0.65), 0 0 0 1px oklch(0 0 0 / 0.4);
    overflow: hidden;
  }
  .hero-art { position: absolute; inset: 0; }
  .hero-name {
    position: absolute; left: 6%; right: 6%; bottom: 7%;
    text-align: center;
    font-family: 'Cinzel', serif; font-weight: 700;
    font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--hname);
    text-shadow: 0 1px 3px oklch(0 0 0 / 0.8);
  }
  .hero-atk {
    position: absolute; top: 5px; left: 5px;
    min-width: 20px; height: 20px; padding: 0 3px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Cinzel', serif; font-size: 12px; font-weight: 700;
    color: oklch(0.95 0.10 60);
    background: oklch(0.16 0.05 30 / 0.9);
    border: 0.5px solid var(--hb);
    z-index: 4;
  }
  .hero-hp-wrap {
    position: absolute; left: 6%; right: 6%; bottom: 3%;
    height: 5px; background: oklch(0.14 0.03 268); z-index: 4;
    border: 0.5px solid oklch(0 0 0 / 0.5);
  }
  .hero-hp-fill { height: 100%; transition: none; }
  .hp-player { background: linear-gradient(90deg, oklch(0.55 0.20 150), oklch(0.78 0.18 150)); }
  .hp-enemy  { background: linear-gradient(90deg, oklch(0.55 0.22 15), oklch(0.72 0.20 15)); }
  /* red hit flash overlay on card */
  .hero-hit {
    position: absolute; inset: 0; z-index: 6; pointer-events: none;
    background: radial-gradient(circle at 50% 45%, oklch(0.65 0.26 25 / 0.9), oklch(0.5 0.24 22 / 0.35) 60%, transparent 80%);
    mix-blend-mode: screen;
  }
  /* charge glow behind attacker */
  .charge-glow {
    position: absolute; transform: translate(-50%, -50%);
    border-radius: 50%; pointer-events: none;
    mix-blend-mode: screen; z-index: 4;
  }

  /* ── FX + overlays ── */
  .fx-layer { position: absolute; inset: 0; pointer-events: none; z-index: 8; }
  .dmg-pop {
    position: absolute; transform: translate(-50%, -50%);
    font-family: 'Cinzel Decorative', serif; font-weight: 900;
    font-size: 38px; letter-spacing: 0.02em;
    color: oklch(0.66 0.24 25);
    text-shadow: 0 0 16px oklch(0.55 0.24 22 / 0.9), 0 2px 0 oklch(0.18 0.10 25), 0 3px 6px oklch(0 0 0 / 0.7);
    pointer-events: none; z-index: 12; white-space: nowrap;
  }
  .screen-flash {
    position: absolute; inset: 0; pointer-events: none; z-index: 14;
    mix-blend-mode: screen;
  }

  /* ── Title banner + caption ── */
  .title-banner {
    position: absolute; left: 0; right: 0; top: 41%;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    pointer-events: none; z-index: 20;
  }
  .title-sub {
    font-family: 'Cinzel', serif; font-size: 11px;
    letter-spacing: 0.5em; text-transform: uppercase;
    color: oklch(0.80 0.14 78); opacity: 0.85; margin-left: 0.5em;
  }
  .title-name {
    font-family: 'Cinzel Decorative', serif; font-weight: 900;
    font-size: 40px; letter-spacing: 0.14em; text-transform: uppercase;
    color: oklch(0.92 0.08 80);
    text-shadow: 0 0 22px oklch(0.73 0.14 78 / 0.6), 0 2px 0 oklch(0.18 0.05 60 / 0.8);
  }
  .title-rule {
    width: 320px; height: 1px; margin-top: 2px;
    background: linear-gradient(90deg, transparent, oklch(0.73 0.14 78 / 0.8), transparent);
  }
  .caption {
    position: absolute; left: 0; right: 0; top: 22px; text-align: center;
    font-family: 'Cinzel', serif; font-size: 11px;
    letter-spacing: 0.4em; text-transform: uppercase;
    color: oklch(0.78 0.12 78); pointer-events: none; z-index: 20;
  }

  /* ── Controls ── */
  .controls {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; gap: 10px;
    padding: 12px 18px;
    background: oklch(0.10 0.03 268 / 0.88);
    border: 1px solid oklch(0.73 0.13 78 / 0.30);
    backdrop-filter: blur(8px);
    z-index: 1000; font-family: 'JetBrains Mono', monospace;
  }
  .ctrl-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .ctrl-btn {
    background: oklch(0.16 0.05 268 / 0.9);
    color: oklch(0.82 0.16 80);
    border: 1px solid oklch(0.73 0.13 78 / 0.45);
    padding: 6px 14px;
    font-family: 'Cinzel', serif; font-size: 10px; font-weight: 700;
    letter-spacing: 0.2em; text-transform: uppercase; cursor: pointer;
    transition: all 0.15s;
  }
  .ctrl-btn:hover {
    background: oklch(0.22 0.06 268 / 0.95);
    border-color: oklch(0.73 0.13 78 / 0.8);
    box-shadow: 0 0 14px oklch(0.73 0.13 78 / 0.30);
  }
  .ctrl-btn.primary {
    background: linear-gradient(180deg, oklch(0.30 0.10 200 / 0.95), oklch(0.16 0.07 220 / 0.95));
    color: oklch(0.92 0.10 210); border-color: oklch(0.70 0.15 210 / 0.7);
  }
  .ctrl-scrub { width: 280px; accent-color: oklch(0.73 0.14 78); }
  .ctrl-label {
    font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase;
    color: oklch(0.65 0.10 78);
  }
  .ctrl-time { color: oklch(0.82 0.16 80); font-size: 10px; min-width: 46px; }
  .seg { display: flex; border: 1px solid oklch(0.73 0.13 78 / 0.30); }
  .seg button {
    background: oklch(0.13 0.04 268 / 0.9); color: oklch(0.62 0.08 78);
    border: none; border-right: 1px solid oklch(0.73 0.13 78 / 0.2);
    padding: 5px 11px; font-family: 'Cinzel', serif; font-size: 9px; font-weight: 700;
    letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; transition: all 0.12s;
  }
  .seg button:last-child { border-right: none; }
  .seg button.on-player { background: oklch(0.30 0.10 210 / 0.95); color: oklch(0.92 0.10 210); }
  .seg button.on-enemy  { background: oklch(0.32 0.13 22 / 0.95);  color: oklch(0.94 0.12 30); }
  .grp { display: flex; align-items: center; gap: 7px; }
  .grp .tag {
    font-family: 'Cinzel', serif; font-size: 9px; font-weight: 700;
    letter-spacing: 0.15em; text-transform: uppercase;
  }
  .tag.pl { color: oklch(0.70 0.13 210); }
  .tag.en { color: oklch(0.70 0.16 25); }
  .dmg-step {
    display: flex; align-items: center; gap: 4px;
    color: oklch(0.78 0.10 78); font-size: 10px;
  }
  .dmg-step button {
    width: 18px; height: 18px; line-height: 1; cursor: pointer;
    background: oklch(0.16 0.05 268 / 0.9); color: oklch(0.82 0.14 78);
    border: 1px solid oklch(0.73 0.13 78 / 0.4); font-family: 'JetBrains Mono', monospace;
  }
</style>

<body>
<div id="stage-wrap">
  <div id="stage"><div id="root" style="position:absolute;inset:0;"></div></div>
</div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ════════════════════════════════════════════════════════════════════════════
//  Geometry & timeline
// ════════════════════════════════════════════════════════════════════════════
const STAGE_W = 1280, STAGE_H = 720;
const H1_HOME = { x: 720, y: 540 };   // player active slot (bottom)
const H2_HOME = { x: 720, y: 200 };   // opponent active slot (top)
const H1_DUEL = { x: 472, y: 360 };   // player faces off on the left
const H2_DUEL = { x: 808, y: 360 };   // opponent on the right
const HOME_W = 90,  HOME_H = 126;
const DUEL_W = 164, DUEL_H = 230;
const MAXHP = 20;

const T = {
  ENTRANCE_END: 1.15,
  A1_START: 1.55, A1_END: 3.35,
  A2_START: 3.70, A2_END: 5.50,
  HOLD_END: 6.20,
};
const ATTACK_DUR = 1.80;
const POPUP_DUR  = 1.30;
const SCRUB_MAX  = 6.20;

// ════════════════════════════════════════════════════════════════════════════
//  Math utils
// ════════════════════════════════════════════════════════════════════════════
const clamp01 = v => Math.max(0, Math.min(1, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeInCubic  = t => t * t * t;
const easeOutQuart = t => 1 - Math.pow(1 - t, 4);
const easeInQuad   = t => t * t;
const easeOutBack  = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };

// ════════════════════════════════════════════════════════════════════════════
//  Per-attack-type palettes
// ════════════════════════════════════════════════════════════════════════════
const ATK_COLORS = {
  lamina:  { core: 'oklch(0.98 0.02 230)', bright: 'oklch(0.90 0.10 225)', mid: 'oklch(0.80 0.13 228)', glow: 'oklch(0.86 0.12 225)', dust: 'oklch(0.70 0.08 230)' },
  machado: { core: 'oklch(0.98 0.10 75)',  bright: 'oklch(0.90 0.20 55)',  mid: 'oklch(0.74 0.22 38)',  glow: 'oklch(0.80 0.22 42)',  dust: 'oklch(0.45 0.05 60)' },
  magia:   { core: 'oklch(0.96 0.07 305)', bright: 'oklch(0.82 0.18 302)', mid: 'oklch(0.68 0.21 300)', glow: 'oklch(0.76 0.20 300)', dust: 'oklch(0.62 0.16 300)' },
};
const ATK_LABEL = { lamina: 'Lâmina', machado: 'Machado', magia: 'Magia' };

// Pre-seeded particle geometry (deterministic)
const AXE_SHARDS = Array.from({ length: 13 }, (_, i) => {
  const a = (i / 13) * Math.PI * 2 + (i % 2 ? 0.12 : -0.12);
  return { a, len: 40 + (i % 4) * 16, w: 1.4 + (i % 3) * 0.7 };
});
const AXE_DUST = Array.from({ length: 9 }, (_, i) => ({
  a: (i / 9) * Math.PI * 2, dist: 30 + (i % 3) * 22, r: 4 + (i % 4) * 2.5,
}));
const MAGIC_SPARKS = Array.from({ length: 12 }, (_, i) => ({
  a: (i / 12) * Math.PI * 2 + (i % 2 ? 0.2 : -0.1), len: 50 + (i % 5) * 18, size: 2 + (i % 3),
}));

// ════════════════════════════════════════════════════════════════════════════
//  Single attack contribution
//  attacker/target = base (entrance-resolved) positions/sizes.
//  dir = +1 (attacker on left, strikes right) / -1.
// ════════════════════════════════════════════════════════════════════════════
function emptyAtk() {
  return {
    attacker: { lungeX: 0, extraY: 0, charge: 0, type: null },
    target:   { recoilX: 0, shakeX: 0, shakeY: 0, hitFlash: 0, hpLost: 0 },
    fx: [], flash: 0, screenShake: 0, popup: null,
  };
}

function attackFX(t, start, type, dmg, dir, attacker, target) {
  const res = emptyAtk();
  res.attacker.type = type;
  const D = ATTACK_DUR;
  const u = (t - start) / D;

  const impactLocal = type === 'magia' ? 0.60 : (type === 'machado' ? 0.54 : 0.50);
  const impactAbs = start + impactLocal * D;

  // Damage / HP drop + popup (independent of motion window so they persist after)
  if (t >= impactAbs) {
    res.target.hpLost = dmg * easeOutCubic(clamp01((t - impactAbs) / 0.35));
  }
  const pAge = t - impactAbs;
  if (pAge >= 0 && pAge < POPUP_DUR) {
    const pp = pAge / POPUP_DUR;
    const op = pp < 0.12 ? pp / 0.12 : (pp > 0.68 ? (1 - pp) / 0.32 : 1);
    res.popup = {
      value: dmg,
      x: target.x,
      y: target.y - target.h / 2 - 16 - easeOutCubic(pp) * 50,
      opacity: clamp01(op),
      scale: 0.7 + easeOutBack(clamp01(pp / 0.3)) * 0.3,
    };
  }

  if (u < 0 || u > 1.0) return res;

  const handX = attacker.x + dir * (attacker.w * 0.30);
  const handY = attacker.y - attacker.h * 0.16;
  const tcx = target.x, tcy = target.y;

  if (type === 'lamina') {
    const LUNGE = 60, RECOIL = 24;
    let lunge = 0, charge = 0;
    if (u < 0.30)      { const w = u / 0.30;        charge = easeOutCubic(w) * 0.55; lunge = -8 * w; }
    else if (u < 0.50) { const w = (u - 0.30) / 0.20; charge = 0.55 + 0.45 * w;       lunge = lerp(-8, LUNGE, easeInQuad(w)); }
    else               { const w = (u - 0.50) / 0.50; charge = 0.5 * clamp01(1 - w * 2); lunge = LUNGE * (1 - easeOutCubic(w)); }
    res.attacker.lungeX = lunge * dir;
    res.attacker.charge = charge;
    // slash streaks crossing the target
    if (u >= 0.42 && u <= 0.74) {
      res.fx.push({ kind: 'slash', type, p: (u - 0.42) / 0.32, x: tcx, y: tcy, w: target.w, h: target.h, dir });
    }
    const imp = u - 0.50;
    if (imp >= 0 && imp < 0.26) {
      const w = imp / 0.26;
      res.target.hitFlash = (1 - w);
      res.target.recoilX = dir * RECOIL * (1 - easeOutCubic(w));
      res.target.shakeX = Math.sin(t * 95) * (1 - w) * 3;
      res.flash = (1 - w) * 0.14;
    }
  }

  else if (type === 'machado') {
    const LUNGE = 88, RECOIL = 46;
    let lunge = 0, extraY = 0, charge = 0;
    if (u < 0.38)      { const w = u / 0.38;        charge = easeInQuad(w);        lunge = -16 * easeOutCubic(w); extraY = -12 * easeOutCubic(w); }
    else if (u < 0.54) { const w = (u - 0.38) / 0.16; charge = 1;                   lunge = lerp(-16, LUNGE, easeInQuad(w)); extraY = lerp(-12, 8, easeInQuad(w)); }
    else               { const w = (u - 0.54) / 0.46; charge = 0.4 * clamp01(1 - w * 2); lunge = LUNGE * (1 - easeOutCubic(w)); extraY = 8 * (1 - easeOutCubic(w)); }
    res.attacker.lungeX = lunge * dir;
    res.attacker.extraY = extraY;
    res.attacker.charge = charge;
    const imp = u - 0.54;
    if (imp >= 0 && imp < 0.46) {
      res.fx.push({ kind: 'axe', type, p: imp / 0.46, x: tcx, y: tcy });
    }
    if (imp >= 0 && imp < 0.5) {
      const w = clamp01(imp / 0.5);
      res.target.hitFlash = (1 - clamp01(imp / 0.28));
      res.target.recoilX = dir * RECOIL * (1 - easeOutCubic(w));
      const sa = (1 - clamp01(imp / 0.34)) * 7;
      res.target.shakeX = Math.sin(t * 130) * sa;
      res.target.shakeY = Math.cos(t * 110) * sa * 0.7;
      res.screenShake = (1 - clamp01(imp / 0.32)) * 11;
      res.flash = (1 - clamp01(imp / 0.24)) * 0.22;
    }
  }

  else if (type === 'magia') {
    const RECOIL = 30;
    let lunge = 0, charge = 0;
    if (u < 0.34)      { const w = u / 0.34; charge = easeOutCubic(w); lunge = -7 * w; }
    else               { const w = (u - 0.34) / 0.66; lunge = -7 * (1 - easeOutCubic(clamp01(w * 2))); charge = 0; }
    res.attacker.lungeX = lunge * dir;
    res.attacker.charge = charge;
    // charging orb at the caster's hand
    if (u < 0.40) res.fx.push({ kind: 'orb', type, p: u / 0.40, x: handX, y: handY });
    // travelling projectile
    if (u >= 0.34 && u < 0.62) {
      const w = (u - 0.34) / 0.28;
      const px = lerp(handX, tcx, easeInQuad(w));
      const py = lerp(handY, tcy, w) - Math.sin(w * Math.PI) * 26;
      res.fx.push({ kind: 'proj', type, p: w, x: px, y: py, dir });
    }
    const imp = u - 0.60;
    if (imp >= 0 && imp < 0.45) {
      res.fx.push({ kind: 'burst', type, p: imp / 0.45, x: tcx, y: tcy });
    }
    if (imp >= 0 && imp < 0.5) {
      const w = clamp01(imp / 0.5);
      res.target.hitFlash = (1 - clamp01(imp / 0.26));
      res.target.recoilX = dir * RECOIL * (1 - easeOutCubic(w));
      res.target.shakeX = Math.sin(t * 100) * (1 - w) * 4;
      res.flash = (1 - clamp01(imp / 0.3)) * 0.20;
    }
  }

  return res;
}

// ════════════════════════════════════════════════════════════════════════════
//  Master scene derivation
// ════════════════════════════════════════════════════════════════════════════
function deriveScene(t, cfg) {
  // ── Entrance: both rise to center & grow ──
  const eP = clamp01(t / T.ENTRANCE_END);
  const ePos = easeOutCubic(eP);
  const eSize = easeOutBack(clamp01(eP * 1.05));
  const rise = -Math.sin(eP * Math.PI) * 20;          // arc upward ("subindo")

  const h1base = {
    x: lerp(H1_HOME.x, H1_DUEL.x, ePos),
    y: lerp(H1_HOME.y, H1_DUEL.y, ePos) + rise,
    w: lerp(HOME_W, DUEL_W, eSize),
    h: lerp(HOME_H, DUEL_H, eSize),
  };
  const h2base = {
    x: lerp(H2_HOME.x, H2_DUEL.x, ePos),
    y: lerp(H2_HOME.y, H2_DUEL.y, ePos) + rise,
    w: lerp(HOME_W, DUEL_W, eSize),
    h: lerp(HOME_H, DUEL_H, eSize),
  };

  // gentle idle bob once settled
  const settled = clamp01((t - T.ENTRANCE_END) / 0.5);
  const bob = Math.sin(t * 1.6) * 2.4 * settled;
  h1base.y += bob; h2base.y += bob * -1;

  // ── Two sequential attacks ──
  const a1 = attackFX(t, T.A1_START, cfg.atk1, cfg.dmg1, +1, h1base, h2base); // ally -> enemy
  const a2 = attackFX(t, T.A2_START, cfg.atk2, cfg.dmg2, -1, h2base, h1base); // enemy -> ally

  const h1 = {
    ...h1base,
    x: h1base.x + a1.attacker.lungeX + a2.target.recoilX + a2.target.shakeX,
    y: h1base.y + a1.attacker.extraY + a2.target.shakeY,
    charge: a1.attacker.charge, chargeType: cfg.atk1,
    hitFlash: a2.target.hitFlash,
    hp: clamp01((MAXHP - a2.target.hpLost) / MAXHP),
    weapon: cfg.atk1, atk: cfg.dmg1,
  };
  const h2 = {
    ...h2base,
    x: h2base.x + a2.attacker.lungeX + a1.target.recoilX + a1.target.shakeX,
    y: h2base.y + a2.attacker.extraY + a1.target.shakeY,
    charge: a2.attacker.charge, chargeType: cfg.atk2,
    hitFlash: a1.target.hitFlash,
    hp: clamp01((MAXHP - a1.target.hpLost) / MAXHP),
    weapon: cfg.atk2, atk: cfg.dmg2,
  };

  const fx = [...a1.fx, ...a2.fx];
  const popups = [a1.popup, a2.popup].filter(Boolean);
  const flash = Math.max(a1.flash, a2.flash);
  const flashType = a1.flash >= a2.flash ? cfg.atk1 : cfg.atk2;
  const screenShake = Math.max(a1.screenShake, a2.screenShake);

  // board dim grows during entrance, persists through the duel
  const dim = ePos;

  // title banner (entrance) + caption
  let bannerOp = 0;
  if (t >= 0.1 && t < 1.5) bannerOp = Math.min(clamp01((t - 0.1) / 0.4), clamp01((1.5 - t) / 0.4));

  let caption = '';
  if (t < T.A1_START) caption = 'Heróis ativos avançam';
  else if (t < T.A1_END) caption = 'Aliado ataca';
  else if (t < T.A2_START) caption = '';
  else if (t < T.A2_END) caption = 'Inimigo revida';
  else caption = 'Combate resolvido';

  // screen shake offset
  let shakeOff = { x: 0, y: 0 };
  if (screenShake > 0.1) {
    shakeOff = { x: Math.sin(t * 92) * screenShake, y: Math.cos(t * 77) * screenShake * 0.6 };
  }

  return { h1, h2, fx, popups, flash, flashType, dim, bannerOp, caption, shakeOff };
}

// ════════════════════════════════════════════════════════════════════════════
//  Hero portraits (SVG, weapon-driven)
// ════════════════════════════════════════════════════════════════════════════
function HeroPortrait({ weapon, accent, charge }) {
  // viewBox 0 0 100 140 ; scales with card
  const lit = charge > 0.05;

    return (
      <svg viewBox="0 0 100 140" width="100%" height="100%" preserveAspectRatio="none" fill="none">
        <rect x="6" y="6" width="88" height="128" stroke={accent} strokeWidth="0.8" opacity="0.5"/>
        {/* handle (slightly angled haft) */}
        <line x1="44" y1="30" x2="58" y2="112" stroke="oklch(0.45 0.06 55)" strokeWidth="3.4" strokeLinecap="round"/>
        {/* big crescent blade (right) */}
        <path d="M50 38 Q 84 44 80 76 Q 64 66 52 58 Q 58 48 50 38 Z" fill={blade} stroke="oklch(0.5 0.08 48)" strokeWidth="1"/>
        {/* back spike (left) */}
        <path d="M48 44 Q 30 48 32 62 Q 42 57 50 56 Z" fill={blade} stroke="oklch(0.5 0.08 48)" strokeWidth="0.8" opacity="0.9"/>
        {/* pommel cap */}
        <circle cx="43" cy="30" r="3" fill="oklch(0.7 0.12 60)"/>
      </svg>

  }
  if (weapon === 'magia') {
    return (
      <svg viewBox="0 0 100 140" width="100%" height="100%" preserveAspectRatio="none" fill="none">
        <rect x="6" y="6" width="88" height="128" stroke={accent} strokeWidth="0.8" opacity="0.5"/>
        {/* staff */}
        <line x1="42" y1="34" x2="58" y2="110" stroke="oklch(0.5 0.05 60)" strokeWidth="2.6" strokeLinecap="round"/>
        {/* orb */}
        <circle cx="40" cy="34" r="11" fill={lit ? 'oklch(0.82 0.18 302)' : 'oklch(0.45 0.12 300 / 0.7)'} stroke={blade} strokeWidth="1.2"/>
        <circle cx="40" cy="34" r="4" fill="oklch(0.96 0.07 305)"/>
        {/* sparkle */}
        <path d="M68 64 l2 6 l6 2 l-6 2 l-2 6 l-2-6 l-6-2 l6-2 z" fill="none" stroke="oklch(0.82 0.16 300 / 0.8)" strokeWidth="0.7"/>
      </svg>
    );
  }
  // lamina (sword + shield) — default
  return (
    <svg viewBox="0 0 100 140" width="100%" height="100%" preserveAspectRatio="none" fill="none">
      <rect x="6" y="6" width="88" height="128" stroke={accent} strokeWidth="0.8" opacity="0.5"/>

      <line x1="50" y1="32" x2="50" y2="90" stroke="oklch(0.98 0.02 230)" strokeWidth="0.8" opacity="0.7"/>
      {/* crossguard */}
      <line x1="36" y1="92" x2="64" y2="92" stroke="oklch(0.65 0.12 60)" strokeWidth="3" strokeLinecap="round"/>
      <circle cx="50" cy="100" r="2.4" fill="oklch(0.72 0.14 60)"/>
      {/* shield */}
      <path d="M30 70 L70 70 L66 92 L50 104 L34 92 Z" stroke={accent} strokeWidth="0.9" fill="none" opacity="0.85"/>
    </svg>
  );
}

function HeroCard({ hero, theme, name }) {
  const accent = theme === 'player' ? 'oklch(0.62 0.14 210)' : 'oklch(0.60 0.20 22)';
  const cc = hero.charge > 0.05 ? ATK_COLORS[hero.chargeType] : null;
  return (
    <>
      {/* charge glow behind card */}
      {cc && (
        <div className="charge-glow" style={{
          left: hero.x, top: hero.y,

          height: hero.w * (1.3 + hero.charge * 0.7),

          opacity: hero.charge * 0.7,
        }}/>
      )}
      <div className="hero" style={{
        left: hero.x, top: hero.y, width: hero.w, height: hero.h, zIndex: 5,
        '--hb': accent, '--hh': theme === 'player' ? 220 : 22,
        '--hname': theme === 'player' ? 'oklch(0.82 0.10 210)' : 'oklch(0.84 0.12 28)',
      }}>
        <div className="hero-card">
          <div className="hero-art">
            <HeroPortrait weapon={hero.weapon} accent={accent} charge={hero.charge}/>
          </div>

// ════════════════════════════════════════════════════════════════════════════
//  Attack FX primitives (SVG)
// ════════════════════════════════════════════════════════════════════════════
function SlashFX({ p, x, y, w, h, c }) {
  const overOp = p < 0.14 ? p / 0.14 : (p > 0.6 ? Math.max(0, (1 - p) / 0.4) : 1);
  const d1 = clamp01(p / 0.5), d2 = clamp01((p - 0.22) / 0.5);
  const hw = w * 0.62, hh = h * 0.52;
  const s1 = `M ${x - hw} ${y - hh} Q ${x} ${y - hh * 0.2} ${x + hw} ${y + hh}`;
  const s2 = `M ${x + hw} ${y - hh} Q ${x} ${y - hh * 0.2} ${x - hw} ${y + hh}`;
  return (
    <g style={{ opacity: overOp }}>
      {[[s1, d1], [s2, d2]].map(([d, dp], i) => dp > 0 && (
        <g key={i}>
          <path d={d} pathLength="1" fill="none" stroke={c.glow} strokeWidth="10" strokeLinecap="round"
                strokeDasharray="1" strokeDashoffset={1 - dp} opacity="0.45"/>
          <path d={d} pathLength="1" fill="none" stroke={c.core} strokeWidth="3" strokeLinecap="round"
                strokeDasharray="1" strokeDashoffset={1 - dp}/>
        </g>
      ))}
    </g>
  );
}

function AxeFX({ p, x, y, c }) {
  const rings = [0, 0.16].map((off, i) => {
    const u = clamp01((p - off) / 0.7);
    if (u <= 0 || u >= 1) return null;
    return { r: 16 + easeOutQuart(u) * 150, op: (1 - u) * 0.9, w: 3 + (1 - u) * 4, key: i };
  }).filter(Boolean);
  return (
    <g>
      {rings.map(r => (
        <g key={'r' + r.key}>
          <circle cx={x} cy={y} r={r.r} fill="none" stroke={c.glow} strokeWidth={r.w + 4} opacity={r.op * 0.5}/>
          <circle cx={x} cy={y} r={r.r} fill="none" stroke={c.bright} strokeWidth={r.w} opacity={r.op}/>
        </g>
      ))}
      {/* radial shards */}
      {AXE_SHARDS.map((s, i) => {
        const r0 = 22 + easeOutCubic(p) * s.len;
        const r1 = r0 + 16 + (1 - p) * 8;
        return (
          <line key={'s' + i}
            x1={x + Math.cos(s.a) * r0} y1={y + Math.sin(s.a) * r0}
            x2={x + Math.cos(s.a) * r1} y2={y + Math.sin(s.a) * r1}
            stroke={c.mid} strokeWidth={s.w} strokeLinecap="round" opacity={(1 - p) * 0.95}/>
        );
      })}
      {/* impact star */}
      <g opacity={(1 - clamp01(p / 0.4))}>
        {[0, 1, 2, 3].map(i => {
          const a = (i / 4) * Math.PI + 0.4;
          const L = 30;
          return <line key={'st' + i} x1={x - Math.cos(a) * L} y1={y - Math.sin(a) * L}
            x2={x + Math.cos(a) * L} y2={y + Math.sin(a) * L} stroke={c.core} strokeWidth="2.5" strokeLinecap="round"/>;
        })}
      </g>
      {/* dust puffs */}
      {AXE_DUST.map((d, i) => {
        const dist = d.dist * easeOutCubic(p);
        return <circle key={'d' + i}
          cx={x + Math.cos(d.a) * dist} cy={y + Math.sin(d.a) * dist + p * 20}
          r={d.r * (0.5 + p)} fill={c.dust} opacity={(1 - p) * 0.5}/>;
      })}
    </g>
  );
}

function OrbFX({ p, x, y, c }) {
  const r = 2 + p * 9;
  const op = p < 0.8 ? 1 : (1 - p) / 0.2;
  return (
    <g style={{ opacity: op }}>
      <circle cx={x} cy={y} r={r * 1.9} fill={c.glow} opacity="0.3"/>
      <circle cx={x} cy={y} r={r} fill={c.bright}/>
      <circle cx={x} cy={y} r={r * 0.5} fill={c.core}/>
      {[0, 1, 2, 3, 4].map(i => {
        const a = (i / 5) * Math.PI * 2 + p * 4;
        const rr = 24 * (1 - p);
        return <circle key={i} cx={x + Math.cos(a) * rr} cy={y + Math.sin(a) * rr} r="1.7" fill={c.bright} opacity={p}/>;
      })}
    </g>
  );
}

function ProjFX({ x, y, c, dir }) {
  return (
    <g>
      {[1, 2, 3, 4].map(i => (
        <circle key={i} cx={x - dir * i * 11} cy={y} r={9 - i * 1.7} fill={c.mid} opacity={0.5 - i * 0.1}/>
      ))}
      <circle cx={x} cy={y} r="17" fill={c.glow} opacity="0.35"/>
      <circle cx={x} cy={y} r="8.5" fill={c.bright}/>
      <circle cx={x} cy={y} r="4" fill={c.core}/>
    </g>
  );
}

function BurstFX({ p, x, y, c }) {
  const u = p;
  const r = 10 + easeOutQuart(u) * 120;
  const op = 1 - u;
  return (
    <g>
      <circle cx={x} cy={y} r={r} fill="none" stroke={c.glow} strokeWidth={4 + (1 - u) * 4} opacity={op * 0.5}/>
      <circle cx={x} cy={y} r={r} fill="none" stroke={c.bright} strokeWidth={2 + (1 - u) * 3} opacity={op * 0.9}/>
      <circle cx={x} cy={y} r={r * 0.55} fill="none" stroke={c.core} strokeWidth="1.5" opacity={op * 0.7}/>
      {MAGIC_SPARKS.map((s, i) => {
        const rr = 16 + easeOutCubic(u) * s.len;
        return <circle key={i} cx={x + Math.cos(s.a) * rr} cy={y + Math.sin(s.a) * rr}
          r={s.size * (1 - u)} fill={c.core} opacity={op}/>;
      })}
      <circle cx={x} cy={y} r={(1 - u) * 28} fill={c.glow} opacity={op * 0.4}/>
    </g>
  );
}

function FXItem({ item }) {
  const c = ATK_COLORS[item.type];
  switch (item.kind) {
    case 'slash': return <SlashFX {...item} c={c}/>;
    case 'axe':   return <AxeFX   {...item} c={c}/>;
    case 'orb':   return <OrbFX   {...item} c={c}/>;
    case 'proj':  return <ProjFX  {...item} c={c}/>;
    case 'burst': return <BurstFX {...item} c={c}/>;
    default: return null;
  }
}

// ════════════════════════════════════════════════════════════════════════════
//  Static board (dimmed behind the duel)
// ════════════════════════════════════════════════════════════════════════════
function MiniSlot({ x, y, size, label, theme, empty }) {
  return (
    <div className={`slot size-${size} theme-${theme}`} style={{ left: x, top: y }}>
      <div className={`slot-card ${empty ? 'empty-active' : ''}`}>
        {!empty && (
          <svg width="60%" height="60%" viewBox="0 0 28 39" fill="none" style={{ opacity: 0.4 }}>
            <path d="M14 6 L22 18 L14 33 L6 18 Z" stroke="currentColor" strokeWidth="0.8" fill="none"/>
            <circle cx="14" cy="19" r="3" stroke="currentColor" strokeWidth="0.7" fill="none"/>
          </svg>
        )}
      </div>
      <div className="slot-label">{label}</div>
    </div>
  );
}

function StaticBoard({ dim }) {
  const opp = [
    { x: 100, y: 130, size: 'sm', label: 'Deck' },
    { x: 100, y: 232, size: 'sm', label: 'Cemitério' },
    { x: 392, y: 200, size: 'std', label: 'Herói 3' },
    { x: 482, y: 200, size: 'std', label: 'Herói 2' },
    { x: 572, y: 200, size: 'std', label: 'Herói 1' },
    { x: 720, y: 200, size: 'active', label: 'Ativo', empty: true },
    { x: 1180, y: 180, size: 'std', label: 'Arsenal' },
  ];
  const pl = [
    { x: 100, y: 540, size: 'std', label: 'Arsenal' },
    { x: 392, y: 540, size: 'std', label: 'Herói 1' },
    { x: 482, y: 540, size: 'std', label: 'Herói 2' },
    { x: 572, y: 540, size: 'std', label: 'Herói 3' },
    { x: 720, y: 540, size: 'active', label: 'Ativo', empty: true },
    { x: 1180, y: 510, size: 'sm', label: 'Deck' },
    { x: 1180, y: 612, size: 'sm', label: 'Cemitério' },
  ];
  const op = lerp(1, 0.26, dim);
  return (
    <div style={{ position: 'absolute', inset: 0, opacity: op, zIndex: 1 }}>
      {opp.map((s, i) => <MiniSlot key={'o' + i} theme="opponent" {...s}/>)}
      {pl.map((s, i) => <MiniSlot key={'p' + i} theme="player" {...s}/>)}
    </div>
  );
}

// ════════════════════════════════════════════════════════════════════════════
//  App
// ════════════════════════════════════════════════════════════════════════════
function App() {
  const [t, setT] = useState(0);
  const [playing, setPlaying] = useState(true);
  const [cfg, setCfg] = useState({ atk1: 'lamina', atk2: 'machado', dmg1: 6, dmg2: 4 });
  const rafRef = useRef(null);
  const lastRef = useRef(performance.now());

  useEffect(() => {
    function tick(now) {
      const dt = (now - lastRef.current) / 1000;
      lastRef.current = now;
      if (playing) {
        setT(prev => {
          const n = prev + dt;
          return n >= T.HOLD_END ? T.HOLD_END : n;
        });
      }
      rafRef.current = requestAnimationFrame(tick);
    }
    lastRef.current = performance.now();
    rafRef.current = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(rafRef.current);
  }, [playing]);

  const s = deriveScene(t, cfg);
  const flashColor = ATK_COLORS[s.flashType] ? ATK_COLORS[s.flashType].core : 'white';
  const atEnd = t >= T.HOLD_END - 0.001;

  const replay = () => { setT(0); lastRef.current = performance.now(); setPlaying(true); };
  const setAtk = (who, v) => setCfg(c => ({ ...c, [who]: v }));
  const bumpDmg = (who, d) => setCfg(c => ({ ...c, [who]: Math.max(1, Math.min(20, c[who] + d)) }));

  return (
    <>
      <div id="shake-inner" style={{ transform: `translate(${s.shakeOff.x}px, ${s.shakeOff.y}px)` }}>
        <div className="bg-opponent"/>
        <div className="bg-player"/>
        <div className="bg-center-line"/>
        <div className="bg-noise"/>

        <StaticBoard dim={s.dim}/>
        <div className="duel-dim" style={{ opacity: s.dim }}/>

        {/* Duel heroes */}
        <HeroCard hero={s.h1} theme="player" name="Aliado"/>
        <HeroCard hero={s.h2} theme="opponent" name="Inimigo"/>

        {/* Attack FX */}
        <svg className="fx-layer" viewBox={`0 0 ${STAGE_W} ${STAGE_H}`} preserveAspectRatio="none">
          {s.fx.map((item, i) => <FXItem key={i} item={item}/>)}
        </svg>

        {/* Damage popups */}
        {s.popups.map((p, i) => (
          <div key={i} className="dmg-pop"
               style={{ left: p.x, top: p.y, opacity: p.opacity, transform: `translate(-50%, -50%) scale(${p.scale})` }}>
            -{p.value}
          </div>
        ))}

        {/* Impact flash */}
        {s.flash > 0.001 && (
          <div className="screen-flash" style={{ background: flashColor, opacity: s.flash }}/>
        )}

        {/* Title banner */}
        {s.bannerOp > 0.01 && (
          <div className="title-banner" style={{ opacity: s.bannerOp }}>
            <div className="title-sub">Fim da Rodada</div>
            <div className="title-name">Resolução de Combate</div>
            <div className="title-rule"/>
          </div>
        )}

        {/* Caption */}
        {s.caption && <div className="caption">{s.caption}</div>}
      </div>

      {/* ── Controls ── */}
      <div className="controls">
        <div className="ctrl-row">
          <button className="ctrl-btn primary" onClick={replay}>↻ Repetir</button>
          <button className="ctrl-btn" onClick={() => { if (atEnd) replay(); else setPlaying(p => !p); }}>
            {atEnd ? '↻ Tocar' : (playing ? '❚❚ Pausar' : '▶ Tocar')}
          </button>
          <input className="ctrl-scrub" type="range" min="0" max={SCRUB_MAX} step="0.01"
                 value={Math.min(t, SCRUB_MAX)}
                 onChange={e => { setPlaying(false); setT(parseFloat(e.target.value)); }}/>
          <span className="ctrl-time">{t.toFixed(2)}s</span>
        </div>
        <div className="ctrl-row">
          <div className="grp">
            <span className="tag pl">Aliado</span>
            <div className="seg">
              {['lamina', 'machado', 'magia'].map(k => (
                <button key={k} className={cfg.atk1 === k ? 'on-player' : ''} onClick={() => setAtk('atk1', k)}>
                  {ATK_LABEL[k]}
                </button>
              ))}
            </div>
            <div className="dmg-step">
              <button onClick={() => bumpDmg('dmg1', -1)}>−</button>
              <span>dano {cfg.dmg1}</span>
              <button onClick={() => bumpDmg('dmg1', +1)}>+</button>
            </div>
          </div>
          <div className="grp">
            <span className="tag en">Inimigo</span>
            <div className="seg">
              {['lamina', 'machado', 'magia'].map(k => (
                <button key={k} className={cfg.atk2 === k ? 'on-enemy' : ''} onClick={() => setAtk('atk2', k)}>
                  {ATK_LABEL[k]}
                </button>
              ))}
            </div>
            <div className="dmg-step">
              <button onClick={() => bumpDmg('dmg2', -1)}>−</button>
              <span>dano {cfg.dmg2}</span>
              <button onClick={() => bumpDmg('dmg2', +1)}>+</button>
            </div>
          </div>
        </div>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<script>
(function () {
  const stage = document.getElementById('stage');
  function fit() {
    const vw = window.innerWidth;
    const vh = Math.max(window.innerHeight - 96, 0);
    if (vw <= 0 || vh <= 0) return;
    const sc = Math.max(0.01, Math.min(vw / 1280, vh / 720));
    stage.style.transform = `scale(${sc})`;
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
  requestAnimationFrame(fit);
  fit();
})();
</script>
</body>
</html>

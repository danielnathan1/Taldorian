<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Taldorian TCCG — Mísseis Mágicos</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,400;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #05050c;
    font-family: 'Cinzel', serif;
    display: flex; align-items: center; justify-content: center;
  }

  #stage-wrap { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
  #stage {
    width: 1280px; height: 720px;
    transform-origin: center center;
    position: relative; overflow: hidden;
    background: #08080f;
  }

  /* ── Board halves ── */
  .bg-opponent {
    position: absolute; top: 0; left: 0; right: 0; height: 50%;
    background:
      radial-gradient(ellipse 80% 120% at 50% -10%, oklch(0.30 0.12 300 / 0.20) 0%, transparent 65%),
      linear-gradient(180deg, oklch(0.10 0.05 295) 0%, oklch(0.08 0.04 270) 100%);
  }
  .bg-player {
    position: absolute; bottom: 0; left: 0; right: 0; height: 50%;
    background:
      radial-gradient(ellipse 80% 120% at 50% 110%, oklch(0.30 0.12 290 / 0.18) 0%, transparent 65%),
      linear-gradient(0deg, oklch(0.10 0.05 285) 0%, oklch(0.08 0.04 270) 100%);
  }
  .bg-center-line {
    position: absolute; top: 50%; left: 0; right: 0;
    height: 1px; margin-top: -0.5px;
    background: linear-gradient(90deg,
      transparent 0%, oklch(0.72 0.16 300 / 0.22) 20%,
      oklch(0.72 0.16 300 / 0.48) 50%,
      oklch(0.72 0.16 300 / 0.22) 80%, transparent 100%);
  }
  .bg-noise {
    position: absolute; inset: 0; opacity: 0.028; pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 256px;
  }

  .half-label {
    position: absolute; left: 0; right: 0; text-align: center;
    font-family: 'Cinzel', serif; font-size: 9px;
    letter-spacing: 0.35em; text-transform: uppercase; opacity: 0.30;
    pointer-events: none;
  }
  .half-label.opp { top: 14px; color: oklch(0.66 0.16 300); }
  .half-label.pl  { bottom: 14px; color: oklch(0.66 0.14 288); }

  /* ── Slots ── */
  .slot {
    position: absolute;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .slot-card {
    border: 1px solid var(--slot-border);
    background: var(--slot-bg);
    position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    transition: box-shadow 0.25s, border-color 0.25s, transform 0.25s;
  }
  .slot-label {
    font-family: 'Cinzel', serif; font-size: 8px;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--slot-label-color); white-space: nowrap;
  }
  .size-std    .slot-card { width: 70px; height: 98px; }
  .size-sm     .slot-card { width: 58px; height: 81px; }
  .size-active .slot-card { width: 90px; height: 126px; }
  .theme-player {
    --slot-border:      oklch(0.55 0.14 288 / 0.45);
    --slot-bg:          oklch(0.10 0.04 285 / 0.60);
    --slot-label-color: oklch(0.66 0.14 288);
  }
  .theme-opponent {
    --slot-border:      oklch(0.55 0.18 300 / 0.42);
    --slot-bg:          oklch(0.10 0.04 300 / 0.55);
    --slot-label-color: oklch(0.62 0.16 300);
  }
  .hp-bar {
    position: absolute; bottom: 0; left: 0; right: 0; height: 3px;
    background: oklch(0.15 0.04 290);
  }
  .hp-fill { height: 100%; transition: width 0.35s ease-out;
    background: linear-gradient(90deg, oklch(0.55 0.18 288), oklch(0.78 0.16 285)); }
  .hp-fill.enemy { background: linear-gradient(90deg, oklch(0.55 0.20 320), oklch(0.72 0.18 305)); }

  /* ── Caster (Arquimaga) charging state ── */
  .caster-charging {
    border-color: oklch(0.78 0.18 300) !important;
    box-shadow:
      0 0 0 1px oklch(0.78 0.18 300 / 0.85),
      0 0 26px oklch(0.70 0.22 300 / 0.55),
      0 0 64px oklch(0.70 0.22 300 / 0.30);
    transform: translateY(-2px) scale(1.03);
  }
  .caster-firing {
    border-color: oklch(0.90 0.18 305) !important;
    box-shadow:
      0 0 0 1px oklch(0.90 0.18 305),
      0 0 38px oklch(0.88 0.20 305 / 0.7),
      0 0 96px oklch(0.88 0.20 305 / 0.42);
    transform: translateY(-2px) scale(1.05);
  }

  /* ── Ability banner ── */
  .ability-banner {
    position: absolute; left: 50%; top: calc(50% - 20px);
    transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    pointer-events: none; z-index: 60;
  }
  .ability-sub {
    font-family: 'Cinzel', serif; font-size: 10px;
    letter-spacing: 0.45em; text-transform: uppercase;
    color: oklch(0.74 0.14 300); opacity: 0.9;
  }
  .ability-name {
    font-family: 'Cinzel Decorative', serif;
    font-size: 34px; font-weight: 700;
    color: oklch(0.93 0.10 305);
    letter-spacing: 0.16em; text-transform: uppercase;
    text-shadow:
      0 0 22px oklch(0.74 0.22 300 / 0.9),
      0 0 50px oklch(0.64 0.24 300 / 0.5),
      0 2px 0 oklch(0.14 0.06 290 / 0.7);
  }
  .ability-rule {
    width: 300px; height: 1px;
    background: linear-gradient(90deg, transparent, oklch(0.72 0.18 302 / 0.8), transparent);
    margin-top: 4px;
  }

  /* ── Target aura on opponent active ── */
  .target-aura {
    position: absolute;
    border: 1px solid oklch(0.66 0.20 305 / 0.45);
    background: radial-gradient(ellipse at center,
      oklch(0.58 0.22 305 / 0.16) 0%, oklch(0.58 0.22 305 / 0.04) 60%, transparent 100%);
    pointer-events: none; transition: opacity 0.35s;
  }
  .target-aura .c { position: absolute; width: 13px; height: 13px;
    border: 1px solid oklch(0.70 0.20 305 / 0.9); }
  .target-aura .tl { top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .target-aura .tr { top: -1px; right: -1px; border-left: none; border-bottom: none; }
  .target-aura .bl { bottom: -1px; left: -1px; border-right: none; border-top: none; }
  .target-aura .br { bottom: -1px; right: -1px; border-left: none; border-top: none; }

  .fx-layer { position: absolute; inset: 0; pointer-events: none; }

  /* ── Damage popups ── */
  .dmg {
    position: absolute; transform: translate(-50%, -50%);
    font-family: 'Cinzel Decorative', serif;
    font-size: 24px; font-weight: 700;
    color: oklch(0.93 0.16 308);
    text-shadow: 0 0 14px oklch(0.74 0.22 302), 0 2px 0 oklch(0.16 0.06 290);
    pointer-events: none; letter-spacing: 0.05em;
  }

  .screen-flash {
    position: absolute; inset: 0; mix-blend-mode: screen; pointer-events: none;
    background: radial-gradient(ellipse 70% 60% at 56% 28%, oklch(0.95 0.08 305) 0%, oklch(0.78 0.20 305 / 0.5) 32%, transparent 70%);
    z-index: 55;
  }

  /* ── Controls ── */
  .controls {
    position: fixed; bottom: 22px; left: 50%;
    transform: translateX(-50%);
    display: flex; align-items: center; gap: 14px;
    padding: 10px 18px;
    background: oklch(0.10 0.03 290 / 0.85);
    border: 1px solid oklch(0.72 0.14 300 / 0.30);
    backdrop-filter: blur(8px);
    z-index: 1000;
    font-family: 'JetBrains Mono', monospace;
  }
  .ctrl-btn {
    background: oklch(0.16 0.05 290 / 0.9);
    color: oklch(0.82 0.16 300);
    border: 1px solid oklch(0.72 0.14 300 / 0.45);
    padding: 6px 14px;
    font-family: 'Cinzel', serif; font-size: 10px; font-weight: 700;
    letter-spacing: 0.2em; text-transform: uppercase;
    cursor: pointer; transition: all 0.15s;
  }
  .ctrl-btn:hover {
    background: oklch(0.22 0.06 290 / 0.95);
    border-color: oklch(0.72 0.14 300 / 0.8);
    box-shadow: 0 0 14px oklch(0.72 0.14 300 / 0.30);
  }
  .ctrl-btn.primary {
    background: linear-gradient(180deg, oklch(0.32 0.16 300 / 0.95), oklch(0.18 0.10 298 / 0.95));
    color: oklch(0.94 0.10 305); border-color: oklch(0.72 0.20 302 / 0.7);
  }
  .ctrl-btn.primary:hover { box-shadow: 0 0 18px oklch(0.66 0.22 302 / 0.5); }
  .ctrl-label { font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: oklch(0.65 0.10 300); }
  .ctrl-scrub { width: 220px; accent-color: oklch(0.72 0.16 300); }
  .ctrl-time { color: oklch(0.82 0.16 300); font-size: 10px; min-width: 48px; }
</style>
</head>
<body>
<div id="stage-wrap">
  <div id="stage">
    <div id="root" style="position:absolute;inset:0;"></div>
  </div>
</div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ───────────────────────────────────────────────────────────────────────────────
//  Geometry
// ───────────────────────────────────────────────────────────────────────────────
const STAGE_W = 1280;
const STAGE_H = 720;

// Caster — player's active hero (the Archmage) — launch origin
const CASTER = { x: 720, y: 540 };
const CASTER_ORIGIN = { x: 720, y: 500 };       // where the orbs gather / launch from
const CASTER_CARD = { x: 720, y: 540, w: 90, h: 126 };

// Opponent heroes (potential targets)
const OPP = {
  h3:     { x: 380, y: 200 },
  h2:     { x: 470, y: 200 },
  h1:     { x: 560, y: 200 },
  active: { x: 720, y: 200 },
};

// ───────────────────────────────────────────────────────────────────────────────
//  Timing (seconds)
// ───────────────────────────────────────────────────────────────────────────────
const T = {
  CHARGE_START : 0.0,
  CHARGE_END   : 1.0,    // orbs fully gathered, caster releases
  BANNER_IN    : 0.15,
  BANNER_OUT   : 2.5,
  TARGET_IN    : 0.55,
  TARGET_OUT   : 3.4,
  LAUNCH_FIRST : 1.0,
  LAUNCH_LAST  : 1.55,   // last missile leaves the hand
  FLIGHT       : 0.95,   // time of flight per missile
  HOLD_END     : 3.9,    // full scene length
};

// Each missile: target key + which side it curves toward + curve strength
const MISSILES = [
  { id: 0, target: 'active', side:  1, curve: 200, waves: 2.0, dmg: 4 },
  { id: 1, target: 'active', side: -1, curve: 230, waves: 2.4, dmg: 4 },
  { id: 2, target: 'h1',     side: -1, curve: 180, waves: 1.8, dmg: 3 },
  { id: 3, target: 'h2',     side:  1, curve: 250, waves: 2.2, dmg: 3 },
  { id: 4, target: 'active', side:  1, curve: 150, waves: 2.6, dmg: 4 },
];

// ───────────────────────────────────────────────────────────────────────────────
//  Utilities
// ───────────────────────────────────────────────────────────────────────────────
const clamp01 = v => Math.max(0, Math.min(1, v));
const easeInQuad     = t => t * t;
const easeOutCubic   = t => 1 - Math.pow(1 - t, 3);
const easeInOutCubic = t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
function lerp(a, b, t) { return a + (b - a) * t; }
function norm(v) { const m = Math.hypot(v.x, v.y) || 1; return { x: v.x/m, y: v.y/m }; }

// Cubic bezier + tangent
function cbez(p0, p1, p2, p3, t) {
  const u = 1 - t, uu = u*u, tt = t*t;
  const a = uu*u, b = 3*uu*t, c = 3*u*tt, d = tt*t;
  return {
    x: a*p0.x + b*p1.x + c*p2.x + d*p3.x,
    y: a*p0.y + b*p1.y + c*p2.y + d*p3.y,
  };
}
function cbezTangent(p0, p1, p2, p3, t) {
  const u = 1 - t;
  const a = 3*u*u, b = 6*u*t, c = 3*t*t;
  return {
    x: a*(p1.x-p0.x) + b*(p2.x-p1.x) + c*(p3.x-p2.x),
    y: a*(p1.y-p0.y) + b*(p2.y-p1.y) + c*(p3.y-p2.y),
  };
}

// Pre-compute each missile's curved path control points + launch time
const paths = MISSILES.map((m, i) => {
  const p0 = { ...CASTER_ORIGIN };
  const tgt = OPP[m.target];
  const p3 = { x: tgt.x, y: tgt.y + 6 };
  const dir = norm({ x: p3.x - p0.x, y: p3.y - p0.y });
  const nrm = { x: -dir.y, y: dir.x };          // perpendicular
  const len = Math.hypot(p3.x - p0.x, p3.y - p0.y);
  // C-curve: both control points pushed to the same side → a clear bow.
  // second control swings a touch back so it homes straight into the target.
  const c1 = {
    x: p0.x + dir.x * len * 0.30 + nrm.x * m.curve * m.side,
    y: p0.y + dir.y * len * 0.30 + nrm.y * m.curve * m.side,
  };
  const c2 = {
    x: p0.x + dir.x * len * 0.72 + nrm.x * m.curve * 0.55 * m.side,
    y: p0.y + dir.y * len * 0.72 + nrm.y * m.curve * 0.55 * m.side,
  };
  const launchT = T.LAUNCH_FIRST + (T.LAUNCH_LAST - T.LAUNCH_FIRST) * (i / (MISSILES.length - 1));
  return { ...m, p0, c1, c2, p3, dir, nrm, len, launchT };
});

// Position along a missile path at flight fraction u (0..1), including the
// extra serpentine wobble that fades as it nears the target.
function missilePos(pth, u) {
  const base = cbez(pth.p0, pth.c1, pth.c2, pth.p3, u);
  const tan = norm(cbezTangent(pth.p0, pth.c1, pth.c2, pth.p3, u));
  const wn = { x: -tan.y, y: tan.x };           // normal to the tangent
  const fade = Math.sin(u * Math.PI);           // 0 at ends, 1 mid-flight
  const wob = Math.sin(u * Math.PI * pth.waves + pth.id) * 16 * fade * (1 - u * 0.4);
  return { x: base.x + wn.x * wob, y: base.y + wn.y * wob };
}
function missileAngle(pth, u) {
  const a = missilePos(pth, Math.max(0, u - 0.012));
  const b = missilePos(pth, Math.min(1, u + 0.012));
  return Math.atan2(b.y - a.y, b.x - a.x);
}

// ───────────────────────────────────────────────────────────────────────────────
//  Static board
// ───────────────────────────────────────────────────────────────────────────────
function StaticBoard({ heroHps, casterState }) {
  const opp = [
    { x: 100, y: 130, size: 'sm',     label: 'Deck' },
    { x: 100, y: 232, size: 'sm',     label: 'Cemitério' },
    { x: 380, y: 200, size: 'std',    label: 'Herói 3', hp: heroHps.h3, enemy: true },
    { x: 470, y: 200, size: 'std',    label: 'Herói 2', hp: heroHps.h2, enemy: true },
    { x: 560, y: 200, size: 'std',    label: 'Herói 1', hp: heroHps.h1, enemy: true },
    { x: 720, y: 200, size: 'active', label: 'Herói Ativo', hp: heroHps.active, enemy: true },
    { x: 1180, y: 180, size: 'std',   label: 'Arsenal' },
  ];
  const player = [
    { x: 100, y: 540, size: 'std',    label: 'Arsenal' },
    { x: 360, y: 540, size: 'std',    label: 'Cavaleiro', hp: 90 },
    { x: 450, y: 540, size: 'std',    label: 'Sacerdote', hp: 60 },
    { x: 540, y: 540, size: 'std',    label: 'Arqueiro',  hp: 65 },
    { x: 720, y: 540, size: 'active', label: 'Arquimaga', hp: 70, isCaster: true, casterState },
    { x: 1180, y: 510, size: 'sm',    label: 'Deck' },
    { x: 1180, y: 612, size: 'sm',    label: 'Cemitério' },
  ];
  return (
    <>
      {opp.map((s, i) => <Slot key={'o'+i} theme="opponent" {...s} />)}
      {player.map((s, i) => <Slot key={'p'+i} theme="player" {...s} />)}
    </>
  );
}

function Slot({ x, y, size, label, theme, hp, enemy, isCaster, casterState }) {
  const cardCls = [
    'slot-card',
    isCaster && casterState === 'charging' ? 'caster-charging' : '',
    isCaster && casterState === 'firing'   ? 'caster-firing'   : '',
  ].filter(Boolean).join(' ');
  return (
    <div className={`slot size-${size} theme-${theme}`} style={{ left: x, top: y }}>
      <div className={cardCls}>
        <CardArt theme={theme} size={size} label={label} />
        {hp !== undefined && (
          <div className="hp-bar"><div className={`hp-fill ${enemy ? 'enemy' : ''}`} style={{ width: `${hp}%` }} /></div>
        )}
      </div>
      <div className="slot-label">{label}</div>
    </div>
  );
}

function CardArt({ theme, size, label }) {
  const accent = theme === 'player' ? 'oklch(0.55 0.14 288 / 0.55)' : 'oklch(0.55 0.18 300 / 0.55)';
  const w = size === 'active' ? 90 : size === 'sm' ? 58 : 70;
  const h = size === 'active' ? 126 : size === 'sm' ? 81 : 98;

  if (label === 'Arquimaga') {
    const cx = w/2, cy = h/2;
    return (
      <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} fill="none" style={{ position: 'absolute', inset: 0 }}>
        <rect x="3" y="3" width={w-6} height={h-6} stroke="oklch(0.74 0.16 300 / 0.7)" strokeWidth="0.6"/>
        {/* hat */}
        <path d={`M ${cx} ${cy-30} L ${cx+13} ${cy-6} L ${cx-13} ${cy-6} Z`}
              stroke="oklch(0.70 0.18 300 / 0.9)" strokeWidth="0.7" fill="oklch(0.14 0.05 290 / 0.6)"/>
        <circle cx={cx} cy={cy-30} r="1.6" fill="oklch(0.92 0.16 305)"/>
        {/* staff */}
        <line x1={cx-14} y1={cy+26} x2={cx+8} y2={cy-2}
              stroke="oklch(0.62 0.10 290 / 0.85)" strokeWidth="1.1" strokeLinecap="round"/>
        {/* orbiting orbs */}
        <circle cx={cx+8} cy={cy-2} r="3.4" fill="oklch(0.90 0.16 305)"/>
        <circle cx={cx+8} cy={cy-2} r="6" fill="none" stroke="oklch(0.78 0.20 305 / 0.5)" strokeWidth="0.6"/>
        <circle cx={cx-7} cy={cy+8} r="1.7" fill="oklch(0.85 0.18 308 / 0.9)"/>
        <circle cx={cx+13} cy={cy+12} r="1.4" fill="oklch(0.85 0.18 308 / 0.85)"/>
        <rect x="6" y={h - 22} width={w-12} height="12" fill="oklch(0.07 0.03 290 / 0.7)"
              stroke="oklch(0.74 0.16 300 / 0.5)" strokeWidth="0.4"/>
      </svg>
    );
  }
  if (label === 'Arqueiro') {
    return (
      <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} fill="none" style={{ position: 'absolute', inset: 0 }}>
        <rect x="3" y="3" width={w-6} height={h-6} stroke={accent} strokeWidth="0.6"/>
        <path d={`M ${w/2-12} ${h/2-16} Q ${w/2-22} ${h/2}, ${w/2-12} ${h/2+16}`}
              stroke="oklch(0.80 0.12 295 / 0.85)" strokeWidth="1.2" fill="none" strokeLinecap="round"/>
        <line x1={w/2-6} y1={h/2} x2={w/2+18} y2={h/2} stroke="oklch(0.85 0.08 295 / 0.95)" strokeWidth="1.0"/>
      </svg>
    );
  }
  if (label === 'Sacerdote') {
    const cx = w/2, cy = h/2;
    return (
      <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} fill="none" style={{ position: 'absolute', inset: 0 }}>
        <rect x="3" y="3" width={w-6} height={h-6} stroke={accent} strokeWidth="0.6"/>
        <circle cx={cx} cy={cy-14} r="9" stroke="oklch(0.85 0.14 290 / 0.8)" strokeWidth="0.6" fill="none"/>
        <line x1={cx} y1={cy-6} x2={cx} y2={cy+22} stroke="oklch(0.78 0.10 290 / 0.9)" strokeWidth="1.2" strokeLinecap="round"/>
      </svg>
    );
  }
  // Generic ornament
  return (
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} fill="none" style={{ position: 'absolute', inset: 0 }}>
      <rect x="3" y="3" width={w-6} height={h-6} stroke={accent} strokeWidth="0.5" opacity="0.6"/>
      <path d={`M ${w/2} ${h*0.18} L ${w*0.78} ${h*0.5} L ${w/2} ${h*0.82} L ${w*0.22} ${h*0.5} Z`}
            stroke={accent} strokeWidth="0.5" fill="none" opacity="0.8"/>
      <circle cx={w/2} cy={h*0.5} r={w*0.14} stroke={accent} strokeWidth="0.4" fill="none"/>
      <circle cx={w/2} cy={h*0.5} r={w*0.04} fill={accent}/>
    </svg>
  );
}

// ───────────────────────────────────────────────────────────────────────────────
//  Missile graphics
// ───────────────────────────────────────────────────────────────────────────────
const TRAIL_STEPS = 14;     // samples back along the path
const TRAIL_SPAN  = 0.16;   // how far back (in u) the trail reaches

function Missile({ pth, u }) {
  const head = missilePos(pth, u);
  const ang = missileAngle(pth, u);
  // Build a ribbon trail by sampling the true curved path backwards.
  const pts = [];
  for (let i = 0; i <= TRAIL_STEPS; i++) {
    const uu = u - (i / TRAIL_STEPS) * TRAIL_SPAN;
    if (uu < 0) break;
    pts.push(missilePos(pth, uu));
  }
  const poly = pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');

  return (
    <g>
      {/* soft outer trail */}
      {pts.length > 1 && (
        <polyline points={poly} fill="none"
          stroke="oklch(0.62 0.22 302 / 0.30)" strokeWidth="7"
          strokeLinecap="round" strokeLinejoin="round" />
      )}
      {/* bright inner trail */}
      {pts.length > 1 && (
        <polyline points={poly} fill="none"
          stroke="oklch(0.86 0.18 306 / 0.65)" strokeWidth="2.4"
          strokeLinecap="round" strokeLinejoin="round" />
      )}
      {/* sparkle motes shed along the trail */}
      {pts.filter((_, i) => i % 3 === 1).map((p, i) => {
        const op = 1 - (i / (TRAIL_STEPS / 3));
        return <circle key={i} cx={p.x} cy={p.y} r={1.3 * op + 0.4}
          fill={`oklch(0.92 0.14 308 / ${0.55 * op})`} />;
      })}
      {/* glowing head */}
      <g transform={`translate(${head.x} ${head.y})`}>
        <circle r="11" fill="oklch(0.70 0.22 303 / 0.30)" />
        <circle r="6"  fill="oklch(0.82 0.20 305 / 0.65)" />
        <circle r="3"  fill="oklch(0.99 0.04 305)" />
        {/* tiny comet spike along travel direction */}
        <path transform={`rotate(${ang*180/Math.PI})`}
              d="M 3 0 L 9 0" stroke="oklch(0.99 0.05 305)" strokeWidth="1.4" strokeLinecap="round"/>
      </g>
    </g>
  );
}

// Impact burst when a missile lands
function Impact({ x, y, life }) {
  // life 0..1 over ~0.5s
  const r = 4 + life * 30;
  const op = (1 - life);
  return (
    <g transform={`translate(${x} ${y})`} style={{ mixBlendMode: 'screen' }}>
      <circle r={r} fill="none" stroke={`oklch(0.86 0.18 305 / ${op * 0.9})`} strokeWidth="1.6"/>
      <circle r={r * 0.5} fill="none" stroke={`oklch(0.95 0.12 306 / ${op * 0.7})`} strokeWidth="0.9"/>
      {life < 0.35 && (
        <circle r={9 * (1 - life/0.35)} fill={`oklch(0.99 0.05 305 / ${(1 - life/0.35) * 0.9})`}/>
      )}
      {[0,1,2,3,4,5,6,7].map(i => {
        const a = (i / 8) * Math.PI * 2;
        const d = life * 26;
        return <circle key={i} cx={Math.cos(a)*d} cy={Math.sin(a)*d}
          r={(1 - life) * 1.6 + 0.4} fill={`oklch(0.90 0.16 307 / ${(1 - life) * 0.7})`}/>;
      })}
    </g>
  );
}

// ───────────────────────────────────────────────────────────────────────────────
//  Scene derivation
// ───────────────────────────────────────────────────────────────────────────────
function deriveScene(t) {
  // Caster state
  let casterState = 'idle';
  if (t >= T.CHARGE_START && t < T.CHARGE_END) casterState = 'charging';
  else if (t >= T.CHARGE_END && t < T.LAUNCH_LAST + 0.4) casterState = 'firing';

  // Charge gather glow 0..1
  let chargeGlow = 0;
  if (t < T.CHARGE_END) chargeGlow = easeInQuad(clamp01((t - T.CHARGE_START) / (T.CHARGE_END - T.CHARGE_START)));
  else if (t < T.CHARGE_END + 0.3) chargeGlow = 1 - (t - T.CHARGE_END) / 0.3;

  // Banner
  const bannerShow = t >= T.BANNER_IN && t < T.BANNER_OUT;
  const bIn  = clamp01((t - T.BANNER_IN) / 0.35);
  const bOut = clamp01((T.BANNER_OUT - t) / 0.4);
  const bannerOpacity = bannerShow ? Math.min(bIn, bOut) : 0;
  const bannerLabel = t < T.CHARGE_END ? 'Concentrando energia arcana' : 'Os feixes perseguem o alvo';

  // Target aura
  const targetShow = t >= T.TARGET_IN && t < T.TARGET_OUT;
  const aIn  = clamp01((t - T.TARGET_IN) / 0.4);
  const aOut = clamp01((T.TARGET_OUT - t) / 0.5);
  const targetOpacity = targetShow ? Math.min(aIn, aOut) : 0;

  // Per-missile
  const flying = [];
  const impacts = [];
  const damages = [];

  for (const pth of paths) {
    const local = (t - pth.launchT) / T.FLIGHT;
    if (local <= 0) continue;
    if (local < 1) {
      const u = easeInOutCubic(local);   // smooth accelerate-then-home
      flying.push({ id: pth.id, pth, u });
    } else {
      const since = t - (pth.launchT + T.FLIGHT);
      if (since < 0.55) impacts.push({ id: pth.id, x: pth.p3.x, y: pth.p3.y, life: since / 0.55 });
      if (since > 0.04 && since < 0.85) {
        const tgt = OPP[pth.target];
        damages.push({
          id: pth.id, val: pth.dmg,
          x: tgt.x + (pth.id % 3 - 1) * 14,
          y: tgt.y - 12 - since * 40,
          opacity: 1 - since / 0.85,
        });
      }
    }
  }

  // HP drain on each target as missiles land
  const heroHps = { h1: 80, h2: 55, h3: 30, active: 70 };
  for (const pth of paths) {
    if (t >= pth.launchT + T.FLIGHT) heroHps[pth.target] = Math.max(0, heroHps[pth.target] - pth.dmg);
  }

  // Launch flash
  let flash = 0;
  if (t >= T.CHARGE_END - 0.05 && t < T.CHARGE_END + 0.3) {
    flash = (1 - clamp01((t - (T.CHARGE_END - 0.05)) / 0.35)) * 0.4;
  }

  return { casterState, chargeGlow, bannerOpacity, bannerLabel, targetOpacity, flying, impacts, damages, heroHps, flash };
}

// ───────────────────────────────────────────────────────────────────────────────
//  Caster overlay — charge orbs gathering at the staff before release
// ───────────────────────────────────────────────────────────────────────────────
function CasterOverlay({ chargeGlow, t }) {
  const { x, y } = CASTER_ORIGIN;
  if (chargeGlow <= 0.01) return null;
  const glowSize = 26 + chargeGlow * 90;
  return (
    <>
      <div style={{
        position: 'absolute', left: x, top: y,
        width: glowSize, height: glowSize, transform: 'translate(-50%, -50%)',
        borderRadius: '50%', pointerEvents: 'none', mixBlendMode: 'screen',
        background: 'radial-gradient(circle, oklch(0.95 0.10 305 / 0.85) 0%, oklch(0.74 0.22 303 / 0.4) 40%, transparent 72%)',
        opacity: chargeGlow,
      }}/>
      {/* gathering motes spiralling inward */}
      <svg className="fx-layer" viewBox={`0 0 ${STAGE_W} ${STAGE_H}`} preserveAspectRatio="none"
           style={{ mixBlendMode: 'screen' }}>
        {[0,1,2,3,4,5,6,7].map(i => {
          const ang = t * 3 + i * (Math.PI*2/8);
          const rad = (1 - chargeGlow) * 42 + 8;
          return <circle key={i} cx={x + Math.cos(ang)*rad} cy={y + Math.sin(ang)*rad}
            r={1.4} fill={`oklch(0.92 0.14 306 / ${chargeGlow})`} />;
        })}
      </svg>
    </>
  );
}

// ───────────────────────────────────────────────────────────────────────────────
//  App
// ───────────────────────────────────────────────────────────────────────────────
function App() {
  const [t, setT] = useState(0);
  const [playing, setPlaying] = useState(true);
  const rafRef = useRef(null);
  const lastRef = useRef(performance.now());

  useEffect(() => {
    function tick(now) {
      const dt = Math.min((now - lastRef.current) / 1000, 0.05);
      lastRef.current = now;
      if (playing) {
        setT(prev => {
          const next = prev + dt;
          if (next >= T.HOLD_END) { if (next >= T.HOLD_END + 1.2) return 0; return next; }
          return next;
        });
      }
      rafRef.current = requestAnimationFrame(tick);
    }
    lastRef.current = performance.now();
    rafRef.current = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(rafRef.current);
  }, [playing]);

  useEffect(() => { window.__setT = (v) => { setPlaying(false); setT(v); }; }, []);

  const s = deriveScene(t);
  const oa = OPP.active;

  return (
    <>
      <div id="stage-inner" style={{ position: 'absolute', inset: 0 }}>
        <div className="bg-opponent"/>
        <div className="bg-player"/>
        <div className="bg-center-line"/>
        <div className="bg-noise"/>
        <div className="half-label opp">Área do Oponente — Alvo</div>
        <div className="half-label pl">Sua Área — Arquimaga</div>

        <StaticBoard heroHps={s.heroHps} casterState={s.casterState} />

        {/* Target aura over opponent active hero */}
        <div className="target-aura" style={{
          left: oa.x - 52, top: oa.y - 70, width: 104, height: 140, opacity: s.targetOpacity,
        }}>
          <div className="c tl"/><div className="c tr"/><div className="c bl"/><div className="c br"/>
        </div>

        {/* Ability banner */}
        <div className="ability-banner" style={{ opacity: s.bannerOpacity }}>
          <div className="ability-sub">Magia Arcana</div>
          <div className="ability-name">Mísseis Mágicos</div>
          <div className="ability-rule"/>
          <div className="ability-sub" style={{ marginTop: 6, opacity: 0.7 }}>{s.bannerLabel}</div>
        </div>

        {/* Caster charge orbs */}
        <CasterOverlay chargeGlow={s.chargeGlow} t={t} />

        {/* FX layer — missiles + impacts */}
        <svg className="fx-layer" viewBox={`0 0 ${STAGE_W} ${STAGE_H}`} preserveAspectRatio="none">
          {s.impacts.map(im => <Impact key={'im'+im.id} x={im.x} y={im.y} life={im.life} />)}
          {s.flying.map(f => <Missile key={'m'+f.id} pth={f.pth} u={f.u} />)}
        </svg>

        {/* Damage popups */}
        {s.damages.map(d => (
          <div key={'d'+d.id} className="dmg" style={{ left: d.x, top: d.y, opacity: d.opacity }}>−{d.val}</div>
        ))}

        {/* Launch flash */}
        {s.flash > 0.001 && <div className="screen-flash" style={{ opacity: s.flash }}/>}
      </div>

      {/* Controls */}
      <div className="controls">
        <button className="ctrl-btn primary" onClick={() => { setT(0); setPlaying(true); }}>✦ Conjurar</button>
        <button className="ctrl-btn" onClick={() => setPlaying(p => !p)}>{playing ? '❚❚ Pausar' : '▶ Tocar'}</button>
        <span className="ctrl-label">Tempo</span>
        <input type="range" className="ctrl-scrub" min="0" max={T.HOLD_END + 1.2} step="0.01"
               value={t} onChange={e => { setT(parseFloat(e.target.value)); setPlaying(false); }}/>
        <span className="ctrl-time">{t.toFixed(2)}s</span>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<script>
(function() {
  const stage = document.getElementById('stage');
  function fit() {
    const vw = window.innerWidth;
    const vh = Math.max(window.innerHeight - 70, 0);
    if (vw <= 0 || vh <= 0) return;
    const s = Math.max(0.01, Math.min(vw / 1280, vh / 720));
    stage.style.transform = `scale(${s})`;
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
  requestAnimationFrame(fit);
  fit();
})();
</script>
</body>
</html>

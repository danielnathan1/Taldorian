<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Taldorian — HUD do Mundo Aberto</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:          #14161c;
    --panel:       21 24 31;       /* rgb for rgba() */
    --panel-2:     #20242e;
    --line:        #2a2e3a;
    --line-bright: #3a4150;
    --ink:         #e7e3da;
    --ink-dim:     #b7b6ad;
    --muted:       #8b8f9c;
    --muted-2:     #6b6f7c;
    --accent:      #87cee4;        /* tweakable */
    --accent-deep: #4f97ad;
    --gold:        #e0b04a;
    --gold-bright: #f5cf6a;
    --whisper:     #b89cff;
    --guild:       #8fd99a;
    --danger:      #e0795f;

    --hud-alpha:   0.86;           /* tweakable panel opacity */
    --frame-a:     #4a515f;        /* avatar frame outer (tweakable) */
    --frame-b:     #6b7385;        /* avatar frame highlight */
    --frame-glow:  rgba(135,206,228,0); /* tweakable */
  }

  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
  body { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: var(--ink); }

  img, canvas, .pixelated, .sprite { image-rendering: pixelated; image-rendering: crisp-edges; }

  /* ───────────────────────── World layer ───────────────────────── */
  #world {
    position: fixed; inset: 0; z-index: 0;
    background-color: #5b5e5a;
  }
  #world.tone-grass {
    background-color: #4c5742;
    background-image:
      radial-gradient(circle at 50% 50%, rgba(255,255,255,.025) 1px, transparent 1.5px),
      linear-gradient(0deg,   rgba(0,0,0,.10) 1px, transparent 1px),
      linear-gradient(90deg,  rgba(0,0,0,.10) 1px, transparent 1px),
      radial-gradient(ellipse 120% 90% at 50% 60%, transparent 40%, rgba(0,0,0,.35) 100%);
    background-size: 16px 16px, 32px 32px, 32px 32px, 100% 100%;
  }
  #world.tone-stone {
    background-color: #3b3f47;
    background-image:
      radial-gradient(circle at 50% 50%, rgba(255,255,255,.02) 1px, transparent 1.5px),
      linear-gradient(0deg,   rgba(0,0,0,.16) 1px, transparent 1px),
      linear-gradient(90deg,  rgba(0,0,0,.16) 1px, transparent 1px),
      radial-gradient(ellipse 120% 90% at 50% 60%, transparent 40%, rgba(0,0,0,.40) 100%);
    background-size: 16px 16px, 48px 48px, 48px 48px, 100% 100%;
  }
  #world.tone-neutral {
    background-color: #5b5e5a;
    background-image: radial-gradient(ellipse 120% 90% at 50% 60%, transparent 50%, rgba(0,0,0,.20) 100%);
  }

  /* Player avatar in the world */
  #player {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    pointer-events: none;
  }
  #player .nameplate {
    font-family: ui-monospace, monospace; font-weight: 700;
    font-size: 15px; letter-spacing: .04em;
    color: #d6d6d2;
    text-shadow: 0 0 2px #000, 1px 1px 0 rgba(0,0,0,.6);
  }
  #player .sprite {
    width: 64px; height: 64px;
    background-image: url('elf_walk.png');
    background-repeat: no-repeat;
    background-position: 0 -128px;        /* front row, idle frame */
    transform: scale(3); transform-origin: bottom center;
    margin-bottom: 28px;
    filter: drop-shadow(0 6px 4px rgba(0,0,0,.45));
    animation: idleBob 2.6s steps(1) infinite;
  }
  /* subtle 2-frame idle */
  @keyframes idleBob {
    0%, 49%   { background-position: 0   -128px; }
    50%, 100% { background-position: -64px -128px; }
  }
  #player .shadow {
    position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%);
    width: 54px; height: 14px; border-radius: 50%;
    background: radial-gradient(ellipse, rgba(0,0,0,.45), transparent 70%);
    z-index: -1;
  }

  /* ───────────────────────── HUD root ───────────────────────── */
  #hud { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
  #hud > * { pointer-events: auto; }

  /* Generic pixel panel */
  .panel {
    background: rgba(var(--panel), var(--hud-alpha));
    border: 2px solid var(--line-bright);
    box-shadow:
      0 0 0 2px rgba(0,0,0,.55),
      inset 0 2px 0 rgba(255,255,255,.05),
      inset 0 -2px 0 rgba(0,0,0,.35),
      0 8px 22px rgba(0,0,0,.45);
    backdrop-filter: blur(6px) saturate(1.05);
  }

  .mono-label {
    font-family: 'Silkscreen', monospace;
    text-transform: uppercase;
    letter-spacing: .08em;
  }

  /* ───────────────────────── Player card (top-left) ───────────────────────── */
  #player-card {
    position: absolute; top: 18px; left: 18px;
    display: flex; flex-direction: column; gap: 0;
    width: 252px;
  }
  .pc-top { display: flex; gap: 12px; padding: 11px 12px 10px; align-items: center; }

  /* Avatar frame */
  .avatar-frame {
    position: relative; flex: none;
    width: 60px; height: 60px;
    padding: 3px;
    background:
      linear-gradient(135deg, var(--frame-b), var(--frame-a) 55%, #20242e);
    box-shadow:
      0 0 0 2px #14161c,
      0 0 0 3px var(--frame-a),
      0 0 10px 1px var(--frame-glow);
  }
  .avatar-frame::before, .avatar-frame::after {
    content: ''; position: absolute; width: 7px; height: 7px;
    background: var(--frame-b); z-index: 3;
    box-shadow: 0 0 0 1px #14161c;
  }
  .avatar-frame::before { top: -2px; left: -2px; }
  .avatar-frame::after  { bottom: -2px; right: -2px; }
  .avatar-corner-tr, .avatar-corner-bl {
    position: absolute; width: 7px; height: 7px;
    background: var(--frame-b); z-index: 3;
    box-shadow: 0 0 0 1px #14161c;
  }
  .avatar-corner-tr { top: -2px; right: -2px; }
  .avatar-corner-bl { bottom: -2px; left: -2px; }

  image-slot {
    display: block; width: 100%; height: 100%;
    --is-bg: #181b22;
  }

  .level-badge {
    position: absolute; bottom: -7px; left: 50%; transform: translateX(-50%);
    z-index: 4;
    font-family: 'Silkscreen', monospace; font-size: 9px; font-weight: 700;
    color: #1a1205; background: linear-gradient(180deg, var(--gold-bright), var(--gold));
    padding: 2px 6px 1px;
    box-shadow: 0 0 0 2px #14161c, 0 1px 3px rgba(0,0,0,.5);
    letter-spacing: .03em; white-space: nowrap;
  }

  .pc-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 7px; }
  .pc-name {
    font-family: ui-monospace, monospace; font-weight: 700;
    font-size: 16px; color: var(--ink); letter-spacing: .01em;
    line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .pc-stats { display: flex; align-items: center; gap: 10px; }
  .pc-stat { display: flex; align-items: center; gap: 5px; }
  .pc-stat .ico { flex: none; }
  .pc-stat .val {
    font-family: 'Silkscreen', monospace; font-size: 11px; line-height: 1;
    letter-spacing: .02em;
  }
  .pc-gold .val  { color: var(--gold-bright); }
  .pc-rank .val  { color: var(--ink-dim); }
  .pc-divider { width: 1px; height: 13px; background: var(--line-bright); }

  /* XP bar */
  .xp-wrap { padding: 0 12px 11px; }
  .xp-meta {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 4px;
  }
  .xp-meta .t { font-family: 'Silkscreen', monospace; font-size: 8px; color: var(--muted); letter-spacing: .1em; }
  .xp-meta .n { font-family: 'Silkscreen', monospace; font-size: 8px; color: var(--muted-2); letter-spacing: .05em; }
  .xp-track {
    height: 7px; background: #11131a;
    box-shadow: inset 0 0 0 1px #000, inset 0 1px 2px rgba(0,0,0,.6);
    position: relative; overflow: hidden;
  }
  .xp-fill {
    height: 100%; width: 68%;
    background: linear-gradient(180deg, var(--accent), var(--accent-deep));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 0 8px var(--frame-glow);
    image-rendering: pixelated;
  }
  .xp-fill::after {
    content: ''; position: absolute; top: 0; bottom: 0; right: 0; width: 2px;
    background: rgba(255,255,255,.5);
  }

  /* ───────────────────────── Chat (bottom-left) ───────────────────────── */
  #chat {
    position: absolute; bottom: 18px; left: 18px;
    width: 376px; display: flex; flex-direction: column;
    transition: width .15s ease;
  }
  #chat.compact { width: 300px; }

  .chat-tabs { display: flex; gap: 0; border-bottom: 2px solid var(--line-bright); }
  .chat-tab {
    flex: 1; position: relative;
    background: transparent; border: none; cursor: pointer;
    font-family: 'Silkscreen', monospace; font-size: 9px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted);
    padding: 9px 4px 8px; transition: color .12s, background .12s;
    border-right: 1px solid rgba(0,0,0,.4);
  }
  .chat-tab:last-child { border-right: none; }
  .chat-tab:hover { color: var(--ink-dim); background: rgba(255,255,255,.03); }
  .chat-tab.active { color: var(--accent); background: rgba(135,206,228,.07); }
  .chat-tab.active::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: -2px; height: 2px;
    background: var(--accent); box-shadow: 0 0 6px var(--frame-glow);
  }
  .chat-tab .unread {
    display: inline-block; min-width: 14px; margin-left: 5px;
    font-size: 8px; color: #14161c; background: var(--accent);
    padding: 1px 3px; vertical-align: middle; line-height: 1.1;
  }

  .chat-log {
    height: 158px; overflow-y: auto; padding: 9px 11px;
    display: flex; flex-direction: column; gap: 6px;
    scrollbar-width: thin; scrollbar-color: var(--line-bright) transparent;
  }
  #chat.compact .chat-log { height: 96px; }
  .chat-log::-webkit-scrollbar { width: 7px; }
  .chat-log::-webkit-scrollbar-thumb { background: var(--line-bright); }
  .chat-log::-webkit-scrollbar-track { background: transparent; }

  .msg { font-size: 12.5px; line-height: 1.42; word-wrap: break-word; }
  .msg .time { color: var(--muted-2); font-size: 10px; margin-right: 5px; }
  .msg .who  { font-weight: 700; }
  .msg .who::after { content: ':'; color: var(--muted); font-weight: 400; margin-right: 4px; }
  .msg .body { color: var(--ink-dim); }
  .msg.c-global .who  { color: var(--accent); }
  .msg.c-privado .who { color: var(--whisper); }
  .msg.c-guild .who   { color: var(--guild); }
  .msg.c-system { font-size: 11.5px; }
  .msg.c-system .who  { color: var(--gold-bright); font-weight: 700; }
  .msg.c-system .who::after { content: ''; margin: 0; }
  .msg.c-system .body { color: var(--gold); font-style: normal; opacity: .92; }
  .msg .arrow { color: var(--muted); }

  .chat-input {
    display: flex; align-items: stretch;
    border-top: 2px solid var(--line-bright);
  }
  .chat-input .ch-prefix {
    display: flex; align-items: center; padding: 0 9px;
    font-family: 'Silkscreen', monospace; font-size: 8px; letter-spacing: .06em;
    color: var(--accent); background: rgba(0,0,0,.25);
    border-right: 1px solid var(--line-bright); white-space: nowrap;
  }
  .chat-input input {
    flex: 1; min-width: 0; background: transparent; border: none; outline: none;
    color: var(--ink); font-family: ui-monospace, monospace; font-size: 12.5px;
    padding: 9px 10px; caret-color: var(--accent);
  }
  .chat-input input::placeholder { color: var(--muted-2); }
  .chat-send {
    background: transparent; border: none; border-left: 1px solid var(--line-bright);
    color: var(--muted); cursor: pointer; padding: 0 11px; transition: color .12s;
    display: flex; align-items: center;
  }
  .chat-send:hover { color: var(--accent); }

  /* ───────────────────────── Icon bar (bottom-right) ───────────────────────── */
  #iconbar {
    position: absolute; bottom: 18px; right: 18px;
    display: flex; gap: 8px; padding: 8px;
  }
  .hud-btn {
    position: relative; width: 50px; height: 50px;
    background: linear-gradient(180deg, #232733, #1a1d26);
    border: 2px solid var(--line-bright);
    box-shadow: inset 0 2px 0 rgba(255,255,255,.05), inset 0 -2px 0 rgba(0,0,0,.4);
    color: var(--ink-dim); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform .1s, border-color .12s, color .12s, box-shadow .12s;
  }
  .hud-btn:hover {
    color: var(--accent); border-color: var(--accent-deep);
    box-shadow: inset 0 2px 0 rgba(255,255,255,.07), 0 0 14px var(--frame-glow);
    transform: translateY(-2px);
  }
  .hud-btn:active { transform: translateY(0) scale(.95); }
  .hud-btn.danger:hover { color: var(--danger); border-color: #7a4035; }
  .hud-btn.battle {
    color: var(--accent); border-color: var(--accent-deep);
    background: linear-gradient(180deg, #243642, #18222a);
    box-shadow: inset 0 2px 0 rgba(255,255,255,.06), inset 0 -2px 0 rgba(0,0,0,.4), 0 0 12px var(--frame-glow);
  }
  .hud-btn.battle:hover { filter: brightness(1.15); }
  .bar-sep { width: 2px; align-self: stretch; margin: 2px 2px; background: var(--line-bright); flex: none; }
  .hud-btn .badge {
    position: absolute; top: -6px; right: -6px;
    font-family: 'Silkscreen', monospace; font-size: 8px; color: #102016;
    background: var(--guild); padding: 1px 4px; line-height: 1.2;
    box-shadow: 0 0 0 2px #14161c;
  }
  .hud-btn .tip {
    position: absolute; bottom: calc(100% + 9px); left: 50%; transform: translateX(-50%);
    font-family: 'Silkscreen', monospace; font-size: 8px; letter-spacing: .06em;
    text-transform: uppercase; color: var(--ink); background: rgba(10,11,15,.95);
    border: 1px solid var(--line-bright); padding: 4px 7px; white-space: nowrap;
    opacity: 0; pointer-events: none; transition: opacity .12s, transform .12s;
    transform: translateX(-50%) translateY(4px);
  }
  .hud-btn:hover .tip { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Friends popover */
  .friends-pop {
    position: absolute; bottom: calc(100% + 12px); right: 0;
    width: 218px; padding: 0;
  }
  .friends-pop .fp-head {
    font-family: 'Silkscreen', monospace; font-size: 9px; letter-spacing: .08em;
    color: var(--guild); text-transform: uppercase;
    padding: 9px 11px; border-bottom: 2px solid var(--line-bright);
    display: flex; justify-content: space-between; align-items: center;
  }
  .friends-pop .fp-head .n { color: var(--muted); }
  .fp-list { padding: 6px; display: flex; flex-direction: column; gap: 1px; max-height: 188px; overflow-y: auto; }
  .fp-row { display: flex; align-items: center; gap: 9px; padding: 6px 6px; }
  .fp-row:hover { background: rgba(255,255,255,.03); }
  .fp-dot { width: 8px; height: 8px; flex: none; box-shadow: 0 0 0 1px #000; }
  .fp-dot.on  { background: var(--guild); box-shadow: 0 0 6px var(--guild), 0 0 0 1px #000; }
  .fp-dot.idle{ background: var(--gold); }
  .fp-dot.off { background: #4a4e58; }
  .fp-name { font-size: 12.5px; color: var(--ink-dim); flex: 1; }
  .fp-status { font-family: 'Silkscreen', monospace; font-size: 8px; color: var(--muted-2); letter-spacing: .04em; }

  /* Toast */
  #toasts {
    position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%);
    z-index: 40; display: flex; flex-direction: column; gap: 8px; align-items: center;
    pointer-events: none;
  }
  .toast {
    font-family: ui-monospace, monospace; font-size: 12.5px; color: var(--ink);
    background: rgba(15,16,22,.95); border: 2px solid var(--line-bright);
    box-shadow: 0 0 0 2px rgba(0,0,0,.5), 0 6px 18px rgba(0,0,0,.5);
    padding: 8px 16px; white-space: nowrap;
    animation: toastIn .22s ease both;
  }
  .toast .k { color: var(--accent); font-family: 'Silkscreen', monospace; font-size: 9px; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>

<div id="world" class="tone-grass">
  <div id="player">
    <div class="nameplate">Sagashii</div>
    <div class="sprite"></div>
    <div class="shadow"></div>
  </div>
</div>

<div id="hud"></div>
<div id="toasts"></div>

<script src="image-slot.js"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ── Icons (clean geometric, currentColor) ───────────────────────────── */

/* ── Chat ─────────────────────────────────────────────────────────────── */
function Chat({ compact, pushToast }) {
  const [tab, setTab] = useState('global');
  const [logs, setLogs] = useState(SEED);
  const [draft, setDraft] = useState('');
  const [unread, setUnread] = useState({ global:0, privado:0, guild:0 });
  const logRef = useRef(null);
  const inputRef = useRef(null);

  useEffect(() => {
    if (logRef.current) logRef.current.scrollTop = logRef.current.scrollHeight;
  }, [logs, tab, compact]);

  // Ambient incoming messages on other channels -> unread badges
  useEffect(() => {
    const lines = [
      ['global','Lira','quem topa um draft amistoso?'],
      ['guild','Sayen','não esqueçam da guild war sábado'],
      ['global','Pyx','procurando guild ativa, sou Ouro I'],
    ];
    let i = 0;
    const id = setInterval(() => {
      const [ch, who, body] = lines[i % lines.length]; i++;
      const t = new Date().toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
      setLogs(prev => ({ ...prev, [ch]: [...prev[ch], { t, who, body }].slice(-40) }));
      setTab(curr => { if (ch !== curr) setUnread(u => ({ ...u, [ch]: u[ch] + 1 })); return curr; });
    }, 9000);
    return () => clearInterval(id);
  }, []);

  const selectTab = (ch) => { setTab(ch); setUnread(u => ({ ...u, [ch]: 0 })); };

  const send = () => {
    const text = draft.trim();
    if (!text) return;
    const t = new Date().toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
    const entry = tab === 'privado'
      ? { t, who:'você', body:text, arrow:'out' }
      : { t, who:'você', body:text, me:true };
    setLogs(prev => ({ ...prev, [tab]: [...prev[tab], entry].slice(-40) }));
    setDraft('');
  };

  return (
    <div id="chat" className={`panel ${compact ? 'compact' : ''}`}>
      <div className="chat-tabs">
        {['global','privado','guild'].map(ch => (
          <button key={ch} className={`chat-tab ${tab===ch?'active':''}`} onClick={() => selectTab(ch)}>
            {CH_LABEL[ch]}
            {unread[ch] > 0 && <span className="unread">{unread[ch]}</span>}
          </button>
        ))}
      </div>

      <div className="chat-log" ref={logRef}>
        {logs[tab].map((m, idx) => (
          <div key={idx} className={`msg c-${m.sys ? 'system' : tab}`}>
            <span className="time">{m.t}</span>
            {m.arrow === 'out' && <span className="arrow">→ </span>}
            <span className="who" style={m.me ? { color:'var(--ink)' } : undefined}>{m.who}</span>
            <span className="body">{m.body}</span>
          </div>
        ))}
      </div>

      <div className="chat-input">
        <span className="ch-prefix">{CH_LABEL[tab]}</span>
        <input
          ref={inputRef}
          value={draft}
          onChange={e => setDraft(e.target.value)}
          onKeyDown={e => { if (e.key === 'Enter') send(); }}
          placeholder="Pressione Enter para conversar…"
          spellCheck="false" autoComplete="off"
        />
        <button className="chat-send" onClick={send} title="Enviar">{Icon.send(15)}</button>
      </div>
    </div>
  );
}

/* ── Icon bar ─────────────────────────────────────────────────────────── */
function IconBar({ pushToast }) {
  const [friendsOpen, setFriendsOpen] = useState(false);
  const onlineCount = FRIENDS.filter(f => f.s === 'on').length;
  const barRef = useRef(null);

  useEffect(() => {
    const onDoc = (e) => { if (barRef.current && !barRef.current.contains(e.target)) setFriendsOpen(false); };
    document.addEventListener('mousedown', onDoc);
    return () => document.removeEventListener('mousedown', onDoc);
  }, []);

  return (
    <div id="iconbar" className="panel" ref={barRef}>
      <button className="hud-btn battle" onClick={() => pushToast('Batalha', 'buscando partida…')}>
        <span className="tip">Batalha</span>
        {Icon.swords(24)}

      <span className="bar-sep"></span>

      <button className="hud-btn" onClick={() => pushToast('Inventário', 'em breve — mochila do herói')}>
        <span className="tip">Inventário</span>
        {Icon.backpack(24)}
      </button>

      <a className="hud-btn" href="Deck Builder.html" style={{ textDecoration:'none' }}>
        <span className="tip">Decks</span>
        {Icon.decks(24)}
      </a>

      <button className="hud-btn" onClick={() => setFriendsOpen(o => !o)}>
        <span className="tip">Amigos</span>
        {onlineCount > 0 && <span className="badge">{onlineCount}</span>}
        {Icon.friends(24)}
        {friendsOpen && (
          <div className="friends-pop panel" onClick={e => e.stopPropagation()}>
            <div className="fp-head"><span>Amigos</span><span className="n">{onlineCount} online</span></div>
            <div className="fp-list">
              {FRIENDS.map(f => (
                <div className="fp-row" key={f.name}>
                  <span className={`fp-dot ${f.s}`}></span>
                  <span className="fp-name">{f.name}</span>
                  <span className="fp-status">{f.status}</span>
                </div>
              ))}
            </div>
          </div>
        )}
      </button>

      <button className="hud-btn danger" onClick={() => { pushToast('Saindo…', 'voltando ao lobby'); setTimeout(() => { window.location.href = 'Lobby.html'; }, 800); }}>
        <span className="tip">Sair</span>
        {Icon.power(22)}
      </button>
    </div>
  );
}

/* ── Toasts ───────────────────────────────────────────────────────────── */
function useToasts() {
  const [items, setItems] = useState([]);
  const push = useCallback((title, sub) => {
    const id = Date.now() + Math.random();
    setItems(prev => [...prev, { id, title, sub }]);
    setTimeout(() => setItems(prev => prev.filter(t => t.id !== id)), 2600);
  }, []);
  const node = (
    <>{items.map(t => (
      <div className="toast" key={t.id}>
        <span className="k">{t.title}</span>{t.sub ? <span style={{ color:'var(--muted)', marginLeft:8 }}>{t.sub}</span> : null}
      </div>
    ))}</>
  );
  return [push, node];
}

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Taldorian TCCG — Criação de Personagem</title>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;500;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet"/>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold:        oklch(0.76 0.115 78);
    --gold-dim:    oklch(0.56 0.085 76);
    --gold-glow:   oklch(0.85 0.14 82);
    --gold-deep:   oklch(0.48 0.075 70);
    --crimson:        oklch(0.46 0.17 22);
    --crimson-bright: oklch(0.56 0.20 24);
    --crimson-deep:   oklch(0.30 0.12 22);
    --parchment:     oklch(0.92 0.022 80);
    --parchment-dim: oklch(0.72 0.026 78);
    --ink-faint:     oklch(0.55 0.02 70);
    --panel-bg:    oklch(0.12 0.026 58 / 0.92);
    --line:        oklch(0.76 0.115 78 / 0.30);
    --line-soft:   oklch(0.76 0.115 78 / 0.14);
    --field-bg:    oklch(0.09 0.022 50 / 0.78);
  }

  html, body { width:100%; height:100%; overflow:hidden; background:#07060a; }
  body {
    font-family:'Crimson Pro', serif;
    color:var(--parchment);
    display:flex; align-items:center; justify-content:center;
  }
  img, canvas { image-rendering:pixelated; image-rendering:crisp-edges; }

  /* ── Scaler ─────────────────────────────────────────────── */
  #stage {
    position:relative;
    width:1280px; height:720px;
    transform-origin:center center;
  }

  /* ── Screen ─────────────────────────────────────────────── */
  .cc {
    position:relative;
    width:1280px; height:720px;
    overflow:hidden;
    background:#0c0a10;
  }

  /* ── Scenery (changeable) ───────────────────────────────── */
  .scene { position:absolute; inset:0; z-index:0; }
  .scene image-slot { position:absolute; inset:0; width:100%; height:100%; }
  .scene-default {
    position:absolute; inset:0;
    background:
      radial-gradient(ellipse 80% 60% at 70% 18%, oklch(0.46 0.09 250 / 0.55) 0%, transparent 55%),
      radial-gradient(ellipse 70% 50% at 22% 30%, oklch(0.42 0.07 280 / 0.40) 0%, transparent 55%),
      linear-gradient(180deg, oklch(0.30 0.06 255) 0%, oklch(0.20 0.05 250) 42%, oklch(0.16 0.05 200) 70%, oklch(0.18 0.06 150) 100%);
  }
  /* atmospheric layers over the scene so the dark UI reads */
  .scene-vignette {
    position:absolute; inset:0; z-index:1; pointer-events:none;
    background:
      linear-gradient(90deg, oklch(0.05 0.02 40 / 0.55) 0%, transparent 30%, transparent 52%, oklch(0.05 0.02 40 / 0.78) 100%),
      linear-gradient(0deg, oklch(0.05 0.02 40 / 0.85) 0%, transparent 42%),
      radial-gradient(ellipse 90% 80% at 50% 40%, transparent 40%, oklch(0.04 0.02 30 / 0.5) 100%);
  }
  .scene-grain {
    position:absolute; inset:0; z-index:1; pointer-events:none; opacity:0.05;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size:180px;
  }

  /* ── Change scenery button ──────────────────────────────── */
  .scenery-btn {
    position:absolute; top:22px; left:22px; z-index:8;
    display:flex; align-items:center; gap:10px;
    padding:9px 16px;
    background:oklch(0.10 0.025 50 / 0.72);
    border:1px solid var(--line);
    color:var(--parchment-dim);
    font-family:'Cinzel', serif; font-weight:600;
    font-size:0.66rem; letter-spacing:0.22em; text-transform:uppercase;
    cursor:pointer; backdrop-filter:blur(6px);
    transition:color 0.2s, border-color 0.2s, background 0.2s;
  }
  .scenery-btn:hover { color:var(--gold); border-color:var(--gold-dim); background:oklch(0.14 0.03 55 / 0.82); }
  .scenery-btn .glyph { color:var(--gold); font-size:0.95rem; line-height:1; }

  /* ── Character preview (left) ───────────────────────────── */
  .preview {
    position:absolute; z-index:4;
    left:0; bottom:0; top:0;
    width:560px;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
    padding-bottom:70px;
    pointer-events:none;
  }
  .preview-glow {
    position:absolute; bottom:78px; left:50%; transform:translateX(-50%);
    width:340px; height:340px;
    background:radial-gradient(circle, oklch(0.76 0.115 78 / 0.18) 0%, transparent 65%);
    pointer-events:none;
  }
  .hero-sprite {
    width:64px; height:64px;
    background-image:url('elf_walk.png');
    background-repeat:no-repeat;
    background-position:0 -128px; /* row 2 = front, frame 0 = idle */
    transform:scale(5);
    transform-origin:bottom center;
    margin-bottom:32px;
    filter:drop-shadow(0 10px 14px oklch(0.04 0.02 30 / 0.7));
    animation:heroBob 3.4s ease-in-out infinite;
  }
  @keyframes heroBob {
    0%,100% { transform:scale(5) translateY(0); }
    50%     { transform:scale(5) translateY(-1.4px); }
  }
  .pedestal {
    position:relative;
    width:230px; height:30px;
    display:flex; align-items:center; justify-content:center;
  }
  .pedestal-disc {
    position:absolute; inset:0;
    background:
      radial-gradient(ellipse 75% 120% at 50% 0%, oklch(0.30 0.06 60 / 0.9) 0%, oklch(0.14 0.03 50 / 0.7) 55%, transparent 75%);
    border-top:1px solid oklch(0.76 0.115 78 / 0.45);
  }
  .pedestal-rune {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:200px; height:14px;
    border:1px solid oklch(0.76 0.115 78 / 0.30);
    border-radius:50%;
  }
  /* turn arrows (visual only) */
  .turn {
    position:absolute; bottom:74px; z-index:6;
    pointer-events:auto;
    width:38px; height:54px;
    display:flex; align-items:center; justify-content:center;
    background:oklch(0.10 0.025 50 / 0.6);
    border:1px solid var(--line-soft);
    color:var(--gold-dim);
    font-size:1.3rem; cursor:pointer;
    transition:color 0.2s, border-color 0.2s, background 0.2s;
  }
  .turn:hover { color:var(--gold); border-color:var(--gold-dim); background:oklch(0.14 0.03 55 / 0.7); }
  .turn.left  { left:120px; }
  .turn.right { left:402px; }

  .nameplate {
    position:absolute; bottom:28px; z-index:6;
    text-align:center;
    display:flex; flex-direction:column; gap:3px; align-items:center;
  }
  .nameplate .np-name {
    font-family:'Cinzel Decorative', cursive; font-weight:700;
    font-size:1.35rem; color:var(--parchment);
    text-shadow:0 2px 14px oklch(0.04 0.02 30 / 0.9); letter-spacing:0.03em;
  }
  .nameplate .np-sub {
    font-family:'Cinzel', serif; font-weight:600;
    font-size:0.56rem; letter-spacing:0.42em; text-transform:uppercase;
    color:var(--gold-dim);
  }

  /* ── Panel (right) ──────────────────────────────────────── */
  .panel {
    position:absolute; z-index:5;
    right:46px; top:50%; transform:translateY(-50%);
    width:452px;
    max-height:calc(100% - 44px);
    background:var(--panel-bg);
    border:1px solid var(--line);
    box-shadow:
      inset 0 1px 0 oklch(0.85 0.14 82 / 0.12),
      inset 0 0 60px oklch(0.05 0.02 40 / 0.6),
      0 30px 70px oklch(0.02 0.01 30 / 0.7);
    backdrop-filter:blur(10px);
    display:flex; flex-direction:column;
    padding:26px 30px 24px;
    gap:16px;
  }
  .corner { position:absolute; width:18px; height:18px; border-color:var(--gold); border-style:solid; opacity:0.65; pointer-events:none; }
  .corner.tl { top:6px; left:6px; border-width:2px 0 0 2px; }
  .corner.tr { top:6px; right:6px; border-width:2px 2px 0 0; }
  .corner.bl { bottom:6px; left:6px; border-width:0 0 2px 2px; }
  .corner.br { bottom:6px; right:6px; border-width:0 2px 2px 0; }

  .panel-head { display:flex; flex-direction:column; gap:5px; text-align:center; padding-bottom:6px; }
  .eyebrow {
    display:flex; align-items:center; justify-content:center; gap:12px;
    font-family:'Cinzel', serif; font-weight:600;
    font-size:0.56rem; letter-spacing:0.46em; text-transform:uppercase;
    color:var(--gold-dim);
  }
  .eyebrow .rule { width:34px; height:1px; background:var(--gold-dim); opacity:0.5; }
  .title {
    font-family:'Cinzel Decorative', cursive; font-weight:700;
    font-size:1.6rem; letter-spacing:0.04em;
    background:linear-gradient(165deg, var(--gold-glow) 0%, var(--gold) 48%, var(--gold-deep) 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 16px oklch(0.76 0.115 78 / 0.25));
  }

  .field-label {
    display:block;
    font-family:'Cinzel', serif; font-weight:600;
    font-size:0.6rem; letter-spacing:0.3em; text-transform:uppercase;
    color:var(--gold-dim); margin-bottom:7px;
  }

  /* Name */
  .name-wrap {
    display:flex; align-items:center;
    height:46px;
    background:var(--field-bg);
    border:1px solid var(--line);
    transition:border-color 0.2s, box-shadow 0.2s;
  }
  .name-wrap:focus-within { border-color:var(--gold-dim); box-shadow:0 0 0 2px oklch(0.76 0.115 78 / 0.12); }
  .name-orn { padding:0 13px; font-family:'Cinzel Decorative', cursive; color:var(--gold); font-size:1rem; opacity:0.7; }
  .name-input {
    flex:1; height:100%;
    background:transparent; border:none; outline:none;
    font-family:'Cinzel', serif; font-size:0.95rem; letter-spacing:0.06em;
    color:var(--parchment);
  }
  .name-input::placeholder { color:var(--parchment-dim); opacity:0.4; font-style:italic; font-family:'Crimson Pro', serif; letter-spacing:0; }
  .name-dice {
    width:44px; height:100%;
    background:transparent; border:none; border-left:1px solid var(--line-soft);
    color:var(--gold-dim); font-size:1.1rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:color 0.2s, background 0.2s;
  }
  .name-dice:hover { color:var(--gold-glow); background:oklch(0.76 0.115 78 / 0.08); }

  /* Sex segmented toggle */
  .sex-toggle { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .sex-btn {
    display:flex; align-items:center; justify-content:center; gap:9px;
    height:44px;
    background:var(--field-bg);
    border:1px solid var(--line);
    color:var(--parchment-dim);
    font-family:'Cinzel', serif; font-weight:600;
    font-size:0.72rem; letter-spacing:0.16em; text-transform:uppercase;
    cursor:pointer;
    transition:all 0.18s;
  }
  .sex-btn .sx { font-size:1.05rem; line-height:1; }
  .sex-btn:hover { border-color:var(--gold-dim); color:var(--parchment); }
  .sex-btn.sel {
    border-color:var(--gold);
    background:linear-gradient(160deg, oklch(0.76 0.115 78 / 0.18) 0%, oklch(0.48 0.075 70 / 0.10) 100%);
    color:var(--gold);
    box-shadow:inset 0 0 0 1px oklch(0.76 0.115 78 / 0.4);
  }

  /* Selector rows */
  .selectors { display:flex; flex-direction:column; gap:11px; }
  .sel-row { display:grid; grid-template-columns:78px 1fr; align-items:center; gap:14px; }
  .sel-row > .sel-label { margin-bottom:0; text-align:left; }
  .sel-control {
    display:flex; align-items:center; justify-content:space-between;
    height:42px;
    background:var(--field-bg);
    border:1px solid var(--line);
    transition:border-color 0.2s;
  }
  .sel-control:hover { border-color:var(--gold-dim); }
  .sel-arrow {
    width:42px; height:100%;
    background:transparent; border:none;
    color:var(--gold-dim); font-size:1.2rem; line-height:1;
    cursor:pointer; flex:none;
    display:flex; align-items:center; justify-content:center;
    transition:color 0.18s, background 0.18s;
  }
  .sel-arrow:hover { color:var(--gold-glow); background:oklch(0.76 0.115 78 / 0.10); }
  .sel-value {
    flex:1; text-align:center;
    font-family:'Cinzel', serif; font-weight:500;
    font-size:0.82rem; letter-spacing:0.06em;
    color:var(--parchment); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    padding:0 4px;
  }

  /* Footer */
  .panel-foot { display:grid; grid-template-columns:1.4fr 1fr; gap:12px; margin-top:4px; padding-top:16px; border-top:1px solid var(--line-soft); }
  .btn {
    position:relative; overflow:hidden;
    height:50px;
    font-family:'Cinzel', serif; font-weight:700;
    font-size:0.82rem; letter-spacing:0.22em; text-transform:uppercase;
    border:1px solid transparent; cursor:pointer; outline:none;
    display:flex; align-items:center; justify-content:center; gap:9px;
    transition:transform 0.16s, box-shadow 0.25s, filter 0.25s, border-color 0.25s;
  }
  .btn .glyph { font-size:0.95em; }
  .btn .sweep {
    position:absolute; top:0; left:-120%; width:55%; height:100%;
    background:linear-gradient(105deg, transparent, oklch(1 0 0 / 0.16), transparent);
    transform:skewX(-20deg); transition:left 0.55s;
  }
  .btn:hover .sweep { left:160%; }
  .btn-create {
    background:linear-gradient(165deg, oklch(0.42 0.16 24) 0%, oklch(0.28 0.12 22) 100%);
    color:oklch(0.95 0.04 30);
    border-color:oklch(0.56 0.20 24 / 0.75);
    box-shadow:inset 0 1px 0 oklch(0.7 0.18 26 / 0.3), 0 6px 24px oklch(0.4 0.16 22 / 0.32);
    text-shadow:0 1px 6px oklch(0.2 0.08 20 / 0.7);
  }
  .btn-create:hover { transform:translateY(-2px); filter:brightness(1.1); border-color:var(--crimson-bright); box-shadow:inset 0 1px 0 oklch(0.7 0.18 26 / 0.4), 0 10px 32px oklch(0.4 0.16 22 / 0.5); }
  .btn-back {
    background:transparent;
    color:var(--parchment-dim);
    border-color:var(--line);
  }
  .btn-back:hover { color:var(--gold); border-color:var(--gold-dim); background:oklch(0.76 0.115 78 / 0.05); }
</style>
</head>
<body>

<div id="stage">
  <div class="cc" data-screen-label="Criação de Personagem">

    <!-- Scenery (player-changeable) -->
    <div class="scene">
      <div class="scene-default"></div>
      <image-slot id="cc-scenery" fit="cover" placeholder="cenário — solte uma arte de fundo"></image-slot>
    </div>
    <div class="scene-grain"></div>
    <div class="scene-vignette"></div>

    <!-- Change scenery -->
    <button class="scenery-btn"><span class="glyph">&#10070;</span> Trocar Cenário</button>

    <!-- Character preview -->
    <div class="preview">
      <div class="preview-glow"></div>
      <div class="hero-sprite"></div>
      <div class="pedestal">
        <div class="pedestal-disc"></div>
        <div class="pedestal-rune"></div>
      </div>
    </div>
    <button class="turn left" title="Girar">&#8249;</button>
    <button class="turn right" title="Girar">&#8250;</button>
    <div class="nameplate" style="left:0; width:560px;">
      <div class="np-name">Joran</div>
      <div class="np-sub">Humano &middot; Guerreiro</div>
    </div>

    <!-- Panel -->
    <div class="panel">
      <div class="corner tl"></div><div class="corner tr"></div>
      <div class="corner bl"></div><div class="corner br"></div>

      <div class="panel-head">
        <div class="eyebrow"><span class="rule"></span> Criação de Personagem <span class="rule"></span></div>
        <div class="title">Forje seu Herói</div>
      </div>

      <!-- Name -->
      <div class="field">
        <label class="field-label">Nome</label>
        <div class="name-wrap">
          <span class="name-orn">&#10070;</span>
          <input class="name-input" type="text" value="Joran" placeholder="Dê um nome ao herói"/>
          <button class="name-dice" title="Nome aleatório">&#9860;</button>
        </div>
      </div>

      <!-- Sex -->
      <div class="field">
        <label class="field-label">Sexo</label>
        <div class="sex-toggle">
          <button class="sex-btn sel"><span class="sx">&#9794;</span> Masculino</button>
          <button class="sex-btn"><span class="sx">&#9792;</span> Feminino</button>
        </div>
      </div>

      <!-- Selectors -->
      <div class="selectors">
        <div class="sel-row">
          <span class="sel-label">Raça</span>
          <div class="sel-control">
            <button class="sel-arrow" title="Anterior">&#8249;</button>
            <span class="sel-value">Humano</span>
            <button class="sel-arrow" title="Próximo">&#8250;</button>
          </div>
        </div>
        <div class="sel-row">
          <span class="sel-label">Cabelo</span>
          <div class="sel-control">
            <button class="sel-arrow" title="Anterior">&#8249;</button>
            <span class="sel-value">Trança Guerreira</span>
            <button class="sel-arrow" title="Próximo">&#8250;</button>
          </div>
        </div>
        <div class="sel-row">
          <span class="sel-label">Barba</span>
          <div class="sel-control">
            <button class="sel-arrow" title="Anterior">&#8249;</button>
            <span class="sel-value">Cavanhaque</span>
            <button class="sel-arrow" title="Próximo">&#8250;</button>
          </div>
        </div>
        <div class="sel-row">
          <span class="sel-label">Camisa</span>
          <div class="sel-control">
            <button class="sel-arrow" title="Anterior">&#8249;</button>
            <span class="sel-value">Túnica de Linho</span>
            <button class="sel-arrow" title="Próximo">&#8250;</button>
          </div>
        </div>
        <div class="sel-row">
          <span class="sel-label">Calça</span>
          <div class="sel-control">
            <button class="sel-arrow" title="Anterior">&#8249;</button>
            <span class="sel-value">Bombacha de Couro</span>
            <button class="sel-arrow" title="Próximo">&#8250;</button>
          </div>
        </div>
        <div class="sel-row">
          <span class="sel-label">Tênis</span>
          <div class="sel-control">
            <button class="sel-arrow" title="Anterior">&#8249;</button>
            <span class="sel-value">Botas de Viajante</span>
            <button class="sel-arrow" title="Próximo">&#8250;</button>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="panel-foot">
        <button class="btn btn-create"><span class="sweep"></span><span class="glyph">&#9876;</span> Criar</button>
        <button class="btn btn-back"><span class="glyph">&#8592;</span> Voltar</button>
      </div>
    </div>

  </div>
</div>

<script src="image-slot.js"></script>
<script>
  // Fit-to-viewport scaler
  (function scaler(){
    const stage = document.getElementById('stage');
    function fit(){
      const s = Math.min((window.innerWidth - 32) / 1280, (window.innerHeight - 32) / 720);
      stage.style.transform = `scale(${s})`;
    }
    window.addEventListener('resize', fit); fit();
  })();
</script>
</body>
</html>

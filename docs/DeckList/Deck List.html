<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Taldorian TCG — Meus Decks</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;500;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet"/>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --gold:       oklch(0.73 0.13 78);
  --gold-dim:   oklch(0.55 0.10 78);
  --gold-glow:  oklch(0.82 0.16 80);
  --gold-soft:  oklch(0.73 0.13 78 / 0.25);
  --crimson:    oklch(0.42 0.20 15);
  --crimson-br: oklch(0.55 0.22 15);
  --green:      oklch(0.55 0.18 145);
  --green-dim:  oklch(0.45 0.10 145);
  --parchment:  oklch(0.91 0.025 78);
  --parchment-d:oklch(0.72 0.03 78);
  --bg-deep:    oklch(0.07 0.055 268);
  --bg-mid:     oklch(0.10 0.04 268);
  --bg-surface: oklch(0.13 0.035 268);
  --panel-bg:   oklch(0.10 0.04 268 / 0.92);
  --border:     oklch(0.73 0.13 78 / 0.18);
  --border-strong: oklch(0.73 0.13 78 / 0.35);
}

html, body {
  width:100%; height:100%; overflow:hidden;
  background: var(--bg-deep);
  font-family:'Crimson Pro', Georgia, serif;
  color: var(--parchment);
}

body::before {
  content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(ellipse 90% 60% at 50% 105%, oklch(0.22 0.10 15 / 0.18) 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 15% 0%,   oklch(0.26 0.10 262 / 0.20) 0%, transparent 55%),
    radial-gradient(ellipse 45% 40% at 92% 5%,   oklch(0.22 0.08 280 / 0.18) 0%, transparent 50%),
    linear-gradient(175deg, oklch(0.10 0.06 270) 0%, oklch(0.07 0.05 260) 50%, oklch(0.06 0.04 14) 100%);
}
body::after {
  content:''; position:fixed; inset:0; z-index:1; pointer-events:none;
  background: radial-gradient(ellipse 130% 55% at 50% 105%, oklch(0.15 0.05 268 / 0.45) 0%, transparent 65%);
}

#root { position:relative; z-index:10; width:100vw; height:100vh; display:flex; flex-direction:column; }

button { font-family:inherit; color:inherit; background:none; border:none; cursor:pointer; outline:none; }

.screen { display:flex; flex-direction:column; width:100%; height:100%; min-height:0; }

/* ─────────────────────────── TOP HEADER ─────────────────────────── */
.top-header {
  display:flex; align-items:center; justify-content:space-between;
  padding: 12px 26px;
  background: oklch(0.08 0.04 268 / 0.78);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(14px);
  flex-shrink:0; height: 66px; gap: 18px;
  position:relative; z-index:30;
}
.header-left, .header-right { display:flex; align-items:center; gap: 16px; }

.back-btn {
  display:flex; align-items:center; gap:7px;
  font-family:'Cinzel', serif; font-size: 0.7rem;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--gold-dim); text-decoration:none;
  padding: 7px 12px; border: 1px solid transparent;
  transition: color .2s, border-color .2s, background .2s;
}
.back-btn:hover { color: var(--gold); border-color: var(--gold-soft); background: oklch(0.10 0.04 268 / 0.5); }

.header-sep { width:1px; height:30px; background: var(--border); }

.header-eyebrow .eyebrow-line {
  font-family:'Cinzel', serif; font-size:0.6rem; letter-spacing:0.35em;
  text-transform:uppercase; color: var(--gold-dim); opacity:0.7;
}
.header-eyebrow .eyebrow-title {
  font-family:'Cinzel Decorative', cursive; font-size:1.15rem; font-weight:700;
  background: linear-gradient(160deg, var(--gold-glow) 0%, var(--gold) 70%);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
}

.deck-tally {
  font-family:'Cinzel', serif; font-size: 0.68rem; letter-spacing: 0.2em;
  text-transform: uppercase; color: var(--parchment-d); opacity: 0.7;
}
.deck-tally strong { color: var(--gold); font-weight: 700; }

.header-btn {
  display:flex; align-items:center; gap: 8px;
  font-family:'Cinzel', serif; font-weight: 600; font-size: 0.74rem;
  letter-spacing: 0.18em; text-transform: uppercase;
  padding: 10px 18px; border: 1px solid var(--border);
  background: oklch(0.10 0.04 268 / 0.6); color: var(--parchment-d);
  transition: all .18s;
}
.header-btn:hover { border-color: var(--gold-soft); color: var(--parchment); }
.header-btn.primary {
  background: linear-gradient(155deg, oklch(0.32 0.10 78) 0%, oklch(0.22 0.08 78) 100%);
  color: oklch(0.94 0.10 80); border-color: oklch(0.73 0.13 78 / 0.55);
  box-shadow: 0 4px 18px oklch(0.73 0.13 78 / 0.12), inset 0 1px 0 oklch(0.73 0.13 78 / 0.18);
}
.header-btn.primary:hover {
  filter: brightness(1.12); border-color: var(--gold);
  box-shadow: 0 6px 24px oklch(0.73 0.13 78 / 0.22), inset 0 1px 0 oklch(0.73 0.13 78 / 0.25);
}

/* ─────────────────────────── BODY / GALLERY ─────────────────────────── */
.list-body {
  flex:1; min-height:0; overflow-y:auto;
  padding: 30px 36px 130px;
  scrollbar-width: thin; scrollbar-color: var(--gold-soft) transparent;
}
.list-body::-webkit-scrollbar { width: 10px; }
.list-body::-webkit-scrollbar-track { background: transparent; }
.list-body::-webkit-scrollbar-thumb { background: oklch(0.20 0.06 78 / 0.4); }
.list-body::-webkit-scrollbar-thumb:hover { background: var(--gold-soft); }

.gallery-head {
  display:flex; align-items: baseline; gap: 14px;
  margin-bottom: 22px; max-width: 1500px; margin-left:auto; margin-right:auto;
}
.gallery-head .gh-title {
  font-family:'Cinzel', serif; font-size: 0.72rem; letter-spacing: 0.32em;
  text-transform: uppercase; color: var(--gold-dim);
}
.gallery-head .gh-hint {
  font-family:'Crimson Pro', serif; font-style: italic; font-size: 0.85rem;
  color: var(--parchment-d); opacity: 0.5; margin-left:auto;
}

.deck-gallery {
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
  gap: 22px;
  max-width: 1500px; margin: 0 auto;
}

/* ─────────────────────────── DECK PLATE ─────────────────────────── */
.deck-plate {
  position:relative;
  background: linear-gradient(170deg, oklch(0.13 0.035 268) 0%, oklch(0.09 0.04 268) 100%);
  border: 1px solid var(--border);
  cursor: pointer;
  overflow: hidden;
  transition: transform .2s, border-color .2s, box-shadow .2s;
  display:flex; flex-direction:column;
}
.deck-plate:hover {
  transform: translateY(-4px);
  border-color: var(--gold-soft);
  box-shadow: 0 14px 34px oklch(0.04 0.04 268 / 0.6);
}
.deck-plate.selected {
  border-color: var(--gold);
  box-shadow: 0 14px 40px oklch(0.04 0.04 268 / 0.7), 0 0 0 1px var(--gold-soft), inset 0 0 32px oklch(0.73 0.13 78 / 0.06);
}
/* selection corner ticks */
.deck-plate.selected::before, .deck-plate.selected::after {
  content:''; position:absolute; width: 14px; height: 14px; z-index: 14;
  border-color: var(--gold); border-style: solid; pointer-events:none;
}
.deck-plate.selected::before { top:-1px; left:-1px; border-width: 2px 0 0 2px; }
.deck-plate.selected::after  { top:-1px; right:-1px; border-width: 2px 2px 0 0; }
.plate-tick-bl, .plate-tick-br {
  position:absolute; width:14px; height:14px; z-index:14;
  border-color: var(--gold); border-style: solid; pointer-events:none;
  opacity:0; transition: opacity .2s;
}
.deck-plate.selected .plate-tick-bl, .deck-plate.selected .plate-tick-br { opacity:1; }
.plate-tick-bl { bottom:-1px; left:-1px; border-width: 0 0 2px 2px; }
.plate-tick-br { bottom:-1px; right:-1px; border-width: 0 2px 2px 0; }

/* showcase: playmat backdrop + sleeve stack */
.plate-showcase {
  position:relative; height: 188px;
  display:flex; align-items:center; justify-content:center;
  border-bottom: 1px solid var(--border);
  overflow:hidden;
}
.plate-showcase::after {
  content:''; position:absolute; inset:0;
  background: radial-gradient(ellipse 80% 70% at 50% 120%, oklch(0.02 0.02 268 / 0.55), transparent 70%),
              linear-gradient(180deg, oklch(0.05 0.03 268 / 0.25) 0%, transparent 30%, oklch(0.05 0.03 268 / 0.4) 100%);
  pointer-events:none;
}
.playmat-name {
  position:absolute; top:10px; left:10px; z-index:6;
  display:flex; align-items:center; gap:7px;
  font-family:'Cinzel', serif; font-size:0.56rem; letter-spacing:0.18em;
  text-transform:uppercase; color: var(--parchment);
  background: oklch(0.06 0.03 268 / 0.6); border:1px solid oklch(1 0 0 / 0.12);
  padding: 4px 9px 4px 6px; backdrop-filter: blur(3px);
}
.playmat-name .pm-swatch {
  width:14px; height:14px; border:1px solid oklch(1 0 0 / 0.25); flex-shrink:0;
}

.plate-status {
  position:absolute; top:10px; right:10px; z-index:6;
  font-family:'Cinzel', serif; font-size:0.55rem; font-weight:600;
  letter-spacing:0.2em; text-transform:uppercase; padding: 4px 9px;
  backdrop-filter: blur(3px);
}
.plate-status.ready {
  color: var(--green); background: oklch(0.15 0.06 145 / 0.6);
  border:1px solid oklch(0.55 0.18 145 / 0.5);
}
.plate-status.draft {
  color: oklch(0.82 0.14 65); background: oklch(0.14 0.06 65 / 0.55);
  border:1px solid oklch(0.6 0.14 65 / 0.4);
}

/* sleeve stack — fanned card backs */
.sleeve-stack {
  position:relative; z-index:4;
  width: 108px; height: 158px;
  filter: drop-shadow(0 10px 18px oklch(0.02 0.02 268 / 0.6));
}
.sleeve-card {
  position:absolute; inset:0; border-radius: 6px; overflow:hidden;
  border: 1px solid oklch(0.78 0.1 78 / 0.35);
  background-image: var(--sleeve-art);
  background-size: cover; background-position:center;
}
.sleeve-card .sleeve-tint {
  position:absolute; inset:0; mix-blend-mode: color;
}
.sleeve-card .sleeve-sheen {
  position:absolute; inset:0;
  background: linear-gradient(125deg, oklch(1 0 0 / 0.18) 0%, transparent 32%, transparent 70%, oklch(0 0 0 / 0.25) 100%);
}
.sleeve-card.back2 { transform: translate(-13px, 7px) rotate(-7deg); z-index:1; opacity:0.78; }
.sleeve-card.back1 { transform: translate(13px, 7px) rotate(7deg);  z-index:2; opacity:0.78; }
.sleeve-card.front { z-index:3; }
.deck-plate:hover .sleeve-card.back2 { transform: translate(-20px, 6px) rotate(-11deg); }
.deck-plate:hover .sleeve-card.back1 { transform: translate(20px, 6px) rotate(11deg); }
.sleeve-card { transition: transform .25s ease; }

/* body */
.plate-body { padding: 15px 18px 12px; flex:1; display:flex; flex-direction:column; }
.plate-name {
  font-family:'Cinzel Decorative', cursive; font-weight:700; font-size: 1.15rem;
  color: var(--gold-glow); letter-spacing: 0.02em; line-height:1.15;
  margin-bottom: 11px;
}
.plate-name.unnamed { color: var(--parchment-d); font-style: italic; opacity: 0.7; font-family:'Crimson Pro', serif; }

.plate-heroes { display:flex; align-items:center; gap: 7px; margin-bottom: 13px; }
.hero-chip {
  width: 34px; height: 34px;
  display:flex; align-items:center; justify-content:center;
  border: 1px solid var(--border);
  background: linear-gradient(165deg, var(--chip-bg, oklch(0.2 0.05 268 / 0.5)), oklch(0.12 0.04 268));
}
.hero-chip.empty {
  border-style: dashed; border-color: oklch(0.73 0.13 78 / 0.18);
  color: var(--gold-dim); opacity:0.4; font-size: 1rem;
}

.plate-counts { display:flex; gap: 16px; margin-top:auto; }
.count-stat {
  display:flex; align-items:baseline; gap: 5px;
  font-family:'Cinzel', serif;
}
.count-stat .cs-num { font-size: 0.95rem; font-weight: 700; color: var(--parchment); }
.count-stat .cs-num.full { color: var(--green); }
.count-stat .cs-lbl { font-size: 0.56rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--parchment-d); opacity: 0.6; }

/* meta footer */
.plate-meta {
  border-top: 1px solid var(--border);
  padding: 11px 18px 13px;
  display:flex; flex-direction:column; gap: 7px;
  background: oklch(0.07 0.035 268 / 0.5);
}
.meta-row {
  display:flex; align-items:center; gap: 9px;
  font-family:'Cinzel', serif; font-size: 0.62rem; letter-spacing: 0.08em;
}
.meta-row .meta-k {
  font-size: 0.52rem; letter-spacing: 0.24em; text-transform: uppercase;
  color: var(--gold-dim); opacity: 0.75; width: 56px; flex-shrink:0;
}
.meta-row .meta-v { color: var(--parchment-d); }
.meta-swatch { width: 13px; height: 13px; border: 1px solid oklch(1 0 0 / 0.2); flex-shrink:0; }
.meta-swatch.round { border-radius: 50%; }

/* per-card quick actions on hover (mirror selection) */
.plate-quick {
  position:absolute; inset:auto 0 0 0; z-index: 12;
  display:flex; opacity:0; transform: translateY(100%);
  transition: opacity .18s, transform .18s;
  pointer-events:none;
}
.deck-plate:hover .plate-quick, .deck-plate.selected .plate-quick {
  opacity:1; transform: translateY(0); pointer-events:auto;
}
.quick-btn {
  flex:1; padding: 11px 0;
  font-family:'Cinzel', serif; font-size: 0.64rem; font-weight:600;
  letter-spacing: 0.18em; text-transform: uppercase;
  display:flex; align-items:center; justify-content:center; gap:6px;
  backdrop-filter: blur(8px);
  transition: background .15s, color .15s;
}
.quick-btn.edit {
  background: oklch(0.16 0.07 78 / 0.92); color: var(--gold-glow);
  border-top: 1px solid var(--gold-soft);
}
.quick-btn.edit:hover { background: oklch(0.22 0.09 78 / 0.95); }
.quick-btn.del {
  background: oklch(0.14 0.06 15 / 0.92); color: oklch(0.82 0.12 18);
  border-top: 1px solid oklch(0.55 0.22 15 / 0.4); border-left: 1px solid oklch(0 0 0 / 0.3);
  flex: 0 0 52px;
}
.quick-btn.del:hover { background: oklch(0.24 0.12 15 / 0.95); color: oklch(0.9 0.12 18); }

/* ─────────────────────────── NEW DECK TILE ─────────────────────────── */
.deck-plate.new {
  border: 1px dashed var(--border-strong);
  background: oklch(0.09 0.04 268 / 0.4);
  align-items:center; justify-content:center;
  min-height: 100%;
}
.deck-plate.new:hover {
  border-color: var(--gold); background: oklch(0.12 0.05 268 / 0.5);
  box-shadow: 0 14px 34px oklch(0.04 0.04 268 / 0.5);
}
.new-inner { display:flex; flex-direction:column; align-items:center; gap: 14px; padding: 40px; }
.new-mark {
  width: 64px; height: 64px; border-radius:50%;
  border: 1.5px solid var(--gold-soft);
  display:flex; align-items:center; justify-content:center;
  font-size: 2rem; font-weight: 300; color: var(--gold);
  transition: border-color .2s, color .2s, transform .2s;
}
.deck-plate.new:hover .new-mark { border-color: var(--gold); color: var(--gold-glow); transform: rotate(90deg); }
.new-label {
  font-family:'Cinzel', serif; font-size: 0.78rem; font-weight:600;
  letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold-dim);
}
.deck-plate.new:hover .new-label { color: var(--gold); }
.new-sub {
  font-family:'Crimson Pro', serif; font-style:italic; font-size:0.82rem;
  color: var(--parchment-d); opacity:0.55; text-align:center;
}

/* ─────────────────────────── ACTION BAR ─────────────────────────── */
.action-bar {
  position:absolute; left:0; right:0; bottom:0; z-index:40;
  display:flex; align-items:center; gap: 18px;
  padding: 16px 30px;
  background: oklch(0.07 0.035 268 / 0.92);
  border-top: 1px solid var(--border-strong);
  backdrop-filter: blur(16px);
  box-shadow: 0 -10px 40px oklch(0.03 0.03 268 / 0.5);
  transform: translateY(100%); transition: transform .28s cubic-bezier(.22,1,.36,1);
}
.action-bar.show { transform: translateY(0); }
.ab-info { display:flex; align-items:center; gap: 14px; min-width:0; }
.ab-sleeve {
  width: 30px; height: 42px; border-radius:4px; flex-shrink:0;
  background-image: var(--sleeve-art); background-size:cover; background-position:center;
  border:1px solid oklch(0.78 0.1 78 / 0.35); position:relative; overflow:hidden;
}
.ab-sleeve .sleeve-tint { position:absolute; inset:0; mix-blend-mode: color; }
.ab-text { min-width:0; }
.ab-label { font-family:'Cinzel', serif; font-size:0.55rem; letter-spacing:0.26em; text-transform:uppercase; color: var(--gold-dim); opacity:0.8; }
.ab-name {
  font-family:'Cinzel Decorative', cursive; font-weight:700; font-size:1.05rem;
  color: var(--gold-glow); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.ab-spacer { flex:1; }
.ab-actions { display:flex; gap: 12px; }
.action-bar .header-btn { padding: 11px 22px; font-size: 0.76rem; }
.header-btn.danger {
  color: oklch(0.78 0.10 18); border-color: oklch(0.55 0.22 15 / 0.30);
  background: oklch(0.10 0.04 268 / 0.6);
}
.header-btn.danger:hover {
  border-color: oklch(0.55 0.22 15 / 0.65); color: oklch(0.85 0.12 18);
  background: oklch(0.18 0.10 15 / 0.4);
}
.header-btn.danger.filled {
  background: linear-gradient(155deg, oklch(0.30 0.16 15) 0%, oklch(0.20 0.12 10) 100%);
  color: oklch(0.95 0.06 18); border-color: oklch(0.55 0.22 15 / 0.7);
}
.ab-edit {
  background: linear-gradient(155deg, oklch(0.34 0.11 78) 0%, oklch(0.24 0.09 78) 100%);
  color: oklch(0.96 0.10 80); border-color: oklch(0.73 0.13 78 / 0.6) !important;
  box-shadow: 0 4px 18px oklch(0.73 0.13 78 / 0.18), inset 0 1px 0 oklch(0.73 0.13 78 / 0.2);
}
.ab-edit:hover { filter:brightness(1.12); border-color: var(--gold) !important; }

/* ─────────────────────────── MODAL & TOAST ─────────────────────────── */
.modal-veil {
  position: fixed; inset: 0; background: oklch(0.05 0.04 268 / 0.75);
  backdrop-filter: blur(6px); z-index: 1000;
  display:flex; align-items:center; justify-content:center; animation: veilIn .2s ease-out;
}
@keyframes veilIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  width: 440px; background: var(--bg-mid); border: 1px solid var(--border-strong);
  padding: 24px 28px; position:relative;
  box-shadow: 0 24px 60px oklch(0.05 0.04 268 / 0.7), inset 0 1px 0 oklch(0.73 0.13 78 / 0.12);
  animation: modalIn .25s cubic-bezier(.22,1,.36,1);
}
@keyframes modalIn { from { opacity:0; transform: translateY(-12px) scale(.97);} to {opacity:1; transform: translateY(0) scale(1);} }
.modal::before, .modal::after {
  content:''; position:absolute; width: 12px; height: 12px;
  border-color: var(--gold); border-style: solid; opacity: 0.55;
}
.modal::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
.modal::after  { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
.modal-title {
  font-family:'Cinzel Decorative', cursive; font-size: 1.2rem; font-weight: 700;
  background: linear-gradient(160deg, var(--gold-glow), var(--gold));
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  margin-bottom: 12px;
}
.modal-body { font-family:'Crimson Pro', serif; font-size: 0.95rem; color: var(--parchment-d); line-height: 1.5; margin-bottom: 22px; }
.modal-body strong { color: var(--parchment); font-weight: 600; }
.modal-actions { display:flex; justify-content:flex-end; gap: 10px; }

.toast {
  position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
  background: var(--bg-mid); border: 1px solid var(--border-strong);
  padding: 12px 22px; font-family:'Cinzel', serif; font-size: 0.78rem;
  letter-spacing: 0.2em; text-transform: uppercase; z-index: 2000;
  animation: toastIn .25s cubic-bezier(.22,1,.36,1);
  box-shadow: 0 12px 32px oklch(0.05 0.04 268 / 0.6);
}

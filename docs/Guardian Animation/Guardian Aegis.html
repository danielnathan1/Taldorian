<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Taldorian TCG — Égide do Guardião</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,400;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #05050a;
    font-family: 'Cinzel', serif;
    display: flex; align-items: center; justify-content: center;
  }

  #stage-wrap {
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  #stage {
    width: 1280px; height: 720px;
    transform-origin: center center;
    position: relative;
    overflow: hidden;
    background: #0a0a12;
  }

  .bg-opponent {
    position: absolute; top: 0; left: 0; right: 0; height: 50%;
    background:
      radial-gradient(ellipse 80% 120% at 50% -10%, oklch(0.28 0.10 15 / 0.22) 0%, transparent 65%),
      linear-gradient(180deg, oklch(0.09 0.05 12) 0%, oklch(0.08 0.04 260) 100%);
  }
  .bg-player {
    position: absolute; bottom: 0; left: 0; right: 0; height: 50%;
    background:
      radial-gradient(ellipse 80% 120% at 50% 110%, oklch(0.32 0.13 220 / 0.20) 0%, transparent 65%),
      linear-gradient(0deg, oklch(0.09 0.05 220) 0%, oklch(0.08 0.04 260) 100%);
  }
  .bg-center-line {
    position: absolute; top: 50%; left: 0; right: 0;
    height: 1px; margin-top: -0.5px;
    background: linear-gradient(90deg,
      transparent 0%, oklch(0.73 0.13 78 / 0.25) 20%,
      oklch(0.73 0.13 78 / 0.50) 50%,
      oklch(0.73 0.13 78 / 0.25) 80%, transparent 100%);
  }
  .bg-noise {
    position: absolute; inset: 0; opacity: 0.025; pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 256px;
  }

  .half-label {
    position: absolute; left: 0; right: 0; text-align: center;
    font-family: 'Cinzel', serif; font-size: 9px;
    letter-spacing: 0.35em; text-transform: uppercase; opacity: 0.30;
    pointer-events: none;
  }
  .half-label.opp { top: 14px; color: oklch(0.65 0.18 15); }
  .half-label.pl  { bottom: 14px; color: oklch(0.70 0.13 220); }

  /* ── Slots ── */
  .slot {
    position: absolute;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .slot-card {
    border: 1px solid var(--slot-border);
    background: var(--slot-bg);
    position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .slot-label {
    font-family: 'Cinzel', serif; font-size: 8px;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--slot-label-color); white-space: nowrap;
  }
  .size-std    .slot-card { width: 70px; height: 98px; }
  .size-sm     .slot-card { width: 58px; height: 81px; }
  .size-active .slot-card { width: 90px; height: 126px; }
  .theme-player {
    --slot-border:      oklch(0.55 0.14 220 / 0.45);
    --slot-bg:          oklch(0.10 0.04 220 / 0.60);
    --slot-label-color: oklch(0.65 0.13 220);
  }
  .theme-opponent {
    --slot-border:      oklch(0.55 0.20 15 / 0.40);
    --slot-bg:          oklch(0.10 0.04 15 / 0.55);
    --slot-label-color: oklch(0.60 0.18 15);
  }
  .hp-bar {
    position: absolute; bottom: 0; left: 0; right: 0; height: 3px;
    background: oklch(0.15 0.04 268);
  }
  .hp-fill {
    height: 100%;
    background: linear-gradient(90deg, oklch(0.55 0.16 220), oklch(0.78 0.14 215));
    transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .hp-fill.enemy {
    background: linear-gradient(90deg, oklch(0.55 0.22 15), oklch(0.72 0.18 15));
  }

  /* ── Ability banner ── */
  .ability-banner {
    position: absolute; left: 50%; top: calc(50% - 22px);
    transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    pointer-events: none; z-index: 50;
    opacity: 0; transition: opacity 0.3s;
  }
  .ability-name {
    font-family: 'Cinzel Decorative', serif;
    font-size: 28px; font-weight: 700;
    color: oklch(0.92 0.10 215);
    letter-spacing: 0.18em; text-transform: uppercase;
    text-shadow:
      0 0 18px oklch(0.80 0.14 220 / 0.85),
      0 2px 0 oklch(0.20 0.06 240 / 0.7);
  }
  .ability-sub {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 0.45em; text-transform: uppercase;
    color: oklch(0.78 0.10 215); opacity: 0.85;
  }
  .ability-rule {
    width: 280px; height: 1px;
    background: linear-gradient(90deg,
      transparent, oklch(0.80 0.14 220 / 0.7), transparent);
    margin-top: 4px;
  }

  .fx-layer {
    position: absolute; inset: 0;
    pointer-events: none;
  }

  /* ── Protective dome ── */
  .dome {
    position: absolute;
    transform: translate(-50%, -50%);
    pointer-events: none;
    transform-origin: center center;
  }

  /* shield "ward" popup */
  .ward-pop {
    position: absolute;
    transform: translate(-50%, -50%);
    font-family: 'Cinzel Decorative', serif;
    font-size: 18px; font-weight: 700;
    color: oklch(0.92 0.12 215);
    text-shadow:
      0 0 14px oklch(0.80 0.16 220),
      0 2px 0 oklch(0.20 0.06 240);
    pointer-events: none;
    letter-spacing: 0.05em;
    white-space: nowrap;
  }

  .screen-flash {
    position: absolute; inset: 0;
    background: oklch(0.95 0.08 215);
    mix-blend-mode: screen;
    pointer-events: none;
  }
  .impact-vignette {
    position: absolute; inset: 0;
    pointer-events: none;
    box-shadow: inset 0 0 180px 40px oklch(0.10 0.05 240 / 0.55);
  }

  /* ── Controls ── */
  .controls {
    position: fixed; bottom: 22px; left: 50%;
    transform: translateX(-50%);
    display: flex; align-items: center; gap: 14px;
    padding: 10px 18px;
    background: oklch(0.10 0.03 268 / 0.85);
    border: 1px solid oklch(0.73 0.13 78 / 0.30);
    backdrop-filter: blur(8px);
    z-index: 1000;
    font-family: 'JetBrains Mono', monospace;
  }
  .ctrl-btn {
    background: oklch(0.16 0.05 268 / 0.9);
    color: oklch(0.82 0.16 80);
    border: 1px solid oklch(0.73 0.13 78 / 0.45);
    padding: 6px 14px;
    font-family: 'Cinzel', serif;
    font-size: 10px; font-weight: 700;
    letter-spacing: 0.2em; text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
  }
  .ctrl-btn:hover {
    background: oklch(0.22 0.06 268 / 0.95);
    border-color: oklch(0.73 0.13 78 / 0.8);
    box-shadow: 0 0 14px oklch(0.73 0.13 78 / 0.30);
  }
  .ctrl-btn.primary {
    background: linear-gradient(180deg, oklch(0.30 0.12 220 / 0.9), oklch(0.18 0.07 220 / 0.9));
    color: oklch(0.92 0.10 215);
    border-color: oklch(0.65 0.16 220 / 0.7);
  }
  .ctrl-btn.primary:hover {
    box-shadow: 0 0 18px oklch(0.65 0.16 220 / 0.5);
  }
  .ctrl-scrub {
    width: 220px; accent-color: oklch(0.78 0.14 220);
  }
  .ctrl-label {
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: oklch(0.65 0.10 78);
  }
  .ctrl-time {
    color: oklch(0.82 0.16 80);
    font-size: 10px;
    min-width: 48px;
  }
</style>
</head>
<body>
<div id="stage-wrap">
  <div id="stage">
    <div id="root" style="position:absolute;inset:0;"></div>
  </div>
</div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ───────────────────────────────────────────────────────────────────────────────
//  Geometry
// ───────────────────────────────────────────────────────────────────────────────
const STAGE_W = 1280;
const STAGE_H = 720;

// Guardian = active hero on bottom-center
const GUARDIAN = { x: 720, y: 540, w: 90, h: 126 };
const IMPACT_PT = { x: 720, y: 600 };   // base of the guardian card — where it strikes

// The "other" allies who receive the protective domes
const ALLIES = [
  { x: 360, y: 540, key: 'cavaleiro', label: 'Cavaleiro' },
  { x: 450, y: 540, key: 'arqueiro',  label: 'Arqueiro'  },
  { x: 540, y: 540, key: 'maga',      label: 'Maga'      },
];

// ───────────────────────────────────────────────────────────────────────────────
//  Timing (seconds)
// ───────────────────────────────────────────────────────────────────────────────
const T = {
  CHARGE_START : 0.0,
  CHARGE_END   : 0.80,   // anticipation / glow build
  RISE_START   : 0.80,
  RISE_PEAK    : 1.48,   // top of the lift
  SLAM_START   : 1.48,
  IMPACT       : 1.66,   // card strikes the board
  SETTLE_END   : 1.98,   // overshoot settles
  SHAKE_END    : 2.02,
  DOME_START   : 1.74,   // first dome begins forming, just after impact
  DOME_STAGGER : 0.11,
  DOME_FORM    : 0.55,
  BANNER_IN    : 0.25,
  BANNER_OUT   : 3.30,
  HOLD_END     : 4.70,
};
const LOOP_END = T.HOLD_END + 1.4;

// ───────────────────────────────────────────────────────────────────────────────
//  Utilities
// ───────────────────────────────────────────────────────────────────────────────
const clamp01 = x => Math.max(0, Math.min(1, x));
const easeOutCubic   = t => 1 - Math.pow(1 - t, 3);
const easeOutQuart   = t => 1 - Math.pow(1 - t, 4);
const easeInQuad     = t => t * t;
const easeInCubic    = t => t * t * t;
const easeInOutCubic = t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
const easeOutBack    = (t, s = 1.7) => { const c = s + 1; return 1 + c*Math.pow(t-1,3) + s*Math.pow(t-1,2); };

function mulberry32(seed) {
  return function() {
    let t = (seed += 0x6D2B79F5);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Pre-computed dust / debris kicked up on impact
const DUST = (() => {
  const rng = mulberry32(7);
  const list = [];
  for (let i = 0; i < 26; i++) {
    const ang = Math.PI + rng() * Math.PI;        // upward hemisphere (-x..+x, up)
    const spread = (rng() - 0.5) * Math.PI * 1.1; // fan around upward
    const a = -Math.PI/2 + spread;
    const speed = 120 + rng() * 240;
    list.push({
      id: i,
      vx: Math.cos(a) * speed,
      vy: Math.sin(a) * speed - 60,   // bias upward
      size: 1.4 + rng() * 3.2,
      life: 0.5 + rng() * 0.5,
      rot: rng() * 6.28,
    });
  }
  return list;
})();

// Pre-computed ground cracks radiating from impact
const CRACKS = (() => {
  const rng = mulberry32(21);
  const list = [];
  const n = 9;
  for (let i = 0; i < n; i++) {
    const baseA = (i / n) * Math.PI * 2 + (rng() - 0.5) * 0.3;
    const len = 130 + rng() * 150;
    // build a slightly jagged polyline
    const pts = [];
    let x = 0, y = 0;
    const steps = 4;
    for (let s = 1; s <= steps; s++) {
      const seg = (len / steps);
      const jitter = (rng() - 0.5) * 0.5;
      x += Math.cos(baseA + jitter) * seg;
      y += Math.sin(baseA + jitter) * seg * 0.42; // flatten vertically (ground perspective)
      pts.push({ x, y });
    }
    list.push({ id: i, pts, len });
  }
  return list;
})();

// ───────────────────────────────────────────────────────────────────────────────
//  Board markup
// ───────────────────────────────────────────────────────────────────────────────
function StaticBoard({ guardian }) {
  const opp = [
    { x: 100, y: 130, size: 'sm',     label: 'Deck' },
    { x: 100, y: 232, size: 'sm',     label: 'Cemitério' },
    { x: 380, y: 200, size: 'std',    label: 'Herói 3', hp: 30, enemy: true },
    { x: 470, y: 200, size: 'std',    label: 'Herói 2', hp: 55, enemy: true },
    { x: 560, y: 200, size: 'std',    label: 'Herói 1', hp: 80, enemy: true },
    { x: 720, y: 200, size: 'active', label: 'Herói Ativo', hp: 70, enemy: true },
    { x: 1180, y: 180, size: 'std',   label: 'Arsenal' },
  ];
  const player = [
    { x: 100, y: 540, size: 'std',    label: 'Arsenal' },
    { x: 360, y: 540, size: 'std',    label: 'Cavaleiro', hp: 64 },
    { x: 450, y: 540, size: 'std',    label: 'Arqueiro',  hp: 78 },
    { x: 540, y: 540, size: 'std',    label: 'Maga',      hp: 52 },
    { x: 1180, y: 510, size: 'sm',    label: 'Deck' },
    { x: 1180, y: 612, size: 'sm',    label: 'Cemitério' },
  ];

  return (
    <>
      {opp.map((s, i) => <Slot key={'o'+i} theme="opponent" {...s} />)}
      {player.map((s, i) => <Slot key={'p'+i} theme="player" {...s} />)}
      {/* Guardian (active) rendered separately so it can lift & slam */}
      <Slot theme="player" size="active" label="Guardião" x={GUARDIAN.x} y={GUARDIAN.y}
            hp={88} cardTransform={guardian.transform} cardStyle={guardian.cardStyle} />
    </>
  );
}

function Slot({ x, y, size, label, theme, hp, enemy, cardTransform, cardStyle }) {
  return (
    <div className={`slot size-${size} theme-${theme}`} style={{ left: x, top: y }}>
      <div className="slot-card"
           style={{ transform: cardTransform, transformOrigin: 'center bottom', ...(cardStyle || {}) }}>
        <CardArt theme={theme} size={size} label={label} />
        {hp !== undefined && (
          <div className="hp-bar">
            <div className={`hp-fill ${enemy ? 'enemy' : ''}`} style={{ width: `${hp}%` }} />
          </div>
        )}
      </div>
      <div className="slot-label">{label}</div>
    </div>
  );
}

function CardArt({ theme, size, label }) {
  const accent = theme === 'player'
    ? 'oklch(0.55 0.14 220 / 0.55)'
    : 'oklch(0.55 0.20 15 / 0.55)';
  const w = size === 'active' ? 90 : size === 'sm' ? 58 : 70;
  const h = size === 'active' ? 126 : size === 'sm' ? 81 : 98;
  const cx = w/2, cy = h/2;

  if (label === 'Guardião') {
    return (
      <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} fill="none" style={{ position: 'absolute', inset: 0 }}>
        <rect x="3" y="3" width={w-6} height={h-6} stroke="oklch(0.70 0.14 220 / 0.65)" strokeWidth="0.6"/>
        {/* large heater shield */}
        <path d={`M ${cx-18} ${cy-22} L ${cx+18} ${cy-22} L ${cx+16} ${cy+6} L ${cx} ${cy+24} L ${cx-16} ${cy+6} Z`}
              stroke="oklch(0.82 0.14 215 / 0.9)" strokeWidth="1.1" fill="oklch(0.55 0.12 220 / 0.18)"/>
        <line x1={cx} y1={cy-22} x2={cx} y2={cy+24} stroke="oklch(0.82 0.14 215 / 0.7)" strokeWidth="0.7"/>
        <line x1={cx-17} y1={cy-8} x2={cx+17} y2={cy-8} stroke="oklch(0.82 0.14 215 / 0.7)" strokeWidth="0.7"/>
        <circle cx={cx} cy={cy-8} r="4.5" stroke="oklch(0.85 0.14 80 / 0.95)" strokeWidth="0.9" fill="none"/>
        <rect x="6" y={h - 22} width={w-12} height="12" fill="oklch(0.08 0.04 240 / 0.7)"
              stroke="oklch(0.65 0.16 220 / 0.4)" strokeWidth="0.4"/>
      </svg>
    );
  }
  if (label === 'Arqueiro') {
    return (
      <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} fill="none" style={{ position: 'absolute', inset: 0 }}>
        <rect x="3" y="3" width={w-6} height={h-6} stroke={accent} strokeWidth="0.6"/>
        <path d={`M ${w/2 - 14} ${h/2 - 18} Q ${w/2 - 26} ${h/2}, ${w/2 - 14} ${h/2 + 18}`}
              stroke="oklch(0.82 0.16 80 / 0.85)" strokeWidth="1.4" fill="none" strokeLinecap="round"/>
        <line x1={w/2 - 6} y1={h/2} x2={w/2 + 20} y2={h/2}
              stroke="oklch(0.85 0.10 78 / 0.95)" strokeWidth="1.0"/>
        <path d={`M ${w/2 + 20} ${h/2} l -3 -2 l 0 4 z`} fill="oklch(0.85 0.10 78)"/>
      </svg>
    );
  }
  if (label === 'Cavaleiro') {
    return (
      <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} fill="none" style={{ position: 'absolute', inset: 0 }}>
        <rect x="3" y="3" width={w-6} height={h-6} stroke={accent} strokeWidth="0.6"/>
        <line x1={w/2} y1={h/2 - 22} x2={w/2} y2={h/2 + 18}
              stroke="oklch(0.80 0.04 240 / 0.95)" strokeWidth="1.4" strokeLinecap="round"/>
        <line x1={w/2 - 8} y1={h/2 + 18} x2={w/2 + 8} y2={h/2 + 18}
              stroke="oklch(0.65 0.10 60 / 0.9)" strokeWidth="1.6"/>
        <path d={`M ${w/2 - 14} ${h/2 - 6} L ${w/2 + 14} ${h/2 - 6} L ${w/2 + 12} ${h/2 + 8} L ${w/2} ${h/2 + 16} L ${w/2 - 12} ${h/2 + 8} Z`}
              stroke="oklch(0.65 0.14 200 / 0.75)" strokeWidth="0.5" fill="none"/>
      </svg>
    );
  }
  if (label === 'Maga') {
    return (
      <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} fill="none" style={{ position: 'absolute', inset: 0 }}>
        <rect x="3" y="3" width={w-6} height={h-6} stroke={accent} strokeWidth="0.6"/>
        <path d={`M ${w/2} ${h/2 - 22} L ${w/2 + 12} ${h/2 - 4} L ${w/2 - 12} ${h/2 - 4} Z`}
              stroke="oklch(0.65 0.18 290 / 0.85)" strokeWidth="0.6" fill="none"/>
        <path d={`M ${w/2} ${h/2 + 6} l 3 6 l 6 1 l -4.5 4 l 1 6 l -5.5 -3 l -5.5 3 l 1 -6 l -4.5 -4 l 6 -1 z`}
              fill="none" stroke="oklch(0.85 0.16 290 / 0.85)" strokeWidth="0.5"/>
      </svg>
    );
  }
  return (
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} fill="none" style={{ position: 'absolute', inset: 0 }}>
      <rect x="3" y="3" width={w-6} height={h-6} stroke={accent} strokeWidth="0.5" opacity="0.6"/>
      <path d={`M ${w/2} ${h*0.18} L ${w*0.78} ${h*0.5} L ${w/2} ${h*0.82} L ${w*0.22} ${h*0.5} Z`}
            stroke={accent} strokeWidth="0.5" fill="none" opacity="0.8"/>
      <circle cx={w/2} cy={h*0.5} r={w*0.14} stroke={accent} strokeWidth="0.4" fill="none"/>
      <circle cx={w/2} cy={h*0.5} r={w*0.04} fill={accent}/>
    </svg>
  );
}

// ───────────────────────────────────────────────────────────────────────────────
//  Animation derivation
// ───────────────────────────────────────────────────────────────────────────────
function guardianMotion(t) {
  // returns { y, scale, glow }  — y in px (negative = up)
  let y = 0, scale = 1;
  if (t < T.CHARGE_START) {
    y = 0;
  } else if (t < T.CHARGE_END) {
    // anticipation crouch — dip down a touch
    const u = clamp01((t - T.CHARGE_START) / (T.CHARGE_END - T.CHARGE_START));
    y = easeInOutCubic(u) * 9;
    scale = 1 - 0.02 * easeInOutCubic(u);
  } else if (t < T.RISE_PEAK) {
    const u = clamp01((t - T.RISE_START) / (T.RISE_PEAK - T.RISE_START));
    y = 9 + (-62 - 9) * easeOutCubic(u);
    scale = 0.98 + 0.10 * easeOutCubic(u);
  } else if (t < T.IMPACT) {
    const u = clamp01((t - T.SLAM_START) / (T.IMPACT - T.SLAM_START));
    y = -62 + (12 + 62) * easeInCubic(u);   // fast downward slam, overshoot to +12
    scale = 1.08 - 0.12 * u;                 // squash on the way down
  } else if (t < T.SETTLE_END) {
    const u = clamp01((t - T.IMPACT) / (T.SETTLE_END - T.IMPACT));
    y = 12 * (1 - easeOutBack(u));           // spring back up to 0
    scale = 0.96 + 0.04 * easeOutCubic(u);
  } else {
    y = 0; scale = 1;
  }

  // glow: builds through charge, flares at impact, lingers
  let glow = 0;
  if (t < T.CHARGE_END) glow = easeInQuad(clamp01(t / T.CHARGE_END)) * 0.7;
  else if (t < T.RISE_PEAK) glow = 0.7 + 0.3 * clamp01((t - T.RISE_START) / (T.RISE_PEAK - T.RISE_START));
  else if (t < T.IMPACT) glow = 1;
  else if (t < T.IMPACT + 0.6) glow = 1 - 0.7 * ((t - T.IMPACT) / 0.6);
  else glow = Math.max(0, 0.3 - (t - (T.IMPACT + 0.6)) * 0.5);

  return { y, scale, glow };
}

function deriveScene(t) {
  const g = guardianMotion(t);

  // squash/stretch: vertical scale opposes horizontal a little near impact
  const squashU = (t >= T.SLAM_START && t < T.SETTLE_END)
    ? clamp01((t - T.SLAM_START) / (T.SETTLE_END - T.SLAM_START)) : 0;
  let sx = g.scale, sy = g.scale;
  if (t >= T.SLAM_START && t < T.IMPACT) {           // stretch tall while falling
    sy = g.scale * 1.06; sx = g.scale * 0.96;
  } else if (t >= T.IMPACT && t < T.IMPACT + 0.16) { // squash flat on hit
    sy = g.scale * 0.82; sx = g.scale * 1.16;
  }

  // Banner
  const bannerShow = t >= T.BANNER_IN && t < T.BANNER_OUT;
  const bIn  = clamp01((t - T.BANNER_IN) / 0.35);
  const bOut = clamp01((T.BANNER_OUT - t) / 0.45);
  const bannerOpacity = bannerShow ? Math.min(bIn, bOut) : 0;
  const bannerLabel = t < T.IMPACT ? 'Invocando a guarda' : 'Aliados protegidos';

  // Screen shake on impact
  let shake = { x: 0, y: 0 };
  if (t >= T.IMPACT && t < T.SHAKE_END) {
    const u = clamp01((t - T.IMPACT) / (T.SHAKE_END - T.IMPACT));
    const amp = 9 * (1 - u);
    shake.x = Math.sin(t * 92) * amp;
    shake.y = Math.cos(t * 78) * amp * 0.7;
  }

  // Screen flash at impact
  let flash = 0;
  if (t >= T.IMPACT && t < T.IMPACT + 0.3) {
    flash = (1 - (t - T.IMPACT) / 0.3) * 0.34;
  }

  // Shockwave rings from impact point — flat ellipses sweeping outward
  const shocks = [];
  for (let i = 0; i < 3; i++) {
    const start = T.IMPACT + i * 0.09;
    const dur = 0.95;
    const u = (t - start) / dur;
    if (u > 0 && u < 1) {
      const r = 20 + easeOutQuart(u) * 640;
      shocks.push({ id: i, r, op: (1 - u) * 0.8, sw: 2 + (1 - u) * 3 });
    }
  }

  // Ground cracks reveal
  let crackReveal = 0, crackOp = 0;
  if (t >= T.IMPACT) {
    crackReveal = clamp01((t - T.IMPACT) / 0.18);
    crackOp = Math.max(0, 1 - (t - T.IMPACT - 0.5) / 1.0);
  }

  // Dust
  const dust = [];
  if (t >= T.IMPACT) {
    for (const d of DUST) {
      const age = t - T.IMPACT;
      if (age > d.life) continue;
      const u = age;
      const x = IMPACT_PT.x + d.vx * u;
      const y = IMPACT_PT.y + d.vy * u + 200 * u * u; // gravity
      dust.push({
        id: d.id, x, y, size: d.size,
        op: clamp01(1 - age / d.life) * 0.75,
      });
    }
  }

  // Slam trail (motion blur streak above card while descending)
  let trail = 0;
  if (t >= T.SLAM_START && t < T.IMPACT) {
    trail = clamp01((t - T.SLAM_START) / (T.IMPACT - T.SLAM_START));
  }

  // Domes — staggered formation per ally, then idle shimmer
  const domes = ALLIES.map((a, i) => {
    const start = T.DOME_START + i * T.DOME_STAGGER;
    const u = clamp01((t - start) / T.DOME_FORM);
    if (t < start) return { key: a.key, x: a.x, y: a.y, prog: 0, idle: 0, snap: 0, label: a.label, present: false };
    const prog = easeOutBack(u, 2.0);             // pop-in with overshoot
    const opacity = clamp01((t - start) / 0.18);
    const idle = t - start;                        // seconds since formed (for shimmer)
    const snap = (u < 0.32) ? (1 - u / 0.32) : 0;  // bright flash ring as it snaps in
    return { key: a.key, x: a.x, y: a.y, prog, opacity, idle, snap, label: a.label, present: true };
  });

  // Ward "+Escudo" popups above each ally as dome forms
  const wards = [];
  for (let i = 0; i < ALLIES.length; i++) {
    const a = ALLIES[i];
    const start = T.DOME_START + i * T.DOME_STAGGER + 0.05;
    const age = t - start;
    if (age > 0 && age < 1.25) {
      const u = age / 1.25;
      wards.push({
        key: a.key, x: a.x, y: a.y - 70 - u * 34,
        op: u < 0.18 ? u / 0.18 : (1 - (u - 0.18) / 0.82),
      });
    }
  }

  return {
    guardian: { y: g.y, sx, sy, glow: g.glow },
    bannerOpacity, bannerLabel,
    shake, flash,
    shocks, crackReveal, crackOp, dust, trail,
    domes, wards,
    impactGlow: clamp01(1 - (t - T.IMPACT) / 0.8) * (t >= T.IMPACT ? 1 : 0),
  };
}

// ───────────────────────────────────────────────────────────────────────────────
//  Visual primitives
// ───────────────────────────────────────────────────────────────────────────────
function Shockwave({ x, y, r, op, sw }) {
  // flat-ish ellipse to sit on the "ground"
  return (
    <g transform={`translate(${x} ${y})`}>
      <ellipse rx={r} ry={r * 0.42} fill="none"
               stroke={`oklch(0.92 0.10 215 / ${op})`} strokeWidth={sw}/>
      <ellipse rx={r} ry={r * 0.42} fill="none"
               stroke={`oklch(0.80 0.14 220 / ${op * 0.5})`} strokeWidth={sw + 4}/>
    </g>
  );
}

// One protective dome over an ally
function Dome({ x, y, prog, opacity, idle, snap, label }) {
  const W = 116, H = 138;
  const pulse = 0.5 + 0.5 * Math.sin(idle * 2.4);          // slow breathing
  const rimOp = 0.55 + 0.30 * pulse;
  const shimmerAngle = (idle * 60) % 360;                   // rotating specular band
  const cx = W/2, cy = H/2;

  return (
    <div className="dome" style={{
      left: x, top: y,
      width: W, height: H,
      opacity: opacity ?? 0,
      transform: `translate(-50%, -50%) scale(${prog})`,
    }}>
      {/* soft outer bloom */}
      <div style={{
        position: 'absolute', inset: -10,
        borderRadius: '50%',
        background: `radial-gradient(ellipse at 50% 45%,
          oklch(0.80 0.14 220 / ${0.10 * rimOp}) 0%,
          transparent 70%)`,
        filter: 'blur(3px)',
      }}/>
      <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`} style={{ position: 'absolute', inset: 0 }}>
        <defs>
          <radialGradient id={`glass-${label}`} cx="42%" cy="34%" r="68%">
            <stop offset="0%"  stopColor="oklch(0.92 0.07 215 / 0.30)"/>
            <stop offset="48%" stopColor="oklch(0.62 0.12 222 / 0.14)"/>
            <stop offset="82%" stopColor="oklch(0.55 0.13 224 / 0.20)"/>
            <stop offset="100%" stopColor="oklch(0.72 0.14 218 / 0.30)"/>
          </radialGradient>
          <linearGradient id={`shimmer-${label}`} x1="0" y1="0" x2="1" y2="1"
              gradientTransform={`rotate(${shimmerAngle} 0.5 0.5)`}>
            <stop offset="0%"   stopColor="oklch(0.98 0.04 215 / 0)"/>
            <stop offset="48%"  stopColor="oklch(0.98 0.05 215 / 0)"/>
            <stop offset="55%"  stopColor={`oklch(0.98 0.06 215 / ${0.22 * rimOp})`}/>
            <stop offset="62%"  stopColor="oklch(0.98 0.05 215 / 0)"/>
            <stop offset="100%" stopColor="oklch(0.98 0.04 215 / 0)"/>
          </linearGradient>
        </defs>

        {/* glass sphere body */}
        <ellipse cx={cx} cy={cy} rx={W/2 - 3} ry={H/2 - 3} fill={`url(#glass-${label})`}/>
        {/* rotating shimmer band */}
        <ellipse cx={cx} cy={cy} rx={W/2 - 3} ry={H/2 - 3} fill={`url(#shimmer-${label})`}/>

        {/* latitude/longitude ward lines */}
        <g stroke={`oklch(0.85 0.12 218 / ${0.30 * rimOp})`} strokeWidth="0.7" fill="none">
          <ellipse cx={cx} cy={cy} rx={(W/2 - 3) * 0.55} ry={H/2 - 3}/>
          <ellipse cx={cx} cy={cy} rx={W/2 - 3} ry={(H/2 - 3) * 0.42}/>
          <ellipse cx={cx} cy={cy} rx={W/2 - 3} ry={(H/2 - 3) * 0.74}/>
        </g>

        {/* rim */}
        <ellipse cx={cx} cy={cy} rx={W/2 - 3} ry={H/2 - 3} fill="none"
                 stroke={`oklch(0.86 0.13 216 / ${rimOp})`} strokeWidth="1.4"/>
        {/* specular highlight (top-left) */}
        <ellipse cx={cx - 22} cy={cy - 34} rx="16" ry="22" fill="oklch(0.99 0.03 215 / 0.32)"
                 transform={`rotate(-28 ${cx-22} ${cy-34})`}/>

        {/* central shield emblem */}
        <ShieldEmblem cx={cx} cy={cy} op={0.55 + 0.35 * pulse}/>
      </svg>

      {/* snap-in flash ring */}
      {snap > 0 && (
        <div style={{
          position: 'absolute', left: '50%', top: '50%',
          width: W * (1 + snap * 0.5), height: H * (1 + snap * 0.5),
          transform: 'translate(-50%, -50%)',
          borderRadius: '50%',
          border: `2px solid oklch(0.95 0.08 215 / ${snap * 0.9})`,
          boxShadow: `0 0 24px oklch(0.85 0.14 220 / ${snap * 0.7})`,
        }}/>
      )}
    </div>
  );
}

function ShieldEmblem({ cx, cy, op }) {
  const s = 1.0;
  const top = cy - 24 * s, bot = cy + 26 * s, wsh = 19 * s;
  return (
    <g opacity={op}>
      <path d={`M ${cx-wsh} ${top} L ${cx+wsh} ${top} L ${cx+wsh*0.86} ${cy+6*s} L ${cx} ${bot} L ${cx-wsh*0.86} ${cy+6*s} Z`}
            fill="oklch(0.70 0.13 220 / 0.20)"
            stroke="oklch(0.88 0.13 215 / 0.95)" strokeWidth="1.5" strokeLinejoin="round"/>
      <line x1={cx} y1={top} x2={cx} y2={bot} stroke="oklch(0.90 0.12 215 / 0.7)" strokeWidth="1"/>
      <line x1={cx-wsh*0.9} y1={cy-7*s} x2={cx+wsh*0.9} y2={cy-7*s} stroke="oklch(0.90 0.12 215 / 0.7)" strokeWidth="1"/>
      {/* gold boss */}
      <circle cx={cx} cy={cy - 7*s} r={5*s} fill="oklch(0.78 0.13 80 / 0.30)"
              stroke="oklch(0.86 0.14 80 / 0.95)" strokeWidth="1.2"/>
    </g>
  );
}

// ───────────────────────────────────────────────────────────────────────────────
//  Guardian overlay (glow halo + slam trail) — separate from the lifting card
// ───────────────────────────────────────────────────────────────────────────────
function GuardianFX({ glow, trail, liftY }) {
  const x = GUARDIAN.x;
  const cardTop = GUARDIAN.y + liftY;   // card center y
  const glowSize = 80 + glow * 150;
  return (
    <>
      {glow > 0.01 && (
        <div style={{
          position: 'absolute', left: x, top: cardTop - 10,
          width: glowSize, height: glowSize,
          transform: 'translate(-50%, -50%)',
          background: `radial-gradient(circle,
            oklch(0.92 0.12 215 / 0.5) 0%,
            oklch(0.75 0.14 222 / 0.26) 38%,
            transparent 70%)`,
          opacity: 0.9 * glow,
          mixBlendMode: 'screen',
          borderRadius: '50%',
          pointerEvents: 'none',
        }}/>
      )}
      {trail > 0 && (
        <div style={{
          position: 'absolute', left: x, top: cardTop - 70,
          width: 70, height: 90,
          transform: 'translate(-50%, 0)',
          background: 'linear-gradient(0deg, oklch(0.90 0.12 218 / 0.45), transparent)',
          filter: 'blur(5px)',
          opacity: trail,
          mixBlendMode: 'screen',
          pointerEvents: 'none',
        }}/>
      )}
    </>
  );
}

// ───────────────────────────────────────────────────────────────────────────────
//  App
// ───────────────────────────────────────────────────────────────────────────────
function App() {
  const [t, setT] = useState(0);
  const [playing, setPlaying] = useState(true);
  const rafRef = useRef(null);
  const lastRef = useRef(performance.now());

  useEffect(() => {
    function tick(now) {
      const dt = (now - lastRef.current) / 1000;
      lastRef.current = now;
      if (playing) {
        setT(prev => {
          const next = prev + dt;
          if (next >= LOOP_END) return 0;
          return next;
        });
      }
      rafRef.current = requestAnimationFrame(tick);
    }
    rafRef.current = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(rafRef.current);
  }, [playing]);

  const s = deriveScene(t);
  const gTransform = `translateY(${s.guardian.y}px) scale(${s.guardian.sx}, ${s.guardian.sy})`;
  const gCardStyle = s.guardian.glow > 0.05 ? {
    boxShadow: `0 0 ${18 + s.guardian.glow*30}px oklch(0.85 0.13 218 / ${0.4 + s.guardian.glow*0.4}),
                inset 0 0 ${10 + s.guardian.glow*16}px oklch(0.85 0.13 218 / ${0.2 + s.guardian.glow*0.3})`,
    borderColor: `oklch(0.85 0.13 216 / ${0.5 + s.guardian.glow*0.5})`,
  } : {};

  return (
    <>
      <div id="stage-inner" style={{
        position: 'absolute', inset: 0,
        transform: `translate(${s.shake.x}px, ${s.shake.y}px)`,
      }}>
        <div className="bg-opponent"/>
        <div className="bg-player"/>
        <div className="bg-center-line"/>
        <div className="bg-noise"/>
        <div className="half-label opp">Área do Oponente</div>
        <div className="half-label pl">Sua Área — Aliados Protegidos</div>

        <StaticBoard guardian={{ transform: gTransform, cardStyle: gCardStyle }} />

        {/* Guardian glow + slam trail */}
        <GuardianFX glow={s.guardian.glow} trail={s.trail} liftY={s.guardian.y} />

        {/* Impact ground glow */}
        {s.impactGlow > 0.01 && (
          <div style={{
            position: 'absolute', left: IMPACT_PT.x, top: IMPACT_PT.y,
            width: 260, height: 120,
            transform: 'translate(-50%, -50%)',
            background: `radial-gradient(ellipse at center,
              oklch(0.92 0.10 215 / ${0.5 * s.impactGlow}) 0%, transparent 70%)`,
            mixBlendMode: 'screen', pointerEvents: 'none', borderRadius: '50%',
          }}/>
        )}

        {/* Ability banner */}
        <div className="ability-banner" style={{ opacity: s.bannerOpacity }}>
          <div className="ability-sub">Habilidade Definitiva</div>
          <div className="ability-name">Égide do Guardião</div>
          <div className="ability-rule"/>
          <div className="ability-sub" style={{ marginTop: 6, opacity: 0.7 }}>
            {s.bannerLabel}
          </div>
        </div>

        {/* FX layer — shocks, cracks, dust */}
        <svg className="fx-layer" viewBox={`0 0 ${STAGE_W} ${STAGE_H}`} preserveAspectRatio="none">
          {/* ground cracks */}
          {s.crackReveal > 0 && (
            <g transform={`translate(${IMPACT_PT.x} ${IMPACT_PT.y})`} opacity={s.crackOp}>
              {CRACKS.map(c => {
                const n = Math.max(1, Math.floor(c.pts.length * s.crackReveal));
                const shown = c.pts.slice(0, n);
                const d = `M 0 0 ` + shown.map(p => `L ${p.x} ${p.y}`).join(' ');
                return (
                  <g key={c.id}>
                    <path d={d} fill="none" stroke="oklch(0.92 0.10 215 / 0.55)" strokeWidth="1.6" strokeLinecap="round"/>
                    <path d={d} fill="none" stroke="oklch(0.55 0.12 240 / 0.4)" strokeWidth="3.4" strokeLinecap="round"/>
                  </g>
                );
              })}
            </g>
          )}

          {/* shockwave rings */}
          {s.shocks.map(w => (
            <Shockwave key={'sw'+w.id} x={IMPACT_PT.x} y={IMPACT_PT.y} r={w.r} op={w.op} sw={w.sw}/>
          ))}

          {/* dust */}
          {s.dust.map(d => (
            <circle key={'d'+d.id} cx={d.x} cy={d.y} r={d.size}
                    fill={`oklch(0.82 0.06 220 / ${d.op})`}/>
          ))}
        </svg>

        {/* Protective domes (DOM, above board) */}
        {s.domes.map(d => d.present && (
          <Dome key={'dome'+d.key} x={d.x} y={d.y} prog={d.prog} opacity={d.opacity}
                idle={d.idle} snap={d.snap} label={d.key}/>
        ))}

        {/* Ward popups */}
        {s.wards.map(wp => (
          <div key={'w'+wp.key} className="ward-pop" style={{ left: wp.x, top: wp.y, opacity: wp.op }}>
            ◈ Protegido
          </div>
        ))}

        {/* Screen flash + vignette */}
        {s.flash > 0 && <div className="screen-flash" style={{ opacity: s.flash }}/>}
        {s.flash > 0 && <div className="impact-vignette" style={{ opacity: s.flash * 2 }}/>}
      </div>

      {/* Controls */}
      <div className="controls">
        <button className="ctrl-btn primary" onClick={() => { setT(0); setPlaying(true); }}>
          ↻ Repetir
        </button>
        <button className="ctrl-btn" onClick={() => setPlaying(p => !p)}>
          {playing ? '❚❚ Pausar' : '▶ Tocar'}
        </button>
        <span className="ctrl-label">Tempo</span>
        <input
          type="range"
          className="ctrl-scrub"
          min="0" max={LOOP_END} step="0.01"
          value={t}
          onChange={e => { setT(parseFloat(e.target.value)); setPlaying(false); }}
        />
        <span className="ctrl-time">{t.toFixed(2)}s</span>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<script>
// Scale stage to viewport
(function() {
  const stage = document.getElementById('stage');
  function fit() {
    const vw = window.innerWidth;
    const vh = Math.max(window.innerHeight - 70, 0);
    if (vw <= 0 || vh <= 0) return;
    const s = Math.max(0.01, Math.min(vw / 1280, vh / 720));
    stage.style.transform = `scale(${s})`;
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
  requestAnimationFrame(fit);
  fit();
})();
</script>
</body>
</html>
